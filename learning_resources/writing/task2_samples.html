<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Chan Truong - Task 2 Brainstorming Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5; /* Modern Indigo */
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --secondary: #F3F4F6;
            --text-main: #111827;
            --text-muted: #6B7280;
            --bg-body: #F9FAFB;
            --bg-card: #FFFFFF;
            --border: #E5E7EB;
            --success: #10B981;
            --warning: #F59E0B;
            --brand-gradient: linear-gradient(135deg, #4F46E5, #EC4899);
            --band6-color: #0284C7;
            --band6-bg: #E0F2FE;
            --band8-color: #7C3AED;
            --band8-bg: #EDE9FE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }

        .app-container {
            display: flex;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--bg-body);
        }

        .sidebar {
            width: 380px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 4px 0 24px rgba(0,0,0,0.02);
            z-index: 10;
        }

        .sidebar-header {
            padding: 32px 24px 24px;
            border-bottom: 1px solid var(--border);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--brand-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .sidebar-header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .sidebar-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 52px; /* Align with text */
        }

        .question-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 16px;
        }

        .question-item {
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }

        .question-item:hover {
            background-color: var(--secondary);
        }

        .question-item.active {
            background-color: var(--primary-light);
            border-color: #C7D2FE;
        }

        .question-item-number {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .question-item.active .question-item-number::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .question-item-text {
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-body);
        }

        .content-header {
            padding: 40px 48px 32px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .content-header h2 {
            font-size: 1.6rem;
            color: var(--text-main);
            line-height: 1.5;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .tabs-container {
            background-color: var(--bg-card);
            padding: 0 48px 24px;
            border-bottom: 1px solid var(--border);
        }

        .tabs {
            display: inline-flex;
            background-color: var(--secondary);
            padding: 6px;
            border-radius: 12px;
            gap: 8px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--primary);
            background-color: var(--bg-card);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px 48px;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.4s ease;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .structure-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02), 0 8px 10px -6px rgba(0,0,0,0.01);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .structure-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        .structure-card h3 {
            color: var(--text-main);
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
        }

        .structure-card h3::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--brand-gradient);
            border-radius: 4px;
        }

        .structure-section {
            margin-bottom: 24px;
        }

        .structure-section h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .strategy-box {
            background-color: var(--secondary);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            border-left: 4px solid var(--primary);
        }

        .outline-list {
            list-style: none;
            padding-left: 0;
        }

        .outline-section-title {
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .outline-section-title::before {
            content: '✦';
            color: var(--primary);
            font-size: 0.9rem;
        }

        .outline-points {
            list-style: none;
            margin-top: 8px;
            margin-left: 8px;
            padding-left: 16px;
            border-left: 2px solid var(--border);
        }

        .outline-points li {
            position: relative;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.95rem;
            padding-left: 16px;
        }

        .outline-points li::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 8px;
            width: 8px;
            height: 8px;
            background-color: var(--border);
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .structure-card:hover .outline-points li::before {
            background-color: var(--primary-light);
            border: 2px solid var(--primary);
        }

        .best-for {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ECFDF5;
            color: #065F46;
            padding: 10px 16px;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .vocab-category {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .vocab-category h3 {
            font-size: 1.15rem;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .band6-title { color: var(--band6-color); }
        .band8-title { color: var(--band8-color); }

        .band6-title::before { content: '🎯'; }
        .band8-title::before { content: '🚀'; }

        .vocab-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vocab-item {
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            border-radius: 10px;
            background-color: var(--bg-body);
            transition: transform 0.2s;
        }

        .vocab-item:hover {
            transform: translateX(4px);
        }

        .vocab-phrase {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .band6-phrase { color: var(--band6-color); }
        .band8-phrase { color: var(--band8-color); }

        .vocab-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
            background: radial-gradient(circle at center, var(--bg-card) 0%, var(--bg-body) 100%);
        }

        .welcome-icon {
            width: 96px;
            height: 96px;
            background: var(--brand-gradient);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2);
        }

        .welcome-icon svg {
            width: 48px;
            height: 48px;
            color: white;
        }
        
        .welcome-screen h2 {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 16px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .welcome-screen p {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 500px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-container">
                <div class="brand-icon">ICT</div>
                <h1>IELTS Chan Truong</h1>
            </div>
            <p>Task 2 Brainstorming Engine</p>
        </div>
        <ul class="question-list" id="questionList">

        </ul>
    </aside>

    <main class="main-content">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h2>Elevate Your Essay</h2>
            <p>Select an IELTS Writing Task 2 prompt from the sidebar to explore professional response structures, Band 6, and Band 8 vocabulary.</p>
        </div>

        <!-- Question Content -->
        <div id="questionView" style="display: none; height: 100%; flex-direction: column;">
            <div class="content-header">
                <h2 id="questionText">Question Text Goes Here</h2>
            </div>
            
            <div class="tabs-container">
                <div class="tabs">
                    <button class="tab-btn active" data-target="structures">Response Structures</button>
                    <button class="tab-btn" data-target="band6">Band 6 Vocabulary</button>
                    <button class="tab-btn" data-target="band8">Band 8 Vocabulary</button>
                </div>
            </div>

            <div class="scroll-area">
                <div id="structures" class="tab-pane active"></div>
                <div id="band6" class="tab-pane"></div>
                <div id="band8" class="tab-pane"></div>
            </div>
        </div>
    </main>
</div>

<script>
const ieltsData = [
    {
        id: 1,
        text: "Some people believe that the only responsibility of citizens is to pay taxes. Others argue that citizens have more responsibilities to society than only paying taxes. Discuss both views and give your opinion.",
        structures: [
            {
                name: "Opinion: Favoring View 2 (More Responsibilities)",
                strategy: "Acknowledge the opposing view briefly in the first body paragraph, but dedicate the majority of the essay to arguing that civic duties extend far beyond taxation.",
                outline: [
                    { section: "Introduction", points: ["Hook: Discuss the role of citizens in a modern society.", "Paraphrase both views: paying taxes vs. broader duties.", "Thesis: While taxes are essential, citizens have much broader duties like voting and community support."] },

                ],
                bestFor: "Students who have strong vocabulary related to society, community involvement, and legal systems."
            },
            {
                name: "Opinion: Favoring View 1 (Taxes are Paramount)",
                strategy: "Argue that while other duties exist, paying taxes is the paramount and only mandatory responsibility because it funds the infrastructure that makes society function.",
                outline: [
                    { section: "Introduction", points: ["Hook: Define the fundamental relationship between a government and its people.", "Paraphrase the prompt.", "Thesis: Paying taxes is the only true obligation; all other actions are optional additions."] },
                    { section: "Body Paragraph 1 (View 2)", points: ["Idea: Acknowledge why people value extra duties (volunteering, civic engagement).", "Idea: These actions boost societal morale and build community cohesion."] },
                    { section: "Body Paragraph 2 (View 1 & Opinion)", points: ["Idea: Taxes are the absolute priority for survival.", "Idea: Without tax revenue, the state collapses and order is lost.", "Idea: Individual volunteering is essentially powerless without state-funded infrastructure."] },
                    { section: "Conclusion", points: ["Summarize the core contrast.", "Reiterate thesis: while extra civic duties are positive, taxation is the only mandatory, foundational requirement."] }
                ],
                bestFor: "Students comfortable writing about economics, government infrastructure, and public services."
            },
            {
                name: "Opinion: Balanced/Shared Responsibility",
                strategy: "Objectively analyze why some focus solely on taxes, then analyze the broader perspective, concluding that both financial and active participation are required.",
                outline: [
                    { section: "Introduction", points: ["Paraphrase the two perspectives.", "Thesis: A successful society requires a synergistic balance of both fiscal duty and active social participation."] },
                    { section: "Body Paragraph 1 (View 1)", points: ["Idea: The necessity of taxes (funding public services, healthcare, national defense).", "Idea: Taxation is a quantifiable and enforceable contribution."] },
                    { section: "Body Paragraph 2 (View 2)", points: ["Idea: The necessity of social duties (moral behavior, grassroots help).", "Idea: Money cannot buy community trust or care for hyper-local issues."] },
                    { section: "Conclusion", points: ["Bring both sides together.", "Final thought: Both views are correct in isolation, but must be combined for a state to truly thrive."] }

                bestFor: "Students who prefer objective analysis and want to clearly fulfill the 'discuss both views' requirement before giving a nuanced opinion."
            }
        ],
        band6: {
            transitions: [
                { phrase: "On the one hand", desc: "Used to introduce the first view (paying taxes)." },
                { phrase: "On the other hand", desc: "Used to introduce the opposing view (more responsibilities)." },
                { phrase: "In my opinion", desc: "A clear marker to state your personal stance." }
            ],
            topic: [
                { phrase: "Pay attention to", desc: "Used to highlight an important duty." },
                { phrase: "Good citizens", desc: "Basic collocation for people who do the right thing." },
                { phrase: "Follow the law", desc: "A primary responsibility besides paying taxes." },
                { phrase: "Public services", desc: "Things funded by taxes (schools, hospitals)." }

            collocations: [
                { phrase: "Important duty", desc: "A task that must be done." },
                { phrase: "Government money", desc: "Funds collected from citizens." },

                { phrase: "Obey rules", desc: "Following societal guidelines." }

        band8: {

                { phrase: "While it is undeniable that...", desc: "Sophisticated concession before presenting the main argument." },
                { phrase: "Conversely, proponents of...", desc: "Advanced transition to the opposing viewpoint." },

            topic: [

                { phrase: "Fiscal contributions", desc: "Precise terminology for paying taxes." },
                { phrase: "Social cohesion", desc: "The degree to which people in a society feel connected." },
                { phrase: "Statutory duties", desc: "Responsibilities required by law." }

            collocations: [

    {
        id: 2,
        text: "Research has shown that the transportation of products and people are the main source of pollution. Some people believe the Government should be in charge of this, while others believe it is the fault of individuals. Discuss both views and give your opinion.",

            {
                name: "Opinion: Favoring Government Intervention",

                    { section: "Introduction", points: ["Paraphrase the issue of transport pollution.", "Thesis: Resolving this issue requires systemic government intervention rather than relying on individual action."] },

                    { section: "Body Paragraph 2 (Government Role & Opinion)", points: ["Idea: Rebut the first view; individuals are trapped in the system provided.", "Idea: Only governments can afford to subsidize and build electric transit/bike lanes.", "Idea: Only governments have the legal authority to enforce emissions laws on corporate freight."] },

            {
                name: "Opinion: Favoring Individual Responsibility",

            {
                name: "Opinion: Balanced (Top-Down, Bottom-Up Approach)",

                { phrase: "However", desc: "To switch between government and individual views." },
                { phrase: "It is clear that", desc: "A simple marker for your opinion." }

            collocations: [

            topic: [

                { phrase: "Legislative frameworks", desc: "Complex sets of laws and regulations." },
                { phrase: "Grassroots initiatives", desc: "Actions taken by ordinary individuals." }

            collocations: [

const questionList = document.getElementById('questionList');
const welcomeScreen = document.getElementById('welcomeScreen');
const questionView = document.getElementById('questionView');
const questionText = document.getElementById('questionText');
const structuresTab = document.getElementById('structures');
const band6Tab = document.getElementById('band6');
const band8Tab = document.getElementById('band8');
const tabBtns = document.querySelectorAll('.tab-btn');

function init() {
    renderSidebar();
    setupTabs();
}

function renderSidebar() {
    ieltsData.forEach((q, index) => {
        const li = document.createElement('li');
        li.className = 'question-item';
        li.innerHTML = `
            <span class="question-item-number">Prompt ${index + 1}</span>
            <span class="question-item-text">${q.text}</span>
        `;
        li.addEventListener('click', () => selectQuestion(q.id, li));
        questionList.appendChild(li);
    });
}

function selectQuestion(id, liElement) {
    document.querySelectorAll('.question-item').forEach(el => el.classList.remove('active'));
    liElement.classList.add('active');

    welcomeScreen.style.display = 'none';
    questionView.style.display = 'flex';

    const data = ieltsData.find(q => q.id === id);
    
    questionText.textContent = data.text;

    renderStructures(data.structures);
    renderVocab(data.band6, band6Tab, 'band6');
    renderVocab(data.band8, band8Tab, 'band8');

    document.querySelector('.tab-btn[data-target="structures"]').click();
}

function renderStructures(structures) {
    structuresTab.innerHTML = '';
    structures.forEach(struct => {
        const card = document.createElement('div');
        card.className = 'structure-card';
        
        let outlineHtml = struct.outline.map(item => `
            <li style="margin-bottom: 20px;">
                <div class="outline-section-title">${item.section}</div>
                <ul class="outline-points">
                    ${item.points.map(p => `<li>${p}</li>`).join('')}
                </ul>
            </li>
        `).join('');
        
        card.innerHTML = `
            <h3>${struct.name}</h3>
            
            <div class="structure-section">
                <h4>Core Strategy</h4>
                <div class="strategy-box">${struct.strategy}</div>
            </div>
            
            <div class="structure-section">
                <h4>Complete Essay Outline</h4>
                <ul class="outline-list">${outlineHtml}</ul>
            </div>
            
            <div class="best-for">
                <span>💡 Best For: ${struct.bestFor}</span>
            </div>
        `;
        structuresTab.appendChild(card);
    });
}

function renderVocab(vocabData, container, levelClass) {
    container.innerHTML = `
        <div class="vocab-grid">
            <div class="vocab-category">
                <h3 class="${levelClass}-title">Transitions & Connectors</h3>
                <ul class="vocab-list">
                    ${vocabData.transitions.map(v => `
                        <li class="vocab-item">
                            <span class="vocab-phrase ${levelClass}-phrase">${v.phrase}</span>
                            <span class="vocab-desc">${v.desc}</span>
                        </li>
                    `).join('')}
                </ul>
            </div>
            
            <div class="vocab-category">
                <h3 class="${levelClass}-title">Topic-Specific Vocabulary</h3>
                <ul class="vocab-list">
                    ${vocabData.topic.map(v => `
                        <li class="vocab-item">
                            <span class="vocab-phrase ${levelClass}-phrase">${v.phrase}</span>
                            <span class="vocab-desc">${v.desc}</span>
                        </li>
                    `).join('')}
                </ul>
            </div>
            
            <div class="vocab-category" style="grid-column: 1 / -1;">
                <h3 class="${levelClass}-title">Essential Collocations</h3>
                <ul class="vocab-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px;">
                    ${vocabData.collocations.map(v => `
                        <li class="vocab-item">
                            <span class="vocab-phrase ${levelClass}-phrase">${v.phrase}</span>
                            <span class="vocab-desc">${v.desc}</span>
                        </li>
                    `).join('')}
                </ul>
            </div>
        </div>
    `;
}

function setupTabs() {
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            tabBtns.forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            
            btn.classList.add('active');
            const targetId = btn.getAttribute('data-target');
            document.getElementById(targetId).classList.add('active');
        });
    });
}

init();
