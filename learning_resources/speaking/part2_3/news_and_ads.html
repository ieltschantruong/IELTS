    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 3D Flip Card CSS */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        .is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Modern Pastel Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 20px; border: 2px solid #fff; } /* pink-300 */
        ::-webkit-scrollbar-thumb:hover { background: #f472b6; } /* pink-400 */
        
        /* Smooth Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Pulse Animation for Recording (Pink/Rose theme) */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

                            <svg class="w-5 h-5 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>

                                <div class="bg-white/20 p-2 rounded-full">

                        <p id="target-time-msg" class="text-sm font-semibold text-slate-400 text-center max-w-sm mt-8 bg-slate-50 px-4 py-2 rounded-full">

                        <!-- Audio Playback & Download -->

                            <div class="text-center">
                                <a id="download-link" href="#" class="inline-flex items-center justify-center w-full gap-3 text-sm font-bold text-white bg-fuchsia-600 hover:bg-fuchsia-700 px-8 py-4 rounded-2xl transition-all shadow-lg shadow-fuchsia-500/30 hover:-translate-y-1">

    <script>
        // --- DATA ---
        const VOCABULARY = [
            { word: "Broadsheet", form: "n", ipa: "/ˈbrɔːd.ʃiːt/", meaning: "A newspaper with a large format, regarded as more serious and less sensationalist than tabloids.", example: "I prefer reading broadsheets because they offer more in-depth analysis of global events." },
            { word: "Tabloid", form: "n", ipa: "/ˈtæb.lɔɪd/", meaning: "A newspaper with a compact page size, often featuring sensationalist stories, gossip, and large photographs.", example: "Tabloids tend to focus more on celebrity scandals than hard news." },
            { word: "Sensationalism", form: "n", ipa: "/senˈseɪ.ʃən.əl.ɪ.zəm/", meaning: "The use of exciting or shocking stories or language at the expense of accuracy, in order to provoke public interest.", example: "The media's reliance on sensationalism often obscures the real facts of a story." },
            { word: "Unbiased", form: "adj", ipa: "/ʌnˈbaɪ.əst/", meaning: "Showing no prejudice; impartial and objective.", example: "It is crucial for journalists to remain unbiased when reporting on political conflicts." },
            { word: "Censorship", form: "n", ipa: "/ˈsen.sə.ʃɪp/", meaning: "The suppression or prohibition of any parts of books, films, news, etc. that are considered politically unacceptable.", example: "Strict censorship laws prevent citizens from accessing diverse viewpoints in that country." },
            { word: "Clickbait", form: "n", ipa: "/ˈklɪk.beɪt/", meaning: "Content whose main purpose is to attract attention and encourage visitors to click on a link to a particular web page.", example: "Many online articles use clickbait headlines that exaggerate the actual content." },
            { word: "Editorial", form: "n", ipa: "/ˌed.ɪˈtɔː.ri.əl/", meaning: "A newspaper article written by or on behalf of an editor that gives an opinion on a topical issue.", example: "The editorial in today's paper strongly condemned the government's new economic policy." },
            { word: "Target audience", form: "n", ipa: "/ˈtɑː.ɡɪt ˈɔː.di.əns/", meaning: "A particular group at which a film, book, advertising campaign, etc., is aimed.", example: "Advertisers carefully research their target audience to ensure their campaigns are effective." },
            { word: "Brand awareness", form: "n", ipa: "/brænd əˈweə.nəs/", meaning: "The extent to which consumers are familiar with the distinctive qualities or image of a particular brand.", example: "The primary goal of this marketing campaign is to increase brand awareness among young adults." },
            { word: "Endorsement", form: "n", ipa: "/ɪnˈdɔːs.mənt/", meaning: "An act of giving one's public approval or support to someone or something, often a celebrity promoting a product.", example: "Celebrity endorsements can significantly boost sales of a product." },
            { word: "Subliminal", form: "adj", ipa: "/ˌsʌbˈlɪm.ɪ.nəl/", meaning: "(Of a stimulus or mental process) below the threshold of sensation or consciousness.", example: "Some argue that advertisements use subliminal messaging to influence consumer behavior." },
            { word: "Persuasive", form: "adj", ipa: "/pəˈsweɪ.sɪv/", meaning: "Good at persuading someone to do or believe something through reasoning or the use of temptation.", example: "The most successful advertisements are those that are highly persuasive." },
            { word: "Slogan", form: "n", ipa: "/ˈsləʊ.ɡən/", meaning: "A memorable motto or phrase used in a commercial or political context as a repetitive expression of an idea.", example: "A catchy slogan can make a brand instantly recognizable." },
            { word: "Jingle", form: "n", ipa: "/ˈdʒɪŋ.ɡəl/", meaning: "A short slogan, verse, or tune designed to be easily remembered, especially as used in advertising.", example: "I can't get that annoying radio jingle out of my head." },
            { word: "Sponsorship", form: "n", ipa: "/ˈspɒn.sə.ʃɪp/", meaning: "Financial support received from a sponsor.", example: "Corporate sponsorship is essential for funding major sporting events." },
            { word: "Word-of-mouth", form: "n", ipa: "/ˌwɜːd.əvˈmaʊθ/", meaning: "Spoken communication as a means of transmitting information.", example: "Many small businesses rely heavily on positive word-of-mouth recommendations." },
            { word: "Mainstream media", form: "n", ipa: "/ˈmeɪn.striːm ˈmiː.di.ə/", meaning: "The traditional mass media, such as newspapers, television, and radio, that reach a wide audience.", example: "Some people prefer alternative news sources because they distrust the mainstream media." },
            { word: "Investigative journalism", form: "n", ipa: "/ɪnˈves.tɪ.ɡə.tɪv ˈdʒɜː.nə.lɪ.zəm/", meaning: "A form of journalism in which reporters deeply investigate a single topic of interest.", example: "Investigative journalism plays a vital role in holding those in power accountable." },
            { word: "Information overload", form: "n", ipa: "/ˌɪn.fəˈmeɪ.ʃən ˈəʊ.və.ləʊd/", meaning: "Exposure to or provision of too much information or data.", example: "With the constant stream of news notifications, many people suffer from information overload." },
            { word: "Verify", form: "v", ipa: "/ˈver.ɪ.faɪ/", meaning: "To make sure or demonstrate that (something) is true, accurate, or justified.", example: "Before sharing an article online, it is important to verify the information with reliable sources." }
        ];

        const EXPRESSIONS = [
            { phrase: "To stay informed / To keep abreast of current affairs", usage: "Part 2/3 - Discussing habits", example: "I make an effort to stay informed by reading a variety of news sources every morning." },
            { phrase: "To be bombarded with advertisements", usage: "Part 3 - Discussing modern life/media", example: "Nowadays, we are constantly bombarded with advertisements on social media and television." },
            { phrase: "A prime time slot", usage: "Part 2/3 - Discussing TV/advertising", example: "Companies pay a premium for a prime time slot because that's when viewership is highest." },
            { phrase: "To fall for a marketing ploy", usage: "Part 3 - Discussing consumerism", example: "It's easy to fall for a marketing ploy when the product promises unrealistic results." },
            { phrase: "To cross the line", usage: "Part 3 - Discussing ethics in media/advertising", example: "Some advertisements cross the line by exploiting people's insecurities." },
            { phrase: "To take something with a grain of salt", usage: "Part 3 - Discussing media literacy", example: "Given the prevalence of fake news, it's wise to take everything you read online with a grain of salt." },
            { phrase: "To shape public opinion", usage: "Part 3 - Discussing the power of media", example: "The media plays a significant role in shaping public opinion on important political issues." },
            { phrase: "A double-edged sword", usage: "Part 3 - Discussing the pros/cons of media/internet", example: "Social media is a double-edged sword; it connects people but can also spread misinformation rapidly." },
            { phrase: "To sugarcoat the truth", usage: "Part 3 - Discussing news reporting", example: "Journalists shouldn't sugarcoat the truth; they need to report the facts objectively." },
            { phrase: "To cater to someone's tastes", usage: "Part 2/3 - Discussing advertising/content creation", example: "Algorithms are designed to cater to our specific tastes by showing us personalized content." },
            { phrase: "To reach a wider demographic", usage: "Part 3 - Discussing marketing strategies", example: "The company launched an online campaign to reach a wider demographic." },
            { phrase: "A captive audience", usage: "Part 2/3 - Discussing advertising (e.g., in cinemas)", example: "Advertisers love cinemas because they have a captive audience waiting for the film to start." },
            { phrase: "To gloss over something", usage: "Part 3 - Discussing news bias", example: "The report tended to gloss over the negative environmental impacts of the project." },
            { phrase: "To blow something out of proportion", usage: "Part 3 - Discussing sensationalism", example: "Tabloids often blow minor celebrity disagreements completely out of proportion." },
            { phrase: "To pry into someone's private life", usage: "Part 3 - Discussing media ethics", example: "The paparazzi frequently pry into the private lives of public figures, which is a gross invasion of privacy." },
            { phrase: "To hold someone accountable", usage: "Part 3 - Discussing the role of journalism", example: "A free press is essential to hold politicians accountable for their actions." },
            { phrase: "A mere marketing gimmick", usage: "Part 3 - Discussing products/advertising", example: "The new feature turned out to be a mere marketing gimmick rather than a useful improvement." },
            { phrase: "To prey on vulnerabilities", usage: "Part 3 - Discussing unethical advertising", example: "Some weight-loss commercials unfortunately prey on people's vulnerabilities." },
            { phrase: "To read between the lines", usage: "Part 3 - Discussing media consumption", example: "When analyzing political speeches, it's often necessary to read between the lines to understand the true message." },
            { phrase: "To gain traction", usage: "Part 2/3 - Discussing news stories/trends", example: "The story quickly gained traction on social media and went viral within hours." }
        ];

        const PRACTICE_QUESTIONS = [
            // PART 2 (10 Questions)
            { type: "Part 2", topic: "Describe an advertisement that you remember well.", prompts: ["Where did you see or hear it?", "What was the advertisement about?", "What made it memorable?", "And explain how you felt about it."], tips: "Focus on describing the visuals, the message (was it a catchy slogan or a jingle?), and your emotional reaction." },
            { type: "Part 2", topic: "Describe a piece of good news you received recently.", prompts: ["What was the news?", "Where did you hear or read about it?", "Who was involved?", "And explain why it was good news."], tips: "Use vocabulary related to the source (mainstream media, word-of-mouth) and express your reaction clearly." },
            { type: "Part 2", topic: "Describe a news source you use frequently.", prompts: ["What source is it (newspaper, website, app)?", "How often do you use it?", "What kind of news do you usually read/watch?", "And explain why you prefer this source over others."], tips: "Mention terms like 'broadsheet', 'tabloid', 'unbiased', or 'stay informed'." },
            { type: "Part 2", topic: "Describe an advertisement that persuaded you to buy something.", prompts: ["What was the product?", "Where did you see the advertisement?", "What did the advertisement show?", "And explain why it was successful in persuading you."], tips: "Discuss 'persuasive' techniques, 'brand awareness', or 'marketing ploys'." },
            { type: "Part 2", topic: "Describe a time you read a news article that made you angry.", prompts: ["What was the article about?", "Where did you read it?", "Who wrote it (if you know)?", "And explain why it made you angry."], tips: "This is a great chance to use words like 'sensationalism', 'blow out of proportion', or 'clickbait'." },
            { type: "Part 2", topic: "Describe a funny advertisement you have seen.", prompts: ["Where did you see it?", "What product or service was it for?", "What happened in the advertisement?", "And explain why you found it funny."], tips: "Talk about the 'target audience' and how humor is used as a 'catchy' tool." },
            { type: "Part 2", topic: "Describe an interesting news story you watched on TV.", prompts: ["What was the story about?", "Which channel was broadcasting it?", "Who was involved in the story?", "And explain why you found it interesting."], tips: "Use 'mainstream media', 'prime time slot', and 'gain traction'." },
            { type: "Part 2", topic: "Describe a time you shared important news with someone.", prompts: ["What was the news?", "Who did you share it with?", "How did you communicate it (phone, text, in person)?", "And explain how the other person reacted."], tips: "Focus on 'word-of-mouth' and emotional communication." },
            { type: "Part 2", topic: "Describe a billboard or outdoor ad that caught your eye.", prompts: ["Where was it located?", "What was it advertising?", "What did it look like?", "And explain why it caught your attention."], tips: "Discuss visual elements, 'slogans', and 'target audience'." },
            { type: "Part 2", topic: "Describe a piece of news you heard about a celebrity.", prompts: ["Who was the celebrity?", "What was the news about?", "Where did you hear it?", "And explain your reaction to this news."], tips: "Perfect for discussing 'paparazzi', 'prying into private lives', and 'endorsements'." },
            
            // PART 3 - Topic 1 (10 Questions)
            { type: "Part 3", topic: "The Influence of Advertising", prompts: ["Do you think advertisements on television are effective?", "How do advertisements influence children's choices?", "Should there be stricter regulations on advertising junk food?", "In what ways do advertisers try to manipulate consumers?", "Do you think celebrity endorsements are effective?", "How has advertising changed since the introduction of the internet?", "Is it ethical to target advertisements specifically at children?", "What are the negative effects of being constantly surrounded by ads?", "Do you think pop-up ads on websites should be banned?", "How will advertising change in the next 10 years?"], tips: "Use expressions like 'bombarded with', 'target audience', 'cater to tastes', and 'double-edged sword'." },
            
            // PART 3 - Topic 2 (10 Questions)
            { type: "Part 3", topic: "News and Society", prompts: ["How has the way people consume news changed in recent years?", "Do you think it's important to read news from multiple sources?", "What are the dangers of fake news or sensationalism?", "Can we trust everything we read in newspapers?", "How do social media algorithms affect the news we see?", "Should journalists have the right to investigate politicians' private lives?", "What is the difference between reading a broadsheet and a tabloid?", "Why do some people prefer watching the news to reading it?", "Is international news as important as local news?", "How can people avoid information overload nowadays?"], tips: "Incorporate terms like 'unbiased', 'information overload', 'verify', and 'take with a grain of salt'." }
        ];

        // --- STATE ---
        let currentFilter = 'all';
        let currentQuestionIdx = 0;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let secondsRecorded = 0;
        let stream = null;

        window.onload = () => {
            renderCards();
            renderQuestionList();
            selectQuestion(0);
        };

        // --- UI FUNCTIONS ---
        function switchTab(tab) {
            document.getElementById('section-study').style.display = tab === 'study' ? 'block' : 'none';
            document.getElementById('section-practice').style.display = tab === 'practice' ? 'flex' : 'none';
            
            const btnStudy = document.getElementById('tab-study');
            const btnPractice = document.getElementById('tab-practice');
            
            // Pastel active/inactive states
            const activeClasses = 'flex-1 py-3 px-4 rounded-xl font-bold transition-all duration-300 shadow-sm bg-white text-fuchsia-600 border border-fuchsia-100 flex items-center justify-center gap-2';
            const inactiveClasses = 'flex-1 py-3 px-4 rounded-xl font-medium transition-all duration-300 text-slate-500 hover:text-fuchsia-600 hover:bg-white/50 flex items-center justify-center gap-2 border border-transparent';
            
            if (tab === 'study') {
                btnStudy.className = activeClasses;
                btnPractice.className = inactiveClasses;
                stopRecordingLogic();
            } else {
                btnPractice.className = activeClasses;
                btnStudy.className = inactiveClasses;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            const activeClass = 'px-5 py-2.5 rounded-full text-sm font-bold bg-fuchsia-100 text-fuchsia-700 shadow-sm transition-all';
            const inactiveClass = 'px-5 py-2.5 rounded-full text-sm font-medium text-slate-500 hover:bg-white transition-all hover:shadow-sm';
            
            document.getElementById('filter-all').className = filter === 'all' ? activeClass : inactiveClass;
            document.getElementById('filter-vocab').className = filter === 'vocab' ? activeClass : inactiveClass;
            document.getElementById('filter-expressions').className = filter === 'expressions' ? activeClass : inactiveClass;
            renderCards();
        }

        function renderCards() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const vocabContainer = document.getElementById('vocab-container');
            const expressionsContainer = document.getElementById('expressions-container');
            const vocabGrid = document.getElementById('vocab-grid');
            const expressionsGrid = document.getElementById('expressions-grid');

            vocabGrid.innerHTML = '';
            expressionsGrid.innerHTML = '';

            if (currentFilter === 'all' || currentFilter === 'vocab') {
                const filteredVocab = VOCABULARY.filter(v => v.word.toLowerCase().includes(searchTerm) || v.meaning.toLowerCase().includes(searchTerm));
                if (filteredVocab.length > 0) {
                    vocabContainer.style.display = 'block';
                    filteredVocab.forEach(item => {
                        vocabGrid.innerHTML += createCardHTML(item.word, item.meaning, item.example, 'vocab', item.form, item.ipa);
                    });
                } else {
                    vocabContainer.style.display = 'none';
                }
            } else {
                vocabContainer.style.display = 'none';
            }

            if (currentFilter === 'all' || currentFilter === 'expressions') {
                const filteredExp = EXPRESSIONS.filter(e => e.phrase.toLowerCase().includes(searchTerm) || e.usage.toLowerCase().includes(searchTerm));
                if (filteredExp.length > 0) {
                    expressionsContainer.style.display = 'block';
                    filteredExp.forEach(item => {
                        expressionsGrid.innerHTML += createCardHTML(item.phrase, item.usage, item.example, 'expression', null, null);
                    });
                } else {
                    expressionsContainer.style.display = 'none';
                }
            } else {
                expressionsContainer.style.display = 'none';
            }
        }

        function createCardHTML(title, subtitle, example, type, form, ipa) {
            const isVocab = type === 'vocab';
            const badgeClass = isVocab ? 'bg-fuchsia-100 text-fuchsia-700' : 'bg-pink-100 text-pink-700';
            const badgeText = isVocab ? 'Word' : 'Phrase';
            const bgClassBack = isVocab ? 'bg-fuchsia-50 border-fuchsia-100' : 'bg-pink-50 border-pink-100';
            const hoverShadow = isVocab ? 'group-hover:shadow-fuchsia-500/10' : 'group-hover:shadow-pink-500/10';
            
            let extraInfo = '';
            if (isVocab) {
                extraInfo = `
                    <div class="flex items-center justify-center gap-3 mt-4">
                        <span class="text-xs font-bold text-fuchsia-400 bg-fuchsia-50 px-2 py-1 rounded-md uppercase tracking-wider">${form}</span>
                        <span class="text-sm font-semibold text-slate-500">${ipa}</span>
                        <button onclick="speakText('${title}', event)" class="p-2 rounded-full bg-fuchsia-100 text-fuchsia-600 hover:bg-fuchsia-200 hover:scale-110 transition-all" title="Listen">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="relative w-full h-72 perspective-1000 group" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner w-full h-full relative transform-style-3d transition-transform duration-[600ms] rounded-[2rem] shadow-[0_4px_20px_rgb(0,0,0,0.03)] group-hover:-translate-y-1 ${hoverShadow} cursor-pointer border border-white/50">
                        <!-- Front of Card -->
                        <div class="absolute w-full h-full backface-hidden bg-white/90 backdrop-blur-sm border border-slate-100 rounded-[2rem] flex flex-col items-center justify-center p-8 text-center">
                            <span class="absolute top-5 right-5 text-[10px] font-black uppercase tracking-wider px-3 py-1.5 rounded-lg ${badgeClass}">${badgeText}</span>
                            <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">${title}</h3>
                            ${extraInfo}
                            <div class="absolute bottom-5 left-0 w-full text-center">
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-1.5">
                                    <svg class="w-4 h-4 text-fuchsia-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                    Click to flip
                                </p>
                            </div>
                        </div>
                        
                        <!-- Back of Card -->
                        <div class="absolute w-full h-full backface-hidden ${bgClassBack} border-2 rounded-[2rem] p-7 rotate-y-180 overflow-y-auto custom-scrollbar flex flex-col shadow-inner">
                            <h4 class="font-extrabold text-slate-800 mb-4 border-b border-black/5 pb-3 text-lg">${title}</h4>
                            <div class="mb-5">
                                <p class="text-[10px] font-black uppercase tracking-widest text-${isVocab ? 'fuchsia' : 'pink'}-600 mb-2 opacity-80">${isVocab ? 'Meaning:' : 'Usage:'}</p>
                                <p class="text-slate-700 font-medium leading-relaxed">${subtitle}</p>
                            </div>
                            <div class="mt-auto">
                                <p class="text-[10px] font-black uppercase tracking-widest text-${isVocab ? 'fuchsia' : 'pink'}-600 mb-2 opacity-80">Example:</p>
                                <p class="text-slate-800 bg-white/70 p-4 rounded-2xl text-sm border-l-4 border-${isVocab ? 'fuchsia' : 'pink'}-400 shadow-sm italic font-semibold leading-relaxed">"${example}"</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Text to Speech
        function speakText(text, event) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.9;
                utterance.pitch = 1.1; // Slightly higher pitch for a friendlier voice
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderQuestionList() {
            const list = document.getElementById('question-list');
            list.innerHTML = '';
            
            PRACTICE_QUESTIONS.forEach((q, index) => {
                const isPart2 = q.type === 'Part 2';
                const badgeClass = isPart2 ? 'bg-purple-100 text-purple-700' : 'bg-pink-100 text-pink-700';
                
                list.innerHTML += `
                    <button id="q-btn-${index}" onclick="selectQuestion(${index})" class="w-full text-left p-4 hover:bg-white/60 transition-all duration-200 flex items-start border-l-4 border-transparent rounded-xl my-1 group">
                        <span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider mr-3 mt-0.5 whitespace-nowrap shadow-sm ${badgeClass}">
                            ${q.type}
                        </span>
                        <span class="font-bold text-slate-600 text-sm leading-snug group-hover:text-fuchsia-600 transition-colors q-topic-text">
                            ${q.topic}
                        </span>
                    </button>
                `;
            });
        }

        function selectQuestion(index) {
            stopRecordingLogic();

            currentQuestionIdx = index;
            const q = PRACTICE_QUESTIONS[index];
            const isPart2 = q.type === 'Part 2';

            // Sidebar styling
            document.querySelectorAll('[id^="q-btn-"]').forEach(btn => {
                btn.classList.remove('bg-white', 'border-fuchsia-400', 'shadow-sm');
                btn.querySelector('.q-topic-text').classList.remove('text-fuchsia-700');
                btn.querySelector('.q-topic-text').classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`q-btn-${index}`);
            activeBtn.classList.add('bg-white', 'border-fuchsia-400', 'shadow-sm');
            activeBtn.querySelector('.q-topic-text').classList.remove('text-slate-600');
            activeBtn.querySelector('.q-topic-text').classList.add('text-fuchsia-700');

            // Update Main View
            const badge = document.getElementById('q-type-badge');
            badge.textContent = q.type;
            badge.className = `px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest shadow-sm ${isPart2 ? 'bg-purple-100 text-purple-700' : 'bg-pink-100 text-pink-700'}`;
            
            document.getElementById('q-topic').textContent = q.topic;
            
            const promptTitle = document.getElementById('q-prompt-title');
            promptTitle.innerHTML = isPart2 ? 
                `<svg class="w-5 h-5 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> You should say:` : 
                `<svg class="w-5 h-5 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg> Discussion Questions:`;
            
            const promptsList = document.getElementById('q-prompts');
            promptsList.innerHTML = q.prompts.map(p => `
                <li class="flex items-start gap-3">
                    <span class="text-${isPart2 ? 'fuchsia' : 'pink'}-400 mt-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>
                    <span>${p}</span>
                </li>
            `).join('');

            document.getElementById('q-tips').textContent = q.tips;

            // Audio & Timer Reset
            document.getElementById('audio-playback-container').classList.add('hidden');
            const timer = document.getElementById('timer-display');
            timer.textContent = '0:00';
            timer.classList.remove('text-fuchsia-500');
            timer.classList.add('text-slate-300');
            
            const targetMsg = document.getElementById('target-time-msg');
            if (isPart2) {
                targetMsg.classList.remove('hidden');
            } else {
                targetMsg.classList.add('hidden');
            }
        }

        async function toggleRecording() {
            if (!isRecording) {
                await startRecordingLogic();
            } else {
                stopRecordingLogic();
            }
        }

        async function startRecordingLogic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audio-player');
                    player.src = audioUrl;
                    
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = audioUrl;
                    
                    const currentQ = PRACTICE_QUESTIONS[currentQuestionIdx];
                    const safeTopicName = currentQ.topic.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                    downloadLink.download = `IELTS_ChanTruong_${currentQ.type.replace(' ', '')}_${safeTopicName}.wav`;
                    
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                // UI Updates for Recording State
                document.getElementById('btn-start-record').classList.add('hidden');
                document.getElementById('btn-stop-record').classList.remove('hidden');
                document.getElementById('audio-playback-container').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-slate-300');
                timer.classList.add('text-fuchsia-500');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = 'width 120s linear'; 
                    progressBar.style.width = '100%';
                }, 50);

                // Timer setup
                secondsRecorded = 0;
                timer.textContent = '0:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60);
                    const secs = secondsRecorded % 60;
                    timer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

                mediaRecorder.start();
                isRecording = true;

            } catch (err) {
                console.error("Microphone error:", err);
                // Creating a custom beautiful alert overlay instead of the ugly browser alert
                const errorAlert = document.createElement('div');
                errorAlert.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-rose-500 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-bold animate-fade-in';
                errorAlert.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Please allow microphone access to record.`;
                document.body.appendChild(errorAlert);
                setTimeout(() => errorAlert.remove(), 4000);
            }
        }

        function stopRecordingLogic() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                clearInterval(timerInterval);
                
                document.getElementById('btn-start-record').classList.remove('hidden');
                document.getElementById('btn-stop-record').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-fuchsia-500');
                timer.classList.add('text-slate-300');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }
    </script>
</body>
