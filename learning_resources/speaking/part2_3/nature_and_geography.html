    <script>
        // --- DATA ---
        const VOCABULARY = [
            { word: "Ecosystem", form: "n", ipa: "/ˈiː.kəʊˌsɪs.təm/", meaning: "A biological community of interacting organisms and their physical environment.", example: "Pollution can have a devastating effect on the fragile marine ecosystem." },
            { word: "Biodiversity", form: "n", ipa: "/ˌbaɪ.əʊ.daɪˈvɜː.sə.ti/", meaning: "The variety of plant and animal life in the world or in a particular habitat.", example: "The Amazon rainforest is renowned for its rich biodiversity." },
            { word: "Topography", form: "n", ipa: "/təˈpɒɡ.rə.fi/", meaning: "The arrangement of the natural and artificial physical features of an area.", example: "The topography of the region features steep mountains and deep river valleys." },
            { word: "Deforestation", form: "n", ipa: "/diːˌfɒr.ɪˈsteɪ.ʃən/", meaning: "The action of clearing a wide area of trees.", example: "Deforestation is a major contributor to global climate change." },
            { word: "Archipelago", form: "n", ipa: "/ˌɑː.kɪˈpel.ə.ɡəʊ/", meaning: "A group of islands.", example: "Indonesia is the largest archipelago in the world, consisting of thousands of islands." },
            { word: "Peninsula", form: "n", ipa: "/pəˈnɪn.sjə.lə/", meaning: "A piece of land almost surrounded by water or projecting out into a body of water.", example: "The Iberian Peninsula includes the countries of Spain and Portugal." },
            { word: "Climate change", form: "n", ipa: "/ˈklaɪ.mət ˌtʃeɪndʒ/", meaning: "A long-term change in the earth's climate, especially due to an increase in the average atmospheric temperature.", example: "Rising sea levels are a direct consequence of global climate change." },
            { word: "Conservation", form: "n", ipa: "/ˌkɒn.səˈveɪ.ʃən/", meaning: "Preservation, protection, or restoration of the natural environment and wildlife.", example: "Wildlife conservation programs are essential for saving endangered species." },
            { word: "Flora and fauna", form: "n", ipa: "/ˈflɔː.rə ənd ˈfɔː.nə/", meaning: "Plants and animals as a group, especially those of a particular region.", example: "The island's unique flora and fauna attract nature enthusiasts from around the globe." },
            { word: "Habitat", form: "n", ipa: "/ˈhæb.ɪ.tæt/", meaning: "The natural home or environment of an animal, plant, or other organism.", example: "The destruction of their natural habitat threatens the survival of orangutans." },
            { word: "Geothermal", form: "adj", ipa: "/ˌdʒiː.əʊˈθɜː.məl/", meaning: "Relating to or produced by the internal heat of the earth.", example: "Iceland utilizes geothermal energy to heat homes in an eco-friendly way." },
            { word: "Erosion", form: "n", ipa: "/ɪˈrəʊ.ʒən/", meaning: "The process of eroding or being eroded by wind, water, or other natural agents.", example: "Coastal erosion has caused several houses to collapse into the sea." },
            { word: "Breathtaking", form: "adj", ipa: "/ˈbreθˌteɪ.kɪŋ/", meaning: "Astonishing or awe-inspiring in quality, so as to take one's breath away.", example: "The view from the top of the mountain was absolutely breathtaking." },
            { word: "Pristine", form: "adj", ipa: "/ˈprɪs.tiːn/", meaning: "In its original condition; unspoiled.", example: "We visited a pristine beach with crystal-clear water and white sand." },
            { word: "Indigenous", form: "adj", ipa: "/ɪnˈdɪdʒ.ɪ.nəs/", meaning: "Originating or occurring naturally in a particular place; native.", example: "Kangaroos are indigenous to Australia." },
            { word: "Metropolis", form: "n", ipa: "/məˈtrɒp.əl.ɪs/", meaning: "The capital or chief city of a country or region.", example: "Tokyo is a bustling metropolis that perfectly blends modern architecture with natural parks." },
            { word: "Rural", form: "adj", ipa: "/ˈrʊə.rəl/", meaning: "In, relating to, or characteristic of the countryside rather than the town.", example: "Many people enjoy the peace and quiet of living in a rural area." },
            { word: "Arid", form: "adj", ipa: "/ˈær.ɪd/", meaning: "(Of land or a climate) having little or no rain; too dry to support vegetation.", example: "Cacti are perfectly adapted to survive in an arid desert environment." },
            { word: "Sanctuary", form: "n", ipa: "/ˈsæŋk.tʃʊə.ri/", meaning: "A nature reserve where animals and birds are protected from hunting.", example: "The elephant sanctuary provides a safe haven for rescued animals." },
            { word: "Altitude", form: "n", ipa: "/ˈæl.tɪ.tʃuːd/", meaning: "The height of an object or point in relation to sea level or ground level.", example: "At high altitude, the air becomes thinner and it's harder to breathe." }
        ];

        const EXPRESSIONS = [
            { phrase: "To be in the middle of nowhere", usage: "Part 2/3 - Discussing remote locations", example: "The cabin we rented was in the middle of nowhere, perfect for stargazing." },
            { phrase: "Off the beaten track", usage: "Part 2/3 - Discussing travel/geography", example: "I prefer visiting places that are off the beaten track rather than famous tourist traps." },
            { phrase: "A drop in the ocean", usage: "Part 3 - Discussing environmental efforts", example: "My recycling effort feels like a drop in the ocean compared to industrial pollution." },
            { phrase: "To make a mountain out of a molehill", usage: "Part 3 - Discussing exaggerated problems", example: "Don't worry about the light rain; you're making a mountain out of a molehill." },
            { phrase: "To weather the storm", usage: "Part 3 - Discussing difficult situations/climate", example: "The coastal town managed to weather the storm despite the heavy flooding." },
            { phrase: "The tip of the iceberg", usage: "Part 3 - Discussing large environmental issues", example: "Plastic straws in the ocean are just the tip of the iceberg when it comes to pollution." },
            { phrase: "A stone's throw away", usage: "Part 2 - Describing locations", example: "My house is just a stone's throw away from a beautiful national park." },
            { phrase: "Back to nature", usage: "Part 2/3 - Discussing lifestyle/camping", example: "Going camping for the weekend is a great way to get back to nature." },
            { phrase: "Mother Nature", usage: "Part 2/3 - Personifying the environment", example: "You can't control the weather; Mother Nature always has her own plans." },
            { phrase: "To cost the earth", usage: "Part 3 - Discussing eco-friendly alternatives", example: "Switching to solar power might cost the earth initially, but it saves money long-term." },
            { phrase: "Down to earth", usage: "Part 3 - Describing rural people/lifestyles", example: "The farmers I met were incredibly down to earth and welcoming." },
            { phrase: "To wipe out", usage: "Part 3 - Discussing extinction/deforestation", example: "Illegal logging threatens to wipe out entire species of indigenous wildlife." },
            { phrase: "A breath of fresh air", usage: "Part 2/3 - Describing a refreshing change", example: "Moving from the polluted city to the countryside was a real breath of fresh air." },
            { phrase: "To be in one's element", usage: "Part 2 - Discussing hobbies in nature", example: "Whenever he goes hiking in the mountains, he is completely in his element." },
            { phrase: "Carbon footprint", usage: "Part 3 - Discussing climate change", example: "We should all try to reduce our carbon footprint by using public transport." },
            { phrase: "Endless horizons", usage: "Part 2 - Describing landscapes", example: "Standing on the cliff edge, I was amazed by the endless horizons of the ocean." },
            { phrase: "A barren wasteland", usage: "Part 3 - Discussing desertification", example: "Without proper water management, this fertile land could turn into a barren wasteland." },
            { phrase: "Lush and verdant", usage: "Part 2 - Describing forests/gardens", example: "The tropical rainforest was lush and verdant after the heavy monsoon rains." },
            { phrase: "To have a green thumb", usage: "Part 2/3 - Discussing gardening/nature", example: "My grandmother has a green thumb; her garden is always full of blooming flowers." },
            { phrase: "The great outdoors", usage: "Part 2/3 - Discussing outdoor activities", example: "Children should spend more time playing in the great outdoors instead of looking at screens." }
        ];

        const PRACTICE_QUESTIONS = [
            // PART 2 (10 Questions)
            { type: "Part 2", topic: "Describe a beautiful natural landscape you have visited.", prompts: ["Where it was?", "When you went there?", "What the landscape looked like?", "And explain why you found it beautiful."], tips: "Use descriptive words like 'breathtaking', 'lush and verdant', and 'endless horizons'." },
            { type: "Part 2", topic: "Describe a city or region whose geography is interesting to you.", prompts: ["What city/region it is?", "Where it is located?", "What geographic features it has?", "And explain why you find its geography interesting."], tips: "Mention features like 'archipelago', 'peninsula', 'altitude', or 'topography'." },
            { type: "Part 2", topic: "Describe an outdoor activity you enjoy doing in nature.", prompts: ["What the activity is?", "Where you do it?", "Who you do it with?", "And explain why you enjoy doing it in nature."], tips: "Talk about getting 'back to nature' and being 'in your element'." },
            { type: "Part 2", topic: "Describe a place you went to that was completely free of pollution.", prompts: ["Where the place was?", "How you traveled there?", "What the environment was like?", "And explain how you felt being in a pollution-free place."], tips: "Use terms like 'pristine', 'off the beaten track', and 'a breath of fresh air'." },
            { type: "Part 2", topic: "Describe a geographical feature in your country.", prompts: ["What the feature is (e.g., mountain, river)?", "Where it is located?", "What it looks like?", "And explain why it is important to your country."], tips: "Discuss its 'indigenous' elements or if it's a famous 'sanctuary' or tourist spot." },
            { type: "Part 2", topic: "Describe an animal in its natural habitat that you find fascinating.", prompts: ["What the animal is?", "Where its natural habitat is?", "What the animal does in its habitat?", "And explain why you find this animal fascinating."], tips: "Focus on 'flora and fauna', 'biodiversity', and how they interact with their 'ecosystem'." },
            { type: "Part 2", topic: "Describe a time you went camping or hiking in the wilderness.", prompts: ["Where you went?", "Who you went with?", "What the surroundings looked like?", "And explain what you enjoyed about the experience."], tips: "Mention 'the great outdoors', being 'in the middle of nowhere', and rural settings." },
            { type: "Part 2", topic: "Describe a park or garden in your city that you like.", prompts: ["Where the park/garden is?", "What it looks like?", "What people do there?", "And explain why you like it."], pos: "Even in a 'metropolis', green spaces are important. Talk about 'lush' areas." },
            { type: "Part 2", topic: "Describe an environmental problem in your local area.", prompts: ["What the problem is?", "What causes it?", "How it affects the local area?", "And explain what could be done to solve it."], tips: "Address 'erosion', 'deforestation', or reducing the 'carbon footprint'." },
            { type: "Part 2", topic: "Describe a documentary you watched about nature or the environment.", prompts: ["What the documentary was about?", "When you watched it?", "What you learned from it?", "And explain how it made you feel about the environment."], tips: "Use this to talk about 'climate change', 'conservation', and 'Mother Nature'." },
            
            // PART 3 - Topic 1 (10 Questions)
            { type: "Part 3", topic: "Tourism and the Environment", prompts: [
                "How does tourism affect the natural environment?", 
                "Do you think eco-tourism is a good solution for environmental protection?", 
                "How can individuals reduce their carbon footprint when traveling?", 
                "Should the government restrict the number of tourists visiting pristine areas?", 
                "What are the benefits of national parks and sanctuaries?", 
                "How does rural life differ from living in a metropolis?", 
                "Do you think people have lost their connection with nature?", 
                "Why is it important to protect indigenous flora and fauna?", 
                "How can schools educate children about the importance of conservation?", 
                "What role do international organizations play in environmental protection?"
            ], tips: "Incorporate 'carbon footprint', 'conservation', 'pristine', and 'wipe out'." },
            
            // PART 3 - Topic 2 (10 Questions)
            { type: "Part 3", topic: "Geography and Climate", prompts: [
                "How does geography influence the culture of a country?", 
                "In what ways has climate change affected your region recently?", 
                "Do you think natural disasters are becoming more frequent? Why?", 
                "How can cities be designed to be more environmentally friendly?", 
                "What are the main causes of deforestation in the modern world?", 
                "How important is access to green spaces for mental health?", 
                "Do you think renewable energy sources will completely replace fossil fuels?", 
                "How does living in a coastal area compare to living in the mountains?", 
                "What are the challenges of farming in arid regions?", 
                "How will sea-level rise impact archipelago nations?"
            ], tips: "Use terms like 'geothermal', 'arid', 'topography', 'climate change', and 'erosion'." }
        ];

        // --- STATE ---
        let currentFilter = 'all';
        let currentQuestionIdx = 0;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let secondsRecorded = 0;
        let stream = null;

        window.onload = () => {
            renderCards();
            renderQuestionList();
            selectQuestion(0);
        };

        // --- UI FUNCTIONS ---
        function switchTab(tab) {
            document.getElementById('section-study').style.display = tab === 'study' ? 'block' : 'none';
            document.getElementById('section-practice').style.display = tab === 'practice' ? 'flex' : 'none';
            
            const btnStudy = document.getElementById('tab-study');
            const btnPractice = document.getElementById('tab-practice');
            
            // Pastel active/inactive states
            const activeClasses = 'flex-1 py-3 px-4 rounded-xl font-bold transition-all duration-300 shadow-sm bg-white text-fuchsia-600 border border-fuchsia-100 flex items-center justify-center gap-2';
            const inactiveClasses = 'flex-1 py-3 px-4 rounded-xl font-medium transition-all duration-300 text-slate-500 hover:text-fuchsia-600 hover:bg-white/50 flex items-center justify-center gap-2 border border-transparent';
            
            if (tab === 'study') {
                btnStudy.className = activeClasses;
                btnPractice.className = inactiveClasses;
                stopRecordingLogic();
            } else {
                btnPractice.className = activeClasses;
                btnStudy.className = inactiveClasses;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            const activeClass = 'px-5 py-2.5 rounded-full text-sm font-bold bg-fuchsia-100 text-fuchsia-700 shadow-sm transition-all';
            const inactiveClass = 'px-5 py-2.5 rounded-full text-sm font-medium text-slate-500 hover:bg-white transition-all hover:shadow-sm';
            
            document.getElementById('filter-all').className = filter === 'all' ? activeClass : inactiveClass;
            document.getElementById('filter-vocab').className = filter === 'vocab' ? activeClass : inactiveClass;
            document.getElementById('filter-expressions').className = filter === 'expressions' ? activeClass : inactiveClass;
            renderCards();
        }

        function renderCards() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const vocabContainer = document.getElementById('vocab-container');
            const expressionsContainer = document.getElementById('expressions-container');
            const vocabGrid = document.getElementById('vocab-grid');
            const expressionsGrid = document.getElementById('expressions-grid');

            vocabGrid.innerHTML = '';
            expressionsGrid.innerHTML = '';

            if (currentFilter === 'all' || currentFilter === 'vocab') {
                const filteredVocab = VOCABULARY.filter(v => v.word.toLowerCase().includes(searchTerm) || v.meaning.toLowerCase().includes(searchTerm));
                if (filteredVocab.length > 0) {
                    vocabContainer.style.display = 'block';
                    filteredVocab.forEach(item => {
                        vocabGrid.innerHTML += createCardHTML(item.word, item.meaning, item.example, 'vocab', item.form, item.ipa);
                    });
                } else {
                    vocabContainer.style.display = 'none';
                }
            } else {
                vocabContainer.style.display = 'none';
            }

            if (currentFilter === 'all' || currentFilter === 'expressions') {
                const filteredExp = EXPRESSIONS.filter(e => e.phrase.toLowerCase().includes(searchTerm) || e.usage.toLowerCase().includes(searchTerm));
                if (filteredExp.length > 0) {
                    expressionsContainer.style.display = 'block';
                    filteredExp.forEach(item => {
                        expressionsGrid.innerHTML += createCardHTML(item.phrase, item.usage, item.example, 'expression', null, null);
                    });
                } else {
                    expressionsContainer.style.display = 'none';
                }
            } else {
                expressionsContainer.style.display = 'none';
            }
        }

        function createCardHTML(title, subtitle, example, type, form, ipa) {
            const isVocab = type === 'vocab';
            const badgeClass = isVocab ? 'bg-fuchsia-100 text-fuchsia-700' : 'bg-pink-100 text-pink-700';
            const badgeText = isVocab ? 'Word' : 'Phrase';
            const bgClassBack = isVocab ? 'bg-fuchsia-50 border-fuchsia-100' : 'bg-pink-50 border-pink-100';
            
            let extraInfo = '';
            if (isVocab) {
                extraInfo = `
                    <div class="flex items-center justify-center gap-3 mt-4">
                        <span class="text-xs font-bold text-fuchsia-400 bg-fuchsia-50 px-2 py-1 rounded-md uppercase tracking-wider">${form}</span>
                        <span class="text-sm font-semibold text-slate-500">${ipa}</span>
                        <button onclick="speakText('${title}', event)" class="p-2 rounded-full bg-fuchsia-100 text-fuchsia-600 hover:bg-fuchsia-200 hover:scale-110 transition-all" title="Listen">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="relative w-full h-72 perspective-1000 transition-transform duration-300 hover:-translate-y-1 hover:shadow-xl rounded-[2rem] cursor-pointer group" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner w-full h-full relative transform-style-3d transition-transform duration-[600ms] rounded-[2rem] shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-white/50">
                        <!-- Front of Card -->
                        <div class="absolute w-full h-full backface-hidden bg-white/90 backdrop-blur-sm border border-slate-100 rounded-[2rem] flex flex-col items-center justify-center p-8 text-center">
                            <span class="absolute top-5 right-5 text-[10px] font-black uppercase tracking-wider px-3 py-1.5 rounded-lg ${badgeClass}">${badgeText}</span>
                            <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">${title}</h3>
                            ${extraInfo}
                            <div class="absolute bottom-5 left-0 w-full text-center">
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-1.5">
                                    <svg class="w-4 h-4 text-fuchsia-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                    Click to flip
                                </p>
                            </div>
                        </div>
                        
                        <!-- Back of Card -->
                        <div class="absolute w-full h-full backface-hidden ${bgClassBack} border-2 rounded-[2rem] p-7 rotate-y-180 flex flex-col shadow-inner cursor-default">
                            <div class="flex justify-between items-start mb-4 border-b border-black/5 pb-3 shrink-0">
                                <h4 class="font-extrabold text-slate-800 text-lg">${title}</h4>
                                <button onclick="event.stopPropagation(); this.closest('.perspective-1000').classList.remove('is-flipped')" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-black/5 rounded-full transition-colors cursor-pointer" title="Close">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                            
                            <div class="overflow-y-auto custom-scrollbar flex-grow pr-3" onclick="event.stopPropagation()">
                                <div class="mb-5">
                                    <p class="text-[10px] font-black uppercase tracking-widest text-${isVocab ? 'fuchsia' : 'pink'}-600 mb-2 opacity-80">${isVocab ? 'Meaning:' : 'Usage:'}</p>
                                    <p class="text-slate-700 font-medium leading-relaxed">${subtitle}</p>
                                </div>
                                <div class="mt-auto">
                                    <p class="text-[10px] font-black uppercase tracking-widest text-${isVocab ? 'fuchsia' : 'pink'}-600 mb-2 opacity-80">Example:</p>
                                    <p class="text-slate-800 bg-white/70 p-4 rounded-2xl text-sm border-l-4 border-${isVocab ? 'fuchsia' : 'pink'}-400 shadow-sm italic font-semibold leading-relaxed">"${example}"</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Text to Speech
        function speakText(text, event) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.9;
                utterance.pitch = 1.1; // Slightly higher pitch for a friendlier voice
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderQuestionList() {
            const list = document.getElementById('question-list');
            list.innerHTML = '';
            
            PRACTICE_QUESTIONS.forEach((q, index) => {
                const isPart2 = q.type === 'Part 2';
                const badgeClass = isPart2 ? 'bg-purple-100 text-purple-700' : 'bg-pink-100 text-pink-700';
                
                list.innerHTML += `
                    <button id="q-btn-${index}" onclick="selectQuestion(${index})" class="w-full text-left p-4 hover:bg-white/60 transition-all duration-200 flex items-start border-l-4 border-transparent rounded-xl my-1 group">
                        <span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider mr-3 mt-0.5 whitespace-nowrap shadow-sm ${badgeClass}">
                            ${q.type}
                        </span>
                        <span class="font-bold text-slate-600 text-sm leading-snug group-hover:text-fuchsia-600 transition-colors q-topic-text">
                            ${q.topic}
                        </span>
                    </button>
                `;
            });
        }

        function selectQuestion(index) {
            stopRecordingLogic();

            currentQuestionIdx = index;
            const q = PRACTICE_QUESTIONS[index];
            const isPart2 = q.type === 'Part 2';

            // Sidebar styling
            document.querySelectorAll('[id^="q-btn-"]').forEach(btn => {
                btn.classList.remove('bg-white', 'border-fuchsia-400', 'shadow-sm');
                btn.querySelector('.q-topic-text').classList.remove('text-fuchsia-700');
                btn.querySelector('.q-topic-text').classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`q-btn-${index}`);
            activeBtn.classList.add('bg-white', 'border-fuchsia-400', 'shadow-sm');
            activeBtn.querySelector('.q-topic-text').classList.remove('text-slate-600');
            activeBtn.querySelector('.q-topic-text').classList.add('text-fuchsia-700');

            // Update Main View
            const badge = document.getElementById('q-type-badge');
            badge.textContent = q.type;
            badge.className = `px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest shadow-sm ${isPart2 ? 'bg-purple-100 text-purple-700' : 'bg-pink-100 text-pink-700'}`;
            
            document.getElementById('q-topic').textContent = q.topic;
            
            const promptTitle = document.getElementById('q-prompt-title');
            promptTitle.innerHTML = isPart2 ? 
                `<svg class="w-5 h-5 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> You should say:` : 
                `<svg class="w-5 h-5 text-fuchsia-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg> Discussion Questions:`;
            
            const promptsList = document.getElementById('q-prompts');
            promptsList.innerHTML = q.prompts.map(p => `
                <li class="flex items-start gap-3">
                    <span class="text-${isPart2 ? 'fuchsia' : 'pink'}-400 mt-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>
                    <span>${p}</span>
                </li>
            `).join('');

            document.getElementById('q-tips').textContent = q.tips;

            // Audio & Timer Reset
            document.getElementById('audio-playback-container').classList.add('hidden');
            const timer = document.getElementById('timer-display');
            timer.textContent = '0:00';
            timer.classList.remove('text-fuchsia-500');
            timer.classList.add('text-slate-300');
            
            const targetMsg = document.getElementById('target-time-msg');
            if (isPart2) {
                targetMsg.classList.remove('hidden');
            } else {
                targetMsg.classList.add('hidden');
            }
        }

        async function toggleRecording() {
            if (!isRecording) {
                await startRecordingLogic();
            } else {
                stopRecordingLogic();
            }
        }

        async function startRecordingLogic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audio-player');
                    player.src = audioUrl;
                    
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = audioUrl;
                    
                    const currentQ = PRACTICE_QUESTIONS[currentQuestionIdx];
                    const safeTopicName = currentQ.topic.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                    downloadLink.download = `IELTS_ChanTruong_${currentQ.type.replace(' ', '')}_${safeTopicName}.wav`;
                    
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                // UI Updates for Recording State
                document.getElementById('btn-start-record').classList.add('hidden');
                document.getElementById('btn-stop-record').classList.remove('hidden');
                document.getElementById('audio-playback-container').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-slate-300');
                timer.classList.add('text-fuchsia-500');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = 'width 120s linear'; 
                    progressBar.style.width = '100%';
                }, 50);

                // Timer setup
                secondsRecorded = 0;
                timer.textContent = '0:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60);
                    const secs = secondsRecorded % 60;
                    timer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

                mediaRecorder.start();
                isRecording = true;

            } catch (err) {
                console.error("Microphone error:", err);
                // Creating a custom beautiful alert overlay instead of the ugly browser alert
                const errorAlert = document.createElement('div');
                errorAlert.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-rose-500 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-bold animate-fade-in';
                errorAlert.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Please allow microphone access to record.`;
                document.body.appendChild(errorAlert);
                setTimeout(() => errorAlert.remove(), 4000);
            }
        }

        function stopRecordingLogic() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                clearInterval(timerInterval);
                
                document.getElementById('btn-start-record').classList.remove('hidden');
                document.getElementById('btn-stop-record').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-fuchsia-500');
                timer.classList.add('text-slate-300');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }
    </script>
