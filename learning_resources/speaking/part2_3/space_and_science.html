    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 3D Flip Card CSS */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        .is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Modern Pastel Scrollbar (Violet theme) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 20px; border: 2px solid #fff; } /* violet-300 */
        ::-webkit-scrollbar-thumb:hover { background: #a78bfa; } /* violet-400 */
        
        /* Smooth Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Pulse Animation for Recording (Violet theme) */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(139, 92, 246, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

                            <p id="q-prompt-title" class="font-bold text-indigo-800 mb-5 text-lg flex items-center gap-2 relative z-10"></p>

                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                                <div class="bg-white/20 p-2 rounded-full">

                                </div>
                                Start Recording

                            </button>
                        </div>

                        <p id="target-time-msg" class="text-sm font-semibold text-slate-400 text-center max-w-sm mt-8 bg-slate-50 px-4 py-2 rounded-full">

                        </p>

                        <!-- Audio Playback & Download -->
                        <div id="audio-playback-container" class="hidden mt-10 w-full max-w-lg bg-gradient-to-br from-indigo-50 to-violet-50 p-8 rounded-[2rem] shadow-sm border border-indigo-100 transition-all animate-fade-in">

                                <h4 class="text-sm font-black text-indigo-800 uppercase tracking-widest flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>

                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    Download Audio File

    <script>
        // --- DATA ---
        const VOCABULARY = [
            { word: "Cosmos", form: "n", ipa: "/ˈkɒz.mɒs/", meaning: "The universe considered as a system with an order and pattern.", example: "Our knowledge of the cosmos has expanded rapidly with the launch of new space telescopes.", vietnamese: "Vũ trụ", family: "Cosmic (adj)" },
            { word: "Gravity", form: "n", ipa: "/ˈɡræv.ə.ti/", meaning: "The force that attracts objects towards one another, especially the force that makes things fall to the ground.", example: "The gravity of the moon is what causes the tides on Earth.", vietnamese: "Trọng lực", family: "Gravitational (adj)" },
            { word: "Extraterrestrial", form: "adj", ipa: "/ˌek.strə.təˈres.tri.əl/", meaning: "In or coming from a place outside the planet Earth.", example: "Scientists are constantly searching for signs of extraterrestrial life in distant galaxies.", vietnamese: "Ngoại hành tinh, ngoài trái đất", family: "N/A" },
            { word: "Orbit", form: "n", ipa: "/ˈɔː.bɪt/", meaning: "The curved path through which objects in space move around a planet or star.", example: "The satellite was successfully placed into orbit around the Earth.", vietnamese: "Quỹ đạo", family: "Orbital (adj)" },
            { word: "Telescope", form: "n", ipa: "/ˈtel.ɪ.skəʊp/", meaning: "A cylinder-shaped device for making objects that are far away look closer and larger.", example: "The James Webb Space Telescope allows us to look deeper into the universe than ever before.", vietnamese: "Kính viễn vọng", family: "Telescopic (adj)" },
            { word: "Phenomenon", form: "n", ipa: "/fəˈnɒm.ɪ.nən/", meaning: "Something that exists and can be seen, felt, tasted, etc., especially something unusual or interesting.", example: "A solar eclipse is a fascinating natural phenomenon.", vietnamese: "Hiện tượng", family: "Phenomena (pl), Phenomenal (adj)" },
            { word: "Hypothesis", form: "n", ipa: "/haɪˈpɒθ.ə.sɪs/", meaning: "An idea or explanation for something that is based on known facts but has not yet been proved.", example: "Researchers are conducting experiments to test their new hypothesis about cellular aging.", vietnamese: "Giả thuyết", family: "Hypothetical (adj), Hypothesize (v)" },
            { word: "Breakthrough", form: "n", ipa: "/ˈbreɪk.θruː/", meaning: "An important discovery or event that helps to improve a situation or provide an answer to a problem.", example: "The development of penicillin was a major medical breakthrough.", vietnamese: "Bước đột phá", family: "N/A" },
            { word: "Innovation", form: "n", ipa: "/ˌɪn.əˈveɪ.ʃən/", meaning: "A new idea or method, or the use of new ideas and methods.", example: "Technological innovation is crucial for the development of sustainable energy sources.", vietnamese: "Sự đổi mới", family: "Innovate (v), Innovative (adj)" },
            { word: "Asteroid", form: "n", ipa: "/ˈæs.tər.ɔɪd/", meaning: "One of many large rocks that circle the sun.", example: "Scientists track the paths of asteroids to ensure they do not collide with Earth.", vietnamese: "Tiểu hành tinh", family: "N/A" },
            { word: "Vacuum", form: "n", ipa: "/ˈvæk.juːm/", meaning: "A space from which most or all of the matter has been removed, or where there is little or no matter.", example: "Space is an almost perfect vacuum, which means sound cannot travel through it.", vietnamese: "Chân không", family: "N/A" },
            { word: "Galaxy", form: "n", ipa: "/ˈɡæl.ək.si/", meaning: "One of the independent groups of stars in the universe.", example: "Our solar system is located within the Milky Way galaxy.", vietnamese: "Thiên hà", family: "Galactic (adj)" },
            { word: "Empirical", form: "adj", ipa: "/ɪmˈpɪr.ɪ.kəl/", meaning: "Based on what is experienced or seen rather than on theory.", example: "Scientific conclusions must be supported by solid empirical evidence.", vietnamese: "Dựa trên thực nghiệm", family: "Empirically (adv)" },
            { word: "Eclipse", form: "n", ipa: "/ɪˈklɪps/", meaning: "An occasion when the sun disappears from view, either completely or partly, while the moon is moving between it and the earth.", example: "Thousands of people gathered to watch the total solar eclipse.", vietnamese: "Thiên thực (nhật/nguyệt thực)", family: "N/A" },
            { word: "Radiation", form: "n", ipa: "/ˌreɪ.diˈeɪ.ʃən/", meaning: "A form of energy that comes from a nuclear reaction and that can be very dangerous to health.", example: "Astronauts need special shielding to protect them from cosmic radiation.", vietnamese: "Bức xạ", family: "Radiate (v), Radioactive (adj)" },
            { word: "Astronaut", form: "n", ipa: "/ˈæs.trə.nɔːt/", meaning: "A person who has been trained for travelling in space.", example: "It takes years of rigorous physical and mental training to become an astronaut.", vietnamese: "Phi hành gia", family: "Astronautics (n)" },
            { word: "Genetics", form: "n", ipa: "/dʒəˈnet.ɪks/", meaning: "The study of how, in all living things, the characteristics and qualities of parents are given to their children by their genes.", example: "Advancements in genetics have allowed us to understand and treat many inherited diseases.", vietnamese: "Di truyền học", family: "Genetic (adj), Gene (n)" },
            { word: "Particle", form: "n", ipa: "/ˈpɑː.tɪ.kəl/", meaning: "An extremely small piece of matter.", example: "Physicists use massive colliders to study subatomic particles.", vietnamese: "Hạt, phần tử", family: "Particular (adj)" },
            { word: "Velocity", form: "n", ipa: "/vəˈlɒs.ə.ti/", meaning: "The speed at which an object is travelling.", example: "The rocket must reach a specific velocity to escape the Earth's gravitational pull.", vietnamese: "Vận tốc", family: "N/A" },
            { word: "Observatory", form: "n", ipa: "/əbˈzɜː.və.tər.i/", meaning: "A building from which scientists can watch the planets, the stars, the weather, etc.", example: "The telescope at the mountain observatory provides a clear view of the night sky.", vietnamese: "Đài thiên văn", family: "Observe (v), Observation (n)" }

        const EXPRESSIONS = [

                const filteredVocab = VOCABULARY.filter(v => v.word.toLowerCase().includes(searchTerm) || v.meaning.toLowerCase().includes(searchTerm) || v.vietnamese.toLowerCase().includes(searchTerm));

                    vocabContainer.style.display = 'block';

                        vocabGrid.innerHTML += createCardHTML(item.word, item.meaning, item.example, 'vocab', item.form, item.ipa, item.vietnamese, item.family);

                    vocabContainer.style.display = 'none';

        // Text to Speech

            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.9;
                utterance.pitch = 1.1; // Slightly higher pitch for a friendlier voice
                window.speechSynthesis.speak(utterance);
            }

            promptTitle.innerHTML = isPart2 ? 
                `<svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> You should say:` : 
                `<svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg> Discussion Questions:`;
            
            const promptsList = document.getElementById('q-prompts');
            promptsList.innerHTML = q.prompts.map(p => `
                <li class="flex items-start gap-3">
                    <span class="text-${isPart2 ? 'indigo' : 'violet'}-400 mt-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>
                    <span>${p}</span>
                </li>
            `).join('');

            document.getElementById('q-tips').textContent = q.tips;

            // Audio & Timer Reset
            document.getElementById('audio-playback-container').classList.add('hidden');
            const timer = document.getElementById('timer-display');
            timer.textContent = '0:00';
            timer.classList.remove('text-indigo-500');
            timer.classList.add('text-slate-300');
            
            const targetMsg = document.getElementById('target-time-msg');
            if (isPart2) {
                targetMsg.classList.remove('hidden');
            } else {
                targetMsg.classList.add('hidden');
            }
        }

        async function toggleRecording() {
            if (!isRecording) {
                await startRecordingLogic();
            } else {
                stopRecordingLogic();
            }
        }

        async function startRecordingLogic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audio-player');
                    player.src = audioUrl;
                    
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = audioUrl;
                    
                    const currentQ = PRACTICE_QUESTIONS[currentQuestionIdx];
                    const safeTopicName = currentQ.topic.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                    downloadLink.download = `IELTS_ChanTruong_${currentQ.type.replace(' ', '')}_${safeTopicName}.wav`;
                    
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                // UI Updates for Recording State
                document.getElementById('btn-start-record').classList.add('hidden');
                document.getElementById('btn-stop-record').classList.remove('hidden');
                document.getElementById('audio-playback-container').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-slate-300');
                timer.classList.add('text-indigo-500');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = 'width 120s linear'; 
                    progressBar.style.width = '100%';
                }, 50);

                // Timer setup
                secondsRecorded = 0;
                timer.textContent = '0:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60);
                    const secs = secondsRecorded % 60;
                    timer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

                mediaRecorder.start();
                isRecording = true;

            } catch (err) {
                console.error("Microphone error:", err);
                // Creating a custom beautiful alert overlay instead of the ugly browser alert
                const errorAlert = document.createElement('div');
                errorAlert.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-violet-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-bold animate-fade-in';
                errorAlert.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Please allow microphone access to record.`;
                document.body.appendChild(errorAlert);
                setTimeout(() => errorAlert.remove(), 4000);
            }
        }

        function stopRecordingLogic() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                clearInterval(timerInterval);
                
                document.getElementById('btn-start-record').classList.remove('hidden');
                document.getElementById('btn-stop-record').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-indigo-500');
                timer.classList.add('text-slate-300');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }
    </script>
