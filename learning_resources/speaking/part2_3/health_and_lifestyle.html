    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 3D Flip Card CSS */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        .is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Modern Pastel Scrollbar (Rose theme) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 20px; border: 2px solid #fff; } /* rose-300 */
        ::-webkit-scrollbar-thumb:hover { background: #fb7185; } /* rose-400 */
        
        /* Smooth Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Pulse Animation for Recording (Rose theme for health) */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

        <!-- PRACTICE SECTION -->

                            Practice Topics

            <!-- Main Area: Recording Interface -->
            <div class="w-full lg:w-2/3 animate-fade-in" style="animation-delay: 0.1s;">

                    <!-- Progress Bar (Pastel gradient) -->

                        <div id="recording-progress" class="h-full bg-gradient-to-r from-rose-400 to-orange-500 w-0 transition-all duration-1000"></div>
                    </div>

                    <div class="p-8 border-b border-rose-50">

                            <!-- Background accent -->

                                <svg class="w-40 h-40" fill="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>

                            <p id="q-prompt-title" class="font-bold text-rose-800 mb-5 text-lg flex items-center gap-2 relative z-10"></p>

                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <div>
                                <span class="font-black text-orange-900 block mb-1 text-sm uppercase tracking-wider">Examiner's Tip</span>
                                <span id="q-tips" class="text-orange-800 leading-relaxed font-medium"></span>
                            </div>
                        </div>
                    </div>

                    <div class="p-10 bg-white flex flex-col items-center justify-center relative">

                        <div class="flex gap-4">

                                <div class="bg-white/20 p-2 rounded-full">
                                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"></path></svg>
                                </div>
                                Start Recording
                            </button>
                            <button id="btn-stop-record" onclick="toggleRecording()" class="hidden flex items-center gap-3 bg-slate-800 hover:bg-slate-900 text-white px-10 py-5 rounded-[2rem] font-bold shadow-xl transition-all recording-pulse text-lg">

                            </button>
                        </div>

                        <p id="target-time-msg" class="text-sm font-semibold text-slate-400 text-center max-w-sm mt-8 bg-slate-50 px-4 py-2 rounded-full">
                            Target time for Part 2 is 1 - 2 minutes.
                        </p>

                        <!-- Audio Playback & Download -->
                        <div id="audio-playback-container" class="hidden mt-10 w-full max-w-lg bg-gradient-to-br from-rose-50 to-orange-50 p-8 rounded-[2rem] shadow-sm border border-rose-100 transition-all animate-fade-in">
                            <div class="flex items-center justify-between mb-6">
                                <h4 class="text-sm font-black text-rose-800 uppercase tracking-widest flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                                    Your Response

                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    Download Audio File

    <script>
        // --- DATA ---
        const VOCABULARY = [
            { word: "Sedentary", form: "adj", ipa: "/ˈsed.ən.tər.i/", meaning: "Involving little exercise or physical activity.", example: "A sedentary lifestyle is a major cause of modern lifestyle diseases.", vietnamese: "Ít vận động", family: "N/A" },
            { word: "Well-being", form: "n", ipa: "/ˌwelˈbiː.ɪŋ/", meaning: "The state of feeling healthy and happy.", example: "Regular meditation can significantly improve your mental well-being.", vietnamese: "Sự khỏe mạnh, hạnh phúc", family: "N/A" },
            { word: "Malnutrition", form: "n", ipa: "/ˌmæl.njuːˈtrɪʃ.ən/", meaning: "Physical weakness and bad health caused by having too little food, or too little of the types of food necessary for good health.", example: "Many children in developing countries still suffer from severe malnutrition.", vietnamese: "Suy dinh dưỡng", family: "Malnourished (adj)" },
            { word: "Metabolism", form: "n", ipa: "/məˈtæb.əl.ɪ.zəm/", meaning: "All the chemical processes in your body, especially those that cause food to be used for energy and growth.", example: "Regular exercise can help boost your resting metabolism.", vietnamese: "Sự trao đổi chất", family: "Metabolic (adj)" },
            { word: "Immunity", form: "n", ipa: "/ɪˈmjuː.nə.ti/", meaning: "A situation in which you are protected against disease or from legal action.", example: "Eating a diet rich in vitamins helps build strong immunity against viruses.", vietnamese: "Sự miễn dịch", family: "Immune (adj), Immunize (v)" },
            { word: "Epidemic", form: "n", ipa: "/ˌep.ɪˈdem.ɪk/", meaning: "The appearance of a particular disease in a large number of people at the same time.", example: "Obesity has reached epidemic proportions in many Western countries.", vietnamese: "Bệnh dịch", family: "N/A" },
            { word: "Obesity", form: "n", ipa: "/əʊˈbiː.sə.ti/", meaning: "The fact of being extremely fat, in a way that is dangerous for health.", example: "Childhood obesity is linked to a higher risk of diabetes later in life.", vietnamese: "Bệnh béo phì", family: "Obese (adj)" },
            { word: "Preventive", form: "adj", ipa: "/prɪˈven.tɪv/", meaning: "Intended to stop something before it happens.", example: "Getting enough sleep is a great preventive measure against catching a cold.", vietnamese: "Mang tính phòng ngừa", family: "Prevent (v), Prevention (n)" },
            { word: "Insomnia", form: "n", ipa: "/ɪnˈsɒm.ni.ə/", meaning: "The condition of being unable to sleep, over a period of time.", example: "Stress at work is a leading cause of insomnia for many adults.", vietnamese: "Chứng mất ngủ", family: "Insomniac (n)" },
            { word: "Hygiene", form: "n", ipa: "/ˈhaɪ.dʒiːn/", meaning: "The degree to which people keep themselves or their environment clean, especially to prevent disease.", example: "Poor dental hygiene can lead to severe health complications.", vietnamese: "Vệ sinh", family: "Hygienic (adj)" },
            { word: "Additive", form: "n", ipa: "/ˈæd.ɪ.tɪv/", meaning: "A substance that is added to food in order to improve its taste or appearance or to keep it fresh and stop it from decaying.", example: "Many processed foods are full of artificial colors and additives.", vietnamese: "Chất phụ gia", family: "Add (v), Addition (n)" },
            { word: "Detoxify", form: "v", ipa: "/diːˈtɒk.sɪ.faɪ/", meaning: "To remove harmful chemicals from the body or from something.", example: "Drinking plenty of water helps to naturally detoxify the body.", vietnamese: "Giải độc", family: "Detoxification (n), Detox (n/v)" },
            { word: "Rejuvenate", form: "v", ipa: "/rɪˈdʒuː.vən.eɪt/", meaning: "To make someone look or feel young and energetic again.", example: "A two-week vacation by the beach completely rejuvenated her.", vietnamese: "Làm trẻ lại, làm khỏe lại", family: "Rejuvenation (n)" },
            { word: "Chronic", form: "adj", ipa: "/ˈkrɒn.ɪk/", meaning: "(Especially of a disease or something bad) continuing for a long time.", example: "He has been suffering from chronic back pain for years.", vietnamese: "Mãn tính, kéo dài", family: "Chronically (adv)" },
            { word: "Regimen", form: "n", ipa: "/ˈredʒ.ɪ.mən/", meaning: "Any set of rules about food and exercise that someone follows, especially in order to improve their health.", example: "She strictly follows a daily fitness regimen recommended by her trainer.", vietnamese: "Chế độ (ăn uống, tập luyện)", family: "N/A" },
            { word: "Organic", form: "adj", ipa: "/ɔːˈɡæn.ɪk/", meaning: "Not using artificial chemicals in the growing of plants and animals for food and other products.", example: "Organic vegetables are often more expensive but they taste much better.", vietnamese: "Hữu cơ", family: "Organically (adv)" },
            { word: "Ergonomic", form: "adj", ipa: "/ˌɜː.ɡəˈnɒm.ɪk/", meaning: "Relating to the design of furniture or equipment which makes it comfortable and effective for people who use it.", example: "An ergonomic chair is essential if you sit at a desk all day.", vietnamese: "Công thái học (phù hợp với cơ thể)", family: "Ergonomics (n)" },
            { word: "Life expectancy", form: "n", ipa: "/ˈlaɪf ɪkˌspek.tən.si/", meaning: "The length of time that a living thing, especially a human being, is likely to live.", example: "Improvements in medical care have significantly increased global life expectancy.", vietnamese: "Tuổi thọ", family: "N/A" },
            { word: "Nutritious", form: "adj", ipa: "/njuːˈtrɪʃ.əs/", meaning: "Containing many of the substances needed for life and growth.", example: "A nutritious breakfast is essential for maintaining energy levels throughout the morning.", vietnamese: "Bổ dưỡng", family: "Nutrition (n), Nutrient (n)" },
            { word: "Sedative", form: "n", ipa: "/ˈsed.ə.tɪv/", meaning: "A drug used to calm a person or animal or to make them sleep.", example: "The doctor prescribed a mild sedative to help him overcome his anxiety before the surgery.", vietnamese: "Thuốc an thần", family: "Sedate (v)" }

        // Text to Speech
        function speakText(text, event) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.9;
                utterance.pitch = 1.1; // Slightly higher pitch for a friendlier voice
                window.speechSynthesis.speak(utterance);
            }
        }

            promptsList.innerHTML = q.prompts.map(p => `
                <li class="flex items-start gap-3">
                    <span class="text-${isPart2 ? 'orange' : 'rose'}-400 mt-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>
                    <span>${p}</span>
                </li>
            `).join('');

            document.getElementById('q-tips').textContent = q.tips;

            // Audio & Timer Reset
            document.getElementById('audio-playback-container').classList.add('hidden');
            const timer = document.getElementById('timer-display');
            timer.textContent = '0:00';
            timer.classList.remove('text-rose-500');
            timer.classList.add('text-slate-300');
            
            const targetMsg = document.getElementById('target-time-msg');
            if (isPart2) {
                targetMsg.classList.remove('hidden');
            } else {
                targetMsg.classList.add('hidden');
            }
        }

        // --- STREAMING_CHUNK:Implementing recording trigger and logic... ---
        async function toggleRecording() {
            if (!isRecording) {
                await startRecordingLogic();
            } else {
                stopRecordingLogic();
            }
        }

        async function startRecordingLogic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audio-player');
                    player.src = audioUrl;
                    
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = audioUrl;
                    
                    const currentQ = PRACTICE_QUESTIONS[currentQuestionIdx];
                    const safeTopicName = currentQ.topic.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                    downloadLink.download = `IELTS_ChanTruong_${currentQ.type.replace(' ', '')}_${safeTopicName}.wav`;
                    
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                // UI Updates for Recording State
                document.getElementById('btn-start-record').classList.add('hidden');
                document.getElementById('btn-stop-record').classList.remove('hidden');
                document.getElementById('audio-playback-container').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-slate-300');
                timer.classList.add('text-rose-500');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = 'width 120s linear'; 
                    progressBar.style.width = '100%';
                }, 50);

                // Timer setup
                secondsRecorded = 0;
                timer.textContent = '0:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60);
                    const secs = secondsRecorded % 60;
                    timer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

                mediaRecorder.start();
                isRecording = true;

            } catch (err) {
                console.error("Microphone error:", err);
                // Creating a custom beautiful alert overlay instead of the ugly browser alert
                const errorAlert = document.createElement('div');
                errorAlert.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-bold animate-fade-in';
                errorAlert.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Please allow microphone access to record.`;
                document.body.appendChild(errorAlert);
                setTimeout(() => errorAlert.remove(), 4000);
            }
        }

        // --- STREAMING_CHUNK:Implementing recording stop and cleanup logic... ---
        function stopRecordingLogic() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                clearInterval(timerInterval);
                
                document.getElementById('btn-start-record').classList.remove('hidden');
                document.getElementById('btn-stop-record').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-rose-500');
                timer.classList.add('text-slate-300');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }
    </script>
