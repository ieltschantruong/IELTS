        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 3D Flip Card CSS */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        .is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Modern Pastel Scrollbar (Amber theme) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 20px; border: 2px solid #fff; } /* amber-300 */
        ::-webkit-scrollbar-thumb:hover { background: #fbbf24; } /* amber-400 */
        
        /* Smooth Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Pulse Animation for Recording (Amber theme) */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>

    <script>
        // --- DATA ---
        const VOCABULARY = [
            { word: "Masterpiece", form: "n", ipa: "/ˈmɑː.stə.piːs/", meaning: "A work of outstanding artistry, skill, or workmanship.", example: "The Mona Lisa is considered Leonardo da Vinci's greatest masterpiece.", vietnamese: "Kiệt tác", family: "N/A" },
            { word: "Artifact", form: "n", ipa: "/ˈɑː.tɪ.fækt/", meaning: "An object made by a human being, typically one of cultural or historical interest.", example: "The museum holds several artifacts dating back to the Roman Empire.", vietnamese: "Đồ tạo tác (lịch sử)", family: "N/A" },
            { word: "Abstract", form: "adj", ipa: "/ˈæb.strækt/", meaning: "Art that does not attempt to represent external reality, but rather seeks to achieve its effect using shapes, forms, colors, and textures.", example: "Abstract paintings often leave the interpretation entirely up to the viewer.", vietnamese: "Trừu tượng", family: "Abstraction (n)" },
            { word: "Aesthetics", form: "n", ipa: "/esˈθet.ɪks/", meaning: "A set of principles concerned with the nature and appreciation of beauty.", example: "The aesthetics of traditional Japanese architecture emphasize simplicity and nature.", vietnamese: "Tính thẩm mỹ, mỹ học", family: "Aesthetic (adj)" },
            { word: "Curator", form: "n", ipa: "/kjʊəˈreɪ.tər/", meaning: "A keeper or custodian of a museum or other collection.", example: "The curator carefully selected the paintings for the upcoming modern art exhibition.", vietnamese: "Người giám tuyển", family: "Curate (v)" },
            { word: "Exhibition", form: "n", ipa: "/ˌek.sɪˈbɪʃ.ən/", meaning: "A public display of works of art or items of interest, held in an art gallery or museum.", example: "There's a fascinating exhibition on ancient Egyptian culture downtown.", vietnamese: "Cuộc triển lãm", family: "Exhibit (v/n)" },
            { word: "Antiquity", form: "n", ipa: "/ænˈtɪk.wə.ti/", meaning: "The ancient past, especially the period of classical and other human civilizations before the Middle Ages.", example: "Statues from antiquity provide us with great insight into early human civilizations.", vietnamese: "Thời đồ cổ, thời cổ đại", family: "Antique (n/adj)" },
            { word: "Renaissance", form: "n", ipa: "/rɪˈneɪ.səns/", meaning: "A revival of or renewed interest in something; specifically the revival of art and literature in Europe.", example: "The city underwent a cultural renaissance following the end of the war.", vietnamese: "Thời kỳ Phục hưng", family: "N/A" },
            { word: "Portrait", form: "n", ipa: "/ˈpɔː.trɪt/", meaning: "A painting, drawing, photograph, or engraving of a person, especially one depicting only the face or head and shoulders.", example: "She sat for a famous artist to have her portrait painted.", vietnamese: "Bức chân dung", family: "Portray (v), Portrayal (n)" },
            { word: "Sculpture", form: "n", ipa: "/ˈskʌlp.tʃər/", meaning: "The art of making two- or three-dimensional representative or abstract forms, especially by carving stone or wood or by casting metal.", example: "The marble sculpture in the town square honors a local hero.", vietnamese: "Bức tượng điêu khắc", family: "Sculptor (n)" },
            { word: "Calligraphy", form: "n", ipa: "/kəˈlɪɡ.rə.fi/", meaning: "Decorative handwriting or handwritten lettering.", example: "He took a class to master the traditional art of Chinese calligraphy.", vietnamese: "Thư pháp", family: "N/A" },
            { word: "Monument", form: "n", ipa: "/ˈmɒn.jə.mənt/", meaning: "A statue, building, or other structure erected to commemorate a notable person or event.", example: "The ancient monument attracts thousands of tourists every single year.", vietnamese: "Đài kỷ niệm, tượng đài", family: "Monumental (adj)" },
            { word: "Preservation", form: "n", ipa: "/ˌprez.əˈveɪ.ʃən/", meaning: "The action of preserving something; maintaining it in its original or existing state.", example: "The preservation of historical buildings is vital for maintaining a city's identity.", vietnamese: "Sự bảo tồn", family: "Preserve (v)" },
            { word: "Intricate", form: "adj", ipa: "/ˈɪn.trɪ.kət/", meaning: "Very complicated or detailed.", example: "The wooden panels were carved with intricate floral designs.", vietnamese: "Tinh xảo, phức tạp", family: "Intricately (adv)" },
            { word: "Patron", form: "n", ipa: "/ˈpeɪ.trən/", meaning: "A person who gives financial or other support to a person, organization, cause, or activity.", example: "Historically, wealthy patrons funded the work of many famous classical composers.", vietnamese: "Người bảo trợ (nghệ thuật)", family: "Patronage (n)" },
            { word: "Avant-garde", form: "adj", ipa: "/ˌæv.ɒ̃ˈɡɑːd/", meaning: "New and experimental ideas and methods in art, music, or literature.", example: "Her avant-garde fashion designs challenged traditional concepts of beauty.", vietnamese: "Tiên phong, đi trước thời đại", family: "N/A" },
            { word: "Epoch", form: "n", ipa: "/ˈiː.pɒk/", meaning: "A particular period of time in history or a person's life.", example: "The invention of the printing press marked a new epoch in human communication.", vietnamese: "Kỷ nguyên, thời kỳ", family: "N/A" },

        // Text to Speech
        function speakText(text, event) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.9;
                utterance.pitch = 1.1; // Slightly higher pitch for a friendlier voice
                window.speechSynthesis.speak(utterance);
            }
        }

            promptTitle.innerHTML = isPart2 ? 
                `<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> You should say:` : 
                `<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg> Discussion Questions:`;
            
            const promptsList = document.getElementById('q-prompts');
            promptsList.innerHTML = q.prompts.map(p => `
                <li class="flex items-start gap-3">
                    <span class="text-${isPart2 ? 'amber' : 'stone'}-400 mt-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>
                    <span>${p}</span>
                </li>
            `).join('');

            document.getElementById('q-tips').textContent = q.tips;

            // Audio & Timer Reset
            document.getElementById('audio-playback-container').classList.add('hidden');
            const timer = document.getElementById('timer-display');
            timer.textContent = '0:00';
            timer.classList.remove('text-amber-500');
            timer.classList.add('text-slate-300');
            
            const targetMsg = document.getElementById('target-time-msg');
            if (isPart2) {
                targetMsg.classList.remove('hidden');
            } else {
                targetMsg.classList.add('hidden');
            }
        }

        // --- STREAMING_CHUNK:Implementing recording trigger and hardware logic... ---
        async function toggleRecording() {
            if (!isRecording) {
                await startRecordingLogic();
            } else {
                stopRecordingLogic();
            }
        }

        async function startRecordingLogic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audio-player');
                    player.src = audioUrl;
                    
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = audioUrl;
                    
                    const currentQ = PRACTICE_QUESTIONS[currentQuestionIdx];
                    const safeTopicName = currentQ.topic.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                    downloadLink.download = `IELTS_ChanTruong_${currentQ.type.replace(' ', '')}_${safeTopicName}.wav`;
                    
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                // UI Updates for Recording State
                document.getElementById('btn-start-record').classList.add('hidden');
                document.getElementById('btn-stop-record').classList.remove('hidden');
                document.getElementById('audio-playback-container').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-slate-300');
                timer.classList.add('text-amber-500');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = 'width 120s linear'; 
                    progressBar.style.width = '100%';
                }, 50);

                // Timer setup
                secondsRecorded = 0;
                timer.textContent = '0:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60);
                    const secs = secondsRecorded % 60;
                    timer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

                mediaRecorder.start();
                isRecording = true;

            } catch (err) {
                console.error("Microphone error:", err);
                // Creating a custom beautiful alert overlay instead of the ugly browser alert
                const errorAlert = document.createElement('div');
                errorAlert.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-amber-500 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-bold animate-fade-in';
                errorAlert.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Please allow microphone access to record.`;
                document.body.appendChild(errorAlert);
                setTimeout(() => errorAlert.remove(), 4000);
            }
        }

        // --- STREAMING_CHUNK:Implementing recording stop and cleanup logic... ---
        function stopRecordingLogic() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                clearInterval(timerInterval);
                
                document.getElementById('btn-start-record').classList.remove('hidden');
                document.getElementById('btn-stop-record').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-amber-500');
                timer.classList.add('text-slate-300');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }
    </script>
