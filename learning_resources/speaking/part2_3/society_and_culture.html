        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 3D Flip Card CSS */
        .perspective-1000 { perspective: 1000px; }

        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        .is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Modern Pastel Scrollbar */

        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 20px; border: 2px solid #fff; } /* blue-300 */

        /* Smooth Fade In */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Pulse Animation for Recording (Red/Rose theme for recording dot) */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
        .recording-pulse {
            animation: pulse-ring 2s infinite;
        }

        /* Glassmorphism utilities */

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>

    <script>
        // --- DATA ---
        const VOCABULARY = [
            { word: "Heritage", form: "n", ipa: "/ˈher.ɪ.tɪdʒ/", meaning: "Features belonging to the culture of a particular society, such as traditions, languages, or buildings, that were created in the past and still have historical importance.", example: "These monuments are a vital part of the cultural heritage of South America." },
            { word: "Diversity", form: "n", ipa: "/daɪˈvɜː.sə.ti/", meaning: "The fact of many different types of things or people being included in something; a range of different things.", example: "There is a need for greater diversity and choice in education." },
            { word: "Stereotype", form: "n", ipa: "/ˈster.i.ə.taɪp/", meaning: "A set idea that people have about what someone or something is like, especially an idea that is wrong.", example: "He doesn't conform to the usual stereotype of the businessman with a dark suit and briefcase." },
            { word: "Etiquette", form: "n", ipa: "/ˈet.ɪ.ket/", meaning: "The set of rules or customs that control accepted behavior in particular social groups or social situations.", example: "Social etiquette dictates that men cannot sit while women are standing." },
            { word: "Assimilation", form: "n", ipa: "/əˌsɪm.ɪˈleɪ.ʃən/", meaning: "The process of becoming a part, or making someone become a part, of a group, country, society, etc.", example: "The assimilation of immigrants into the host culture can take a long time." },
            { word: "Integration", form: "n", ipa: "/ˌɪn.tɪˈɡreɪ.ʃən/", meaning: "The action or process of successfully joining or mixing with a different group of people.", example: "To promote integration, several schools are now completely mixed." },
            { word: "Conformity", form: "n", ipa: "/kənˈfɔː.mə.ti/", meaning: "Behaviour that follows the usual standards that are expected by a group or society.", example: "It's depressing how much conformity there is in such young children." },
            { word: "Globalization", form: "n", ipa: "/ˌɡləʊ.bəl.aɪˈzeɪ.ʃən/", meaning: "The increase of trade around the world, especially by large companies producing and trading goods in many different countries.", example: "We must take advantage of the increased globalization of the commodity trading business." },
            { word: "Multiculturalism", form: "n", ipa: "/ˌmʌl.tiˈkʌl.tʃər.əl.ɪ.zəm/", meaning: "The belief that different cultures within a society should all be given importance.", example: "Multiculturalism has enriched our city with new cuisines, arts, and traditions." },
            { word: "Xenophobia", form: "n", ipa: "/ˌzen.əˈfəʊ.bi.ə/", meaning: "Extreme dislike or fear of foreigners, their customs, their religions, etc.", example: "The campaign was criticized for appealing to racism and xenophobia." },
            { word: "Socialize", form: "v", ipa: "/ˈsəʊ.ʃəl.aɪz/", meaning: "To spend time when you are not working with friends or with other people in order to enjoy yourself.", example: "I tend not to socialize with my colleagues outside of work." },
            { word: "Upbringing", form: "n", ipa: "/ˈʌpˌbrɪŋ.ɪŋ/", meaning: "The way in which you are treated and educated when young, especially by your parents.", example: "Is it right to say all the crimes he committed were simply the result of his upbringing?" },
            { word: "Custom", form: "n", ipa: "/ˈkʌs.təm/", meaning: "A way of behaving or a belief that has been established for a long time.", example: "In my country, it's the custom for women to marry in white." },
            { word: "Ancestry", form: "n", ipa: "/ˈæn.ses.tri/", meaning: "Your ancestors who lived a long time ago, or the origin of your family.", example: "He was proud of his Native American ancestry." },
            { word: "Demographics", form: "n", ipa: "/ˌdem.əˈɡræf.ɪks/", meaning: "The number and characteristics of people who live in a particular area or form a particular group.", example: "The demographics of the country have changed dramatically in recent years." },
            { word: "Norm", form: "n", ipa: "/nɔːm/", meaning: "An accepted standard or a way of behaving or doing things that most people agree with.", example: "Illness has become the exception rather than the norm." },
            { word: "Alienation", form: "n", ipa: "/ˌeɪ.li.əˈneɪ.ʃən/", meaning: "The feeling that you have no connection with the people around you or that you are not part of a group.", example: "Depressed people frequently feel a sense of alienation from those around them." },
            { word: "Empathy", form: "n", ipa: "/ˈem.pə.θi/", meaning: "The ability to share someone else's feelings or experiences by imagining what it would be like to be in their situation.", example: "He loves children and has a certain empathy with them." },
            { word: "Solidarity", form: "n", ipa: "/ˌsɒl.ɪˈdær.ə.ti/", meaning: "Agreement between and support for the members of a group, especially a political group.", example: "The purpose of the speech was to show solidarity with the country's leaders." },
            { word: "Stratification", form: "n", ipa: "/ˌstræt.ɪ.fɪˈkeɪ.ʃən/", meaning: "The fact that different classes of people exist in a society and the way that these classes are organized.", example: "Social stratification is often based on wealth, race, education, and power." }
        ];

        const EXPRESSIONS = [
            { phrase: "Culture shock", usage: "Part 2/3 - Discussing traveling or moving abroad", example: "It was a real culture shock to find myself in Tokyo after living in a quiet village." },
            { phrase: "Melting pot", usage: "Part 3 - Discussing diversity/immigration", example: "New York has always been a melting pot of different cultures and ethnicities." },
            { phrase: "A far cry from", usage: "Part 3 - Comparing traditions to modern times", example: "This modern apartment is a far cry from the traditional house I grew up in." },
            { phrase: "To blend in", usage: "Part 2/3 - Discussing adaptation or assimilation", example: "When traveling, it's best to observe local customs so you can blend in more easily." },
            { phrase: "To break the ice", usage: "Part 2 - Describing social interactions", example: "He told a few jokes to break the ice before starting the meeting." },
            { phrase: "To bridge the gap", usage: "Part 3 - Discussing generations or inequality", example: "Programs that teach tech skills to the elderly can help bridge the gap between generations." },
            { phrase: "A close-knit community", usage: "Part 2/3 - Discussing neighborhoods/rural life", example: "I grew up in a close-knit community where everyone knew each other's names." },
            { phrase: "The fabric of society", usage: "Part 3 - Discussing essential social elements", example: "Volunteers and social workers make up the very fabric of our society." },
            { phrase: "To turn a blind eye", usage: "Part 3 - Discussing social issues/problems", example: "We can no longer turn a blind eye to the rising poverty levels in the city." },
            { phrase: "To follow in someone's footsteps", usage: "Part 2 - Discussing family or mentors", example: "She decided to follow in her father's footsteps and become a teacher." },
            { phrase: "To go against the grain", usage: "Part 3 - Discussing conformity and norms", example: "Choosing an artistic career over a corporate one really goes against the grain in my family." },
            { phrase: "To stand the test of time", usage: "Part 3 - Discussing heritage and traditions", example: "These ancient architectural techniques have truly stood the test of time." },
            { phrase: "A sense of belonging", usage: "Part 3 - Discussing integration and community", example: "Participating in local festivals helps new residents develop a sense of belonging." },
            { phrase: "The rat race", usage: "Part 3 - Discussing modern life and stress", example: "Many people move to the countryside to escape the stress of the corporate rat race." },
            { phrase: "To step out of one's comfort zone", usage: "Part 2/3 - Discussing trying new experiences", example: "Learning a new language forced me to step out of my comfort zone." },
            { phrase: "Bread and butter", usage: "Part 3 - Discussing livelihoods and economy", example: "Tourism is the bread and butter of this small coastal town." },
            { phrase: "To be born with a silver spoon in one's mouth", usage: "Part 3 - Discussing wealth and stratification", example: "He doesn't understand the struggles of ordinary people because he was born with a silver spoon in his mouth." },
            { phrase: "To keep up with the Joneses", usage: "Part 3 - Discussing materialism and society", example: "Many families go into debt just trying to keep up with the Joneses." },
            { phrase: "Give and take", usage: "Part 3 - Discussing compromises and empathy", example: "Any successful relationship, whether personal or diplomatic, requires a bit of give and take." },
            { phrase: "A way of life", usage: "Part 2/3 - Discussing customs and routines", example: "For the indigenous people of this region, farming isn't just a job; it's a way of life." }
        ];

        const PRACTICE_QUESTIONS = [
            // PART 2 (10 Questions)
            { type: "Part 2", topic: "Describe a cultural event or festival you attended.", prompts: ["What the event was?", "When and where it took place?", "What people did there?", "And explain why you enjoyed or did not enjoy it."], tips: "Use words like 'heritage', 'custom', and mention if it 'stood the test of time'." },
            { type: "Part 2", topic: "Describe a traditional product from your country.", prompts: ["What the product is?", "How it is made?", "What it is used for?", "And explain why it is important to your country's culture."], tips: "Talk about 'ancestry', 'craftsmanship', and how it's 'a way of life'." },
            { type: "Part 2", topic: "Describe an older person who has had a strong influence on you.", prompts: ["Who the person is?", "How you know them?", "What kind of person they are?", "And explain how they have influenced you."], tips: "Mention your 'upbringing', 'following in their footsteps', or 'empathy'." },
            { type: "Part 2", topic: "Describe a rule or law in your country that you think is good.", prompts: ["What the rule/law is?", "How it is enforced?", "Why it was introduced?", "And explain why you think it is a good rule/law."], tips: "Discuss 'conformity', 'etiquette', and 'the fabric of society'." },
            { type: "Part 2", topic: "Describe a time when you experienced a different culture.", prompts: ["Where you were?", "What differences you noticed?", "How you reacted to them?", "And explain what you learned from this experience."], tips: "Use expressions like 'culture shock', 'step out of my comfort zone', and 'blend in'." },
            { type: "Part 2", topic: "Describe a social problem in your country.", prompts: ["What the problem is?", "What causes it?", "How it affects people?", "And explain what could be done to solve it."], tips: "Address 'alienation', 'stratification', or refusing to 'turn a blind eye'." },
            { type: "Part 2", topic: "Describe a tradition in your family.", prompts: ["What the tradition is?", "When you celebrate it?", "Who participates in it?", "And explain why this tradition is important to your family."], tips: "Focus on 'a close-knit community', 'a sense of belonging', and 'heritage'." },
            { type: "Part 2", topic: "Describe a famous historical figure from your country.", prompts: ["Who this person was?", "When they lived?", "What they achieved?", "And explain why they are still remembered today."], tips: "Mention their impact on 'the fabric of society' and their 'solidarity' with the people." },
            { type: "Part 2", topic: "Describe a time you helped someone in your local community.", prompts: ["Who you helped?", "How you helped them?", "Why they needed help?", "And explain how you felt after helping them."], tips: "Use 'empathy', 'solidarity', and 'bridge the gap'." },
            { type: "Part 2", topic: "Describe an important building or monument in your city.", prompts: ["Where it is located?", "What it looks like?", "What it is used for?", "And explain why it is considered important."], tips: "Talk about 'heritage', 'topography/demographics', and 'standing the test of time'." },
            
            // PART 3 - Topic 1 (10 Questions)
            { type: "Part 3", topic: "Tradition vs. Modernity", prompts: [
                "How have traditional customs changed in your country over the last few decades?", 
                "Is it important for young people to learn about their cultural heritage? Why?", 
                "Do you think globalization is causing local cultures to disappear?", 
                "How can museums and historical sites help preserve culture?", 
                "What are the benefits of living in a multicultural society?", 
                "Why do some people prefer traditional ways of living while others embrace modern lifestyles?", 
                "How does the media influence our understanding of different cultures?", 
                "Should immigrants be expected to assimilate completely into their new country's culture?", 
                "In what ways can traditional festivals be adapted for the modern world?", 
                "Do you think traditional gender roles are still relevant in today's society?"
            ], tips: "Incorporate terms like 'globalization', 'assimilation', 'a far cry from', and 'melting pot'." },
            
            // PART 3 - Topic 2 (10 Questions)
            { type: "Part 3", topic: "Social Issues & Community", prompts: [
                "What are the most pressing social problems facing your country today?", 
                "How can individuals contribute to solving social issues in their community?", 
                "Do you think the gap between the rich and the poor is widening? Why?", 
                "What role should the government play in providing social welfare?", 
                "How has technology changed the way people socialize and form communities?", 
                "Is it more important to prioritize individual freedom or social harmony?", 
                "What are the challenges of an aging population for a society?", 
                "How can we promote better understanding between different generations?", 
                "Does living in a large city make people more isolated from their neighbors?", 
                "What impact does volunteering have on both the individual and the community?"
            ], tips: "Use vocabulary like 'stratification', 'alienation', 'bridge the gap', and 'the rat race'." }
        ];

        // --- STATE ---
        let currentFilter = 'all';
        let currentQuestionIdx = 0;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let secondsRecorded = 0;
        let stream = null;

        window.onload = () => {
            renderCards();
            renderQuestionList();
            selectQuestion(0);
        };

        // --- UI FUNCTIONS ---
        function switchTab(tab) {
            document.getElementById('section-study').style.display = tab === 'study' ? 'block' : 'none';
            document.getElementById('section-practice').style.display = tab === 'practice' ? 'flex' : 'none';
            
            const btnStudy = document.getElementById('tab-study');
            const btnPractice = document.getElementById('tab-practice');
            
            // Pastel active/inactive states
            const activeClasses = 'flex-1 py-3 px-4 rounded-xl font-bold transition-all duration-300 shadow-sm bg-white text-indigo-600 border border-indigo-100 flex items-center justify-center gap-2';
            const inactiveClasses = 'flex-1 py-3 px-4 rounded-xl font-medium transition-all duration-300 text-slate-500 hover:text-indigo-600 hover:bg-white/50 flex items-center justify-center gap-2 border border-transparent';
            
            if (tab === 'study') {
                btnStudy.className = activeClasses;
                btnPractice.className = inactiveClasses;
                stopRecordingLogic();
            } else {
                btnPractice.className = activeClasses;
                btnStudy.className = inactiveClasses;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            const activeClass = 'px-5 py-2.5 rounded-full text-sm font-bold bg-indigo-100 text-indigo-700 shadow-sm transition-all';
            const inactiveClass = 'px-5 py-2.5 rounded-full text-sm font-medium text-slate-500 hover:bg-white transition-all hover:shadow-sm';
            
            document.getElementById('filter-all').className = filter === 'all' ? activeClass : inactiveClass;
            document.getElementById('filter-vocab').className = filter === 'vocab' ? activeClass : inactiveClass;
            document.getElementById('filter-expressions').className = filter === 'expressions' ? activeClass : inactiveClass;
            renderCards();
        }

        function renderCards() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const vocabContainer = document.getElementById('vocab-container');
            const expressionsContainer = document.getElementById('expressions-container');
            const vocabGrid = document.getElementById('vocab-grid');
            const expressionsGrid = document.getElementById('expressions-grid');

            vocabGrid.innerHTML = '';
            expressionsGrid.innerHTML = '';

            if (currentFilter === 'all' || currentFilter === 'vocab') {
                const filteredVocab = VOCABULARY.filter(v => v.word.toLowerCase().includes(searchTerm) || v.meaning.toLowerCase().includes(searchTerm));
                if (filteredVocab.length > 0) {
                    vocabContainer.style.display = 'block';
                    filteredVocab.forEach(item => {
                        vocabGrid.innerHTML += createCardHTML(item.word, item.meaning, item.example, 'vocab', item.form, item.ipa);
                    });
                } else {
                    vocabContainer.style.display = 'none';
                }
            } else {
                vocabContainer.style.display = 'none';
            }

            if (currentFilter === 'all' || currentFilter === 'expressions') {
                const filteredExp = EXPRESSIONS.filter(e => e.phrase.toLowerCase().includes(searchTerm) || e.usage.toLowerCase().includes(searchTerm));
                if (filteredExp.length > 0) {
                    expressionsContainer.style.display = 'block';
                    filteredExp.forEach(item => {
                        expressionsGrid.innerHTML += createCardHTML(item.phrase, item.usage, item.example, 'expression', null, null);
                    });
                } else {
                    expressionsContainer.style.display = 'none';
                }
            } else {
                expressionsContainer.style.display = 'none';
            }
        }

        function createCardHTML(title, subtitle, example, type, form, ipa) {
            const isVocab = type === 'vocab';
            const badgeClass = isVocab ? 'bg-indigo-100 text-indigo-700' : 'bg-cyan-100 text-cyan-700';
            const badgeText = isVocab ? 'Word' : 'Phrase';
            const bgClassBack = isVocab ? 'bg-indigo-50 border-indigo-100' : 'bg-cyan-50 border-cyan-100';
            
            let extraInfo = '';
            if (isVocab) {
                extraInfo = `
                    <div class="flex items-center justify-center gap-3 mt-4">
                        <span class="text-xs font-bold text-indigo-400 bg-indigo-50 px-2 py-1 rounded-md uppercase tracking-wider">${form}</span>
                        <span class="text-sm font-semibold text-slate-500">${ipa}</span>
                        <button onclick="speakText('${title}', event)" class="p-2 rounded-full bg-indigo-100 text-indigo-600 hover:bg-indigo-200 hover:scale-110 transition-all" title="Listen">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="relative w-full h-72 perspective-1000 transition-transform duration-300 hover:-translate-y-1 hover:shadow-xl rounded-[2rem] cursor-pointer group" onclick="this.classList.toggle('is-flipped')">
                    <div class="card-inner w-full h-full relative transform-style-3d transition-transform duration-[600ms] rounded-[2rem] shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-white/50">
                        <!-- Front of Card -->
                        <div class="absolute w-full h-full backface-hidden bg-white/90 backdrop-blur-sm border border-slate-100 rounded-[2rem] flex flex-col items-center justify-center p-8 text-center">
                            <span class="absolute top-5 right-5 text-[10px] font-black uppercase tracking-wider px-3 py-1.5 rounded-lg ${badgeClass}">${badgeText}</span>
                            <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">${title}</h3>
                            ${extraInfo}
                            <div class="absolute bottom-5 left-0 w-full text-center">
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-1.5">
                                    <svg class="w-4 h-4 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                                    Click to flip
                                </p>
                            </div>
                        </div>
                        
                        <!-- Back of Card -->
                        <div class="absolute w-full h-full backface-hidden ${bgClassBack} border-2 rounded-[2rem] p-7 rotate-y-180 flex flex-col shadow-inner cursor-default">
                            <div class="flex justify-between items-start mb-4 border-b border-black/5 pb-3 shrink-0">
                                <h4 class="font-extrabold text-slate-800 text-lg">${title}</h4>
                                <button onclick="event.stopPropagation(); this.closest('.perspective-1000').classList.remove('is-flipped')" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-black/5 rounded-full transition-colors cursor-pointer" title="Close">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                            
                            <div class="overflow-y-auto custom-scrollbar flex-grow pr-3" onclick="event.stopPropagation()">
                                <div class="mb-5">
                                    <p class="text-[10px] font-black uppercase tracking-widest text-${isVocab ? 'indigo' : 'cyan'}-600 mb-2 opacity-80">${isVocab ? 'Meaning:' : 'Usage:'}</p>
                                    <p class="text-slate-700 font-medium leading-relaxed">${subtitle}</p>
                                </div>
                                <div class="mt-auto">
                                    <p class="text-[10px] font-black uppercase tracking-widest text-${isVocab ? 'indigo' : 'cyan'}-600 mb-2 opacity-80">Example:</p>
                                    <p class="text-slate-800 bg-white/70 p-4 rounded-2xl text-sm border-l-4 border-${isVocab ? 'indigo' : 'cyan'}-400 shadow-sm italic font-semibold leading-relaxed">"${example}"</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Text to Speech
        function speakText(text, event) {
            event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-GB';
                utterance.rate = 0.9;
                utterance.pitch = 1.1; // Slightly higher pitch for a friendlier voice
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderQuestionList() {
            const list = document.getElementById('question-list');
            list.innerHTML = '';
            
            PRACTICE_QUESTIONS.forEach((q, index) => {
                const isPart2 = q.type === 'Part 2';
                const badgeClass = isPart2 ? 'bg-blue-100 text-blue-700' : 'bg-cyan-100 text-cyan-700';
                
                list.innerHTML += `
                    <button id="q-btn-${index}" onclick="selectQuestion(${index})" class="w-full text-left p-4 hover:bg-white/60 transition-all duration-200 flex items-start border-l-4 border-transparent rounded-xl my-1 group">
                        <span class="inline-block px-2.5 py-1 rounded-md text-[10px] font-black uppercase tracking-wider mr-3 mt-0.5 whitespace-nowrap shadow-sm ${badgeClass}">
                            ${q.type}
                        </span>
                        <span class="font-bold text-slate-600 text-sm leading-snug group-hover:text-indigo-600 transition-colors q-topic-text">
                            ${q.topic}
                        </span>
                    </button>
                `;
            });
        }

        function selectQuestion(index) {
            stopRecordingLogic();

            currentQuestionIdx = index;
            const q = PRACTICE_QUESTIONS[index];
            const isPart2 = q.type === 'Part 2';

            // Sidebar styling
            document.querySelectorAll('[id^="q-btn-"]').forEach(btn => {
                btn.classList.remove('bg-white', 'border-indigo-400', 'shadow-sm');
                btn.querySelector('.q-topic-text').classList.remove('text-indigo-700');
                btn.querySelector('.q-topic-text').classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`q-btn-${index}`);
            activeBtn.classList.add('bg-white', 'border-indigo-400', 'shadow-sm');
            activeBtn.querySelector('.q-topic-text').classList.remove('text-slate-600');
            activeBtn.querySelector('.q-topic-text').classList.add('text-indigo-700');

            // Update Main View
            const badge = document.getElementById('q-type-badge');
            badge.textContent = q.type;
            badge.className = `px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest shadow-sm ${isPart2 ? 'bg-blue-100 text-blue-700' : 'bg-cyan-100 text-cyan-700'}`;
            
            document.getElementById('q-topic').textContent = q.topic;
            
            const promptTitle = document.getElementById('q-prompt-title');
            promptTitle.innerHTML = isPart2 ? 
                `<svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> You should say:` : 
                `<svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg> Discussion Questions:`;
            
            const promptsList = document.getElementById('q-prompts');
            promptsList.innerHTML = q.prompts.map(p => `
                <li class="flex items-start gap-3">
                    <span class="text-${isPart2 ? 'indigo' : 'cyan'}-400 mt-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg></span>
                    <span>${p}</span>
                </li>
            `).join('');

            document.getElementById('q-tips').textContent = q.tips;

            // Audio & Timer Reset
            document.getElementById('audio-playback-container').classList.add('hidden');
            const timer = document.getElementById('timer-display');
            timer.textContent = '0:00';
            timer.classList.remove('text-indigo-500');
            timer.classList.add('text-slate-300');
            
            const targetMsg = document.getElementById('target-time-msg');
            if (isPart2) {
                targetMsg.classList.remove('hidden');
            } else {
                targetMsg.classList.add('hidden');
            }
        }

        async function toggleRecording() {
            if (!isRecording) {
                await startRecordingLogic();
            } else {
                stopRecordingLogic();
            }
        }

        async function startRecordingLogic() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    const player = document.getElementById('audio-player');
                    player.src = audioUrl;
                    
                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = audioUrl;
                    
                    const currentQ = PRACTICE_QUESTIONS[currentQuestionIdx];
                    const safeTopicName = currentQ.topic.replace(/[^a-z0-9]/gi, '_').substring(0, 40);
                    downloadLink.download = `IELTS_ChanTruong_${currentQ.type.replace(' ', '')}_${safeTopicName}.wav`;
                    
                    document.getElementById('audio-playback-container').classList.remove('hidden');
                    stream.getTracks().forEach(track => track.stop());
                };

                // UI Updates for Recording State
                document.getElementById('btn-start-record').classList.add('hidden');
                document.getElementById('btn-stop-record').classList.remove('hidden');
                document.getElementById('audio-playback-container').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-slate-300');
                timer.classList.add('text-indigo-500');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.transition = 'width 120s linear'; 
                    progressBar.style.width = '100%';
                }, 50);

                // Timer setup
                secondsRecorded = 0;
                timer.textContent = '0:00';
                timerInterval = setInterval(() => {
                    secondsRecorded++;
                    const mins = Math.floor(secondsRecorded / 60);
                    const secs = secondsRecorded % 60;
                    timer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);

                mediaRecorder.start();
                isRecording = true;

            } catch (err) {
                console.error("Microphone error:", err);
                // Creating a custom beautiful alert overlay instead of the ugly browser alert
                const errorAlert = document.createElement('div');
                errorAlert.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-teal-500 text-white px-6 py-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 font-bold animate-fade-in';
                errorAlert.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Please allow microphone access to record.`;
                document.body.appendChild(errorAlert);
                setTimeout(() => errorAlert.remove(), 4000);
            }
        }

        function stopRecordingLogic() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                
                clearInterval(timerInterval);
                
                document.getElementById('btn-start-record').classList.remove('hidden');
                document.getElementById('btn-stop-record').classList.add('hidden');
                
                const timer = document.getElementById('timer-display');
                timer.classList.remove('text-indigo-500');
                timer.classList.add('text-slate-300');
                
                const progressBar = document.getElementById('recording-progress');
                progressBar.style.transition = 'none';
                progressBar.style.width = '0%';
            }
        }
    </script>
</body>
