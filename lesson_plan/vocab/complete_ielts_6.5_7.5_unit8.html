<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 8 - Across the Universe</title>
    
    <!-- Google Fonts: Playfair Display (Serif), Jost (Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Twilight Indigo & Starlight Amber (Space, Discovery, Modern) */
            --primary: #4f46e5; /* Indigo 600 */
            --primary-light: #e0e7ff; /* Indigo 100 */
            --primary-hover: #3730a3; /* Indigo 800 */
            --text-main: #1e293b; /* Slate 800 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-body: #f8fafc; /* Slate 50 (Very light blue-grey) */
            --card-bg: #ffffff;
            --accent: #f59e0b; /* Amber 500 */
            --accent-light: #fef3c7; /* Amber 100 */
            --border: #cbd5e1; /* Slate 300 */
            --badge-bg: #f3e8ff; /* Purple 100 */
            --badge-text: #7e22ce; /* Purple 700 */
            --success: #0284c7; /* Ocean Blue for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        
        header { text-align: center; margin-top: 3rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.01em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.15rem; 
            font-weight: 600; 
            letter-spacing: 0.15em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.6rem 1.3rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid var(--border); 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 30px -10px rgba(79, 70, 229, 0.2); 
            border-color: var(--primary); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.7rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.05rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .word-families { 
            background-color: var(--bg-body); 
            border: 1px solid var(--border); 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.6rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #92400e; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.8rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.5rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #fafaf9; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.35rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.25rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed; bottom: 30px; right: 30px; background: var(--text-main); color: white;
            padding: 1rem 1.5rem; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .toast-notification.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 0.9rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 580px; } 
            .flashcard-front .word { font-size: 2.8rem; } 
            .flashcard-back .definition { font-size: 1.15rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 8</h1>
        <p class="subtitle">Across the Universe</p>
    </header>

    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all', event)">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Space & Astronomy', event)">Space & Astronomy</button>
        <button class="filter-btn" onclick="filterTopic('Science & Environment', event)">Science & Environment</button>
        <button class="filter-btn" onclick="filterTopic('Attributes & Psychology', event)">Attributes & Psychology</button>
        <button class="filter-btn" onclick="filterTopic('Society & Debates', event)">Society & Debates</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Expressions', event)">Idioms & Expressions</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--badge-bg); border: none; color: var(--badge-text);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    const vocabBank = [
        // --- Space & Astronomy ---
        { topic: "Space & Astronomy", word: "Asteroid", phonetic: "/ˈæstərɔɪd/", form: "Noun", forms: "N/A", def: "One of many large rocks that circle the sun.", translation: "Tiểu hành tinh", example: "The spacecraft successfully landed on the asteroid to collect rock samples." },
        { topic: "Space & Astronomy", word: "Crater", phonetic: "/ˈkreɪtə(r)/", form: "Noun", forms: "N/A", def: "The round hole at the top of a volcano, or a hole in the ground made by a falling object.", translation: "Miệng hố (do thiên thạch/núi lửa)", example: "The surface of the moon is heavily pitted with impact craters." },
        { topic: "Space & Astronomy", word: "Astronomy", phonetic: "/əˈstrɒnəmi/", form: "Noun", forms: "N: Astronomer", def: "The scientific study of the universe and of objects that exist naturally in space.", translation: "Thiên văn học", example: "Her fascination with the stars led her to pursue a degree in astronomy." },
        { topic: "Space & Astronomy", word: "Terraform", phonetic: "/ˈterəfɔːm/", form: "Verb", forms: "N: Terraforming", def: "To change the environment of a planet so that it is more like Earth.", translation: "Địa khai hóa", example: "Terraforming Mars remains a highly speculative concept in theoretical science." },
        { topic: "Space & Astronomy", word: "Extraterrestrial", phonetic: "/ˌekstrətəˈrestriəl/", form: "Adjective", forms: "N/A", def: "In or coming from a place outside the planet Earth.", translation: "Thuộc ngoài Trái đất", example: "Scientists continue to search the universe for signs of extraterrestrial life." },
        { topic: "Space & Astronomy", word: "Meteor", phonetic: "/ˈmiːtiə(r)/", form: "Noun", forms: "N/A", def: "A piece of rock or other matter from space that produces a bright light as it travels through the atmosphere.", translation: "Sao băng, thiên thạch", example: "We lay on the grass all night to watch the spectacular meteor shower." },
        { topic: "Space & Astronomy", word: "Rotation", phonetic: "/rəʊˈteɪʃn/", form: "Noun", forms: "V: Rotate", def: "The action of an object moving in a circle around a central fixed point.", translation: "Sự luân phiên, sự tự quay", example: "The rotation of the planet dictates the length of its days." },

        // --- Science & Environment ---
        { topic: "Science & Environment", word: "Replica", phonetic: "/ˈreplɪkə/", form: "Noun", forms: "V: Replicate", def: "An exact copy of an object.", translation: "Bản sao chính xác", example: "The museum houses a full-scale replica of the command module." },
        { topic: "Science & Environment", word: "Divert", phonetic: "/daɪˈvɜːt/", form: "Verb", forms: "N: Diversion", def: "To cause something or someone to change direction.", translation: "Làm chuyển hướng", example: "Engineers are researching methods to divert an asteroid on a collision course with Earth." },
        { topic: "Science & Environment", word: "Propel", phonetic: "/prəˈpel/", form: "Verb", forms: "N: Propulsion", def: "To push or move something somewhere, often with a lot of force.", translation: "Đẩy đi, thúc đẩy", example: "The new rocket engine uses nuclear energy to propel the spacecraft faster." },
        { topic: "Science & Environment", word: "Barren", phonetic: "/ˈbærən/", form: "Adjective", forms: "N/A", def: "Unable to produce plants or fruit; completely lacking in something.", translation: "Cằn cỗi, trống rỗng", example: "The photographs revealed a barren and desolate landscape stretching for miles." },
        { topic: "Science & Environment", word: "Remnant", phonetic: "/ˈremnənt/", form: "Noun", forms: "N/A", def: "A small piece or amount of something that is left from a larger original piece or amount.", translation: "Tàn dư", example: "The glowing cloud of gas is a remnant of a supernova explosion." },
        { topic: "Science & Environment", word: "Radiation", phonetic: "/ˌreɪdiˈeɪʃn/", form: "Noun", forms: "Adj: Radioactive", def: "A form of energy that comes from a nuclear reaction and that can be very dangerous.", translation: "Bức xạ", example: "Astronauts need special shielding to protect against cosmic radiation." },

        // --- Attributes & Psychology ---
        { topic: "Attributes & Psychology", word: "Intrinsic", phonetic: "/ɪnˈtrɪnzɪk/", form: "Adjective", forms: "Adv: Intrinsically", def: "Being an extremely important and basic characteristic of a person or thing.", translation: "Bản chất, thuộc về nội tại", example: "Exploration seems to be an intrinsic part of human nature." },
        { topic: "Attributes & Psychology", word: "Resilience", phonetic: "/rɪˈzɪliəns/", form: "Noun", forms: "Adj: Resilient", def: "The ability to recover quickly from difficulties; toughness.", translation: "Sự kiên cường", example: "Mental resilience is just as important as physical fitness for deep space missions." },
        { topic: "Attributes & Psychology", word: "Cynical", phonetic: "/ˈsɪnɪkl/", form: "Adjective", forms: "N: Cynic", def: "Believing that people are only interested in themselves and are not sincere.", translation: "Hoài nghi, yếm thế", example: "Many voters have become cynical about the government spending on space travel." },
        { topic: "Attributes & Psychology", word: "Introspective", phonetic: "/ˌɪntrəˈspektɪv/", form: "Adjective", forms: "N: Introspection", def: "Examining and considering your own ideas, thoughts, and feelings.", translation: "Hay tự vấn, hướng nội", example: "The long, isolated journey requires astronauts to be highly introspective." },
        { topic: "Attributes & Psychology", word: "Accountability", phonetic: "/əˌkaʊntəˈbɪləti/", form: "Noun", forms: "Adj: Accountable", def: "The fact of being responsible for what you do.", translation: "Trách nhiệm giải trình", example: "A strong sense of accountability is required for managing such a costly mission." },

        // --- Society & Debates ---
        { topic: "Society & Debates", word: "Advocate", phonetic: "/ˈædvəkət/", form: "Noun", forms: "V: Advocate", def: "Someone who publicly supports something they believe in.", translation: "Người ủng hộ", example: "He is a strong advocate for increasing the budget of the space program." },
        { topic: "Society & Debates", word: "Public purse", phonetic: "/ˌpʌblɪk ˈpɜːs/", form: "Noun Phrase", forms: "N/A", def: "Money from the government that is available to be spent.", translation: "Ngân sách nhà nước", example: "Funding for deep space exploration puts a massive strain on the public purse." },
        { topic: "Society & Debates", word: "Humanitarian", phonetic: "/hjuːˌmænɪˈteəriən/", form: "Adjective", forms: "N/A", def: "Involved in or connected with improving people's lives and reducing suffering.", translation: "Nhân đạo", example: "Critics suggest that humanitarian causes should take precedence over trips to Mars." },
        { topic: "Society & Debates", word: "Mundane", phonetic: "/mʌnˈdeɪn/", form: "Adjective", forms: "N/A", def: "Very ordinary and therefore not interesting.", translation: "Tầm thường, trần tục", example: "Compared to exploring the cosmos, doing paperwork felt incredibly mundane." },
        { topic: "Society & Debates", word: "Habitability", phonetic: "/ˌhæbɪtəˈbɪləti/", form: "Noun", forms: "Adj: Habitable", def: "The state of being suitable for humans or animals to live in.", translation: "Khả năng ở được", example: "The main mission is to assess the habitability of newly discovered exoplanets." },

        // --- Idioms & Expressions ---
        { topic: "Idioms & Expressions", word: "Give birth to", phonetic: "/ɡɪv bɜːθ tu/", form: "Idiom", forms: "N/A", def: "To cause something new to be produced.", translation: "Sản sinh ra, tạo ra", example: "The successful launch gave birth to a new era of commercial spaceflight." },
        { topic: "Idioms & Expressions", word: "Blow off some steam", phonetic: "/bləʊ ɒf sʌm stiːm/", form: "Idiom", forms: "N/A", def: "To do or say something that helps you to get rid of strong feelings or energy.", translation: "Xả hơi", example: "After months of rigorous training, the crew needed a few days to blow off some steam." },
        { topic: "Idioms & Expressions", word: "On the spur of the moment", phonetic: "/ɒn ðə spɜːr əv ðə ˈməʊmənt/", form: "Idiom", forms: "N/A", def: "Used to say that a decision, action, etc. is sudden and done without any planning.", translation: "Một cách bốc đồng", example: "We decided to drive out to the desert to watch the comet on the spur of the moment." },
        { topic: "Idioms & Expressions", word: "Make a long story short", phonetic: "/meɪk ə lɒŋ ˈstɔːri ʃɔːt/", form: "Idiom", forms: "N/A", def: "Used when you are explaining what happened in a few words.", translation: "Nói tóm lại", example: "To make a long story short, the engine failed due to a microscopic leak." },
        { topic: "Idioms & Expressions", word: "If my memory serves me well", phonetic: "/ɪf maɪ ˈmeməri sɜːvz mi wel/", form: "Phrase", forms: "N/A", def: "If I remember correctly.", translation: "Nếu tôi nhớ không lầm", example: "If my memory serves me well, the Voyager 1 probe was launched in 1977." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            // Safely escape quotes to prevent SyntaxError injections
            const safeWord = item.word.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" data-word="${safeWord}" onclick="playAudio(this.getAttribute('data-word'))" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border: none; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related/Notes:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            let cleanText = text.replace(/\bsth\b/g, 'something').replace(/\bsb\b/g, 'somebody');
            cleanText = cleanText.replace(/\(.*?\)/g, ''); 
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; 
            
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Google UK English') || 
                voice.name.includes('Daniel') || 
                voice.name.includes('Samantha')
            );
            
            if (!selectedVoice) selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            if (selectedVoice) utterance.voice = selectedVoice;

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); 
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName, event) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        } else {
            // Programmatic fallback
            filterBtns.forEach(btn => {
                if (btn.textContent.includes(topicName) || (topicName === 'all' && btn.textContent === 'All Terms')) {
                    btn.classList.add('active');
                }
            });
        }

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Space')) topicName = 'Space & Astronomy';
            else if (activeFilterText.includes('Science')) topicName = 'Science & Environment';
            else if (activeFilterText.includes('Attributes')) topicName = 'Attributes & Psychology';
            else if (activeFilterText.includes('Society')) topicName = 'Society & Debates';
            else if (activeFilterText.includes('Idioms')) topicName = 'Idioms & Expressions';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related/Notes:</strong> ${data.forms}`;
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    window.onload = function() {
        renderGrid();
    };
</script>
</body>
</html>
