<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Passage | An Ideal City - Vocabulary</title>
    <style>
        :root {
            /* Theme: Minimalist Light Summer / Sweet Candy Purple & Pastel Pink */
            --primary: #c084fc; /* Candy Purple */
            --primary-light: #f3e8ff;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-body: #faf5ff;
            --card-bg: #ffffff;
            --accent: #a855f7;
            --border: #e9d5ff;
            --badge-bg: #fce7f3; /* Pastel Pink */
            --badge-text: #db2777;
            --success: #f472b6; /* Soft Pink */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        .header-banner { background-color: var(--card-bg); color: var(--text-main); text-align: center; padding: 1rem; font-weight: 700; font-size: 1.2rem; letter-spacing: 0.1em; width: 100%; border-bottom: 3px solid var(--primary); margin-bottom: 2rem; text-transform: uppercase; }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--accent); font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 600; background: var(--card-bg); color: var(--accent); border: 2px solid var(--border); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 6px rgba(192, 132, 252, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--success); color: white; border-color: var(--success); box-shadow: 0 4px 6px rgba(244, 114, 182, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--success); color: var(--success); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); border: 1px solid #f1f5f9; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(192, 132, 252, 0.15); border-color: var(--border); }
        .vocab-card.hidden { display: none; }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.75rem; }
        .word-main { display: flex; align-items: center; gap: 0.5rem; }
        .word { font-size: 1.4rem; font-weight: 800; color: var(--accent); text-transform: capitalize; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.4rem; border-radius: 50%; transition: transform 0.2s, background-color 0.2s; color: var(--accent); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary-light); }
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        
        .word-families { background-color: #fdf2f8; border: 1px dashed #fbcfe8; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #9d174d; margin-bottom: 1rem; }
        .word-families strong { color: #be185d; }

        .topic-tag { font-size: 0.8rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; margin-bottom: 1rem; display: inline-block;}
        
        .definition { font-size: 1rem; margin-bottom: 0.25rem; color: var(--text-main); }
        .definition strong { color: var(--accent); }
        
        /* Translation and Usage */
        .translation { font-size: 0.95rem; color: var(--success); margin-bottom: 0.5rem; font-weight: 600; }

        .example-box { background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.35rem; font-weight: 800; }
        .extra-example { background-color: #f8fafc; border-left-color: #94a3b8; margin-top: 0.75rem; }
        .extra-example span { color: #64748b; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 650px; height: 550px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(192, 132, 252, 0.15); border: 2px solid #fdf4ff; background: var(--card-bg); padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 2.8rem; margin-bottom: 1rem; color: var(--accent); text-transform: capitalize; font-weight: 800;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .flashcard-front .audio-btn { font-size: 2rem; background: var(--primary-light); padding: 0.8rem; }
        .flashcard-front .phonetic { font-size: 1.3rem; color: var(--text-muted); font-style: italic; }
        .flashcard-back { transform: rotateY(180deg); background: #faf5ff; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--accent); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        
        .flashcard-back .definition { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.1rem; margin-bottom: 1rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; font-size: 1rem; padding: 1rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--accent); font-size: 1rem; font-weight: 700; cursor: pointer; padding: 0.5rem 1.2rem; border-radius: 20px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.1rem; color: var(--success); min-width: 70px; text-align: center; }

        @media (max-width: 768px) { 
            h1 { font-size: 1.8rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 620px; } 
            .flashcard-front .word { font-size: 2.2rem; } 
            .flashcard-back .definition { font-size: 1rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="header-banner">Academic Training</div>

<div class="container">
    <header>
        <h1>Reading Passage | An Ideal City</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem;">Target Band 6.5 - 7.5+ | Vocabulary Builder</p>
    </header>

    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Urban Planning & Architecture')">Urban Planning & Architecture</button>
        <button class="filter-btn" onclick="filterTopic('Crises & Solutions')">Crises & Solutions</button>
        <button class="filter-btn" onclick="filterTopic('Ideas & Development')">Ideas & Development</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcard Study</button>
    </div>

    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 80%;">Families</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic: General</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning & Usage</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 32</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: #e9d5ff; margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <main id="grid-view">
        </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (An Ideal City)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- CATEGORY 1: Urban Planning & Architecture ---
        { topic: "Urban Planning & Architecture", word: "Conception", phonetic: "/kənˈsepʃn/", form: "Noun", forms: "V: Conceive | Adj: Conceptual", def: "The forming or devising of a plan or idea.", translation: "Sự phác thảo, quan niệm", example: "The rigour and method behind the conscious conception of a city had been largely missing...", extraExample: "The plan was brilliant in its conception but poorly executed." },
        { topic: "Urban Planning & Architecture", word: "Reconfiguration", phonetic: "/ˌriːkənˌfɪɡəˈreɪʃn/", form: "Noun", forms: "V: Reconfigure", def: "An arrangement of parts or elements in a different form, figure, or combination.", translation: "Sự cấu trúc lại, quy hoạch lại", example: "...such as the reconfiguration of the town of Pienza and the expansion of the city of Ferrara.", extraExample: "The reconfiguration of the office layout improved productivity." },
        { topic: "Urban Planning & Architecture", word: "Winding", phonetic: "/ˈwaɪndɪŋ/", form: "Adjective", forms: "V: Wind", def: "Following a twisting or spiral course.", translation: "Quanh co, uốn khúc", example: "...to rethink the design of medieval cities, with their winding and overcrowded streets...", extraExample: "We drove along a steep, winding road through the mountains." },
        { topic: "Urban Planning & Architecture", word: "Overcrowded", phonetic: "/ˌəʊvəˈkraʊdɪd/", form: "Adjective", forms: "N: Overcrowding", def: "Filled beyond what is comfortable or safe.", translation: "Đông đúc, chật ních", example: "...with their winding and overcrowded streets and with houses piled against one another.", extraExample: "The hospital is severely overcrowded and understaffed." },
        { topic: "Urban Planning & Architecture", word: "Battlement", phonetic: "/ˈbætlmənt/", form: "Noun", forms: "N/A", def: "A parapet at the top of a wall, usually of a fort or castle, that has regularly spaced, squared openings.", translation: "Tường lỗ châu mai", example: "He recommended 'high, strong walls', with 'towers and battlements of all necessary and pleasant beauty'.", extraExample: "The tourists walked along the ancient battlements of the castle." },
        { topic: "Urban Planning & Architecture", word: "Fusion", phonetic: "/ˈfjuːʒn/", form: "Noun", forms: "V: Fuse", def: "The process or result of joining two or more things together to form a single entity.", translation: "Sự kết hợp, sự dung hợp", example: "But the true originality of Leonardo's vision was its fusion of architecture and engineering.", extraExample: "The restaurant serves a delicious fusion of Asian and French cuisine." },
        { topic: "Urban Planning & Architecture", word: "Hydraulic", phonetic: "/haɪˈdrɒlɪk/", form: "Adjective", forms: "N: Hydraulics", def: "Denoting, relating to, or operated by a liquid moving in a confined space under pressure.", translation: "Thuộc về thủy lực", example: "Leonardo designed extensive hydraulic plants to create artificial canals...", extraExample: "The machine uses a hydraulic press to lift heavy cars." },
        { topic: "Urban Planning & Architecture", word: "Subdivision", phonetic: "/ˌsʌbdɪˈvɪʒn/", form: "Noun", forms: "V: Subdivide", def: "The act of dividing a part of something into smaller parts.", translation: "Sự phân khu, chia nhỏ", example: "For example, the subdivision of the city by function... is an idea that can be found...", extraExample: "The subdivision of the large estate into smaller plots caused local controversy." },
        { topic: "Urban Planning & Architecture", word: "Infrastructure", phonetic: "/ˈɪnfrəstrʌktʃə(r)/", form: "Noun", forms: "N/A", def: "The basic physical and organizational structures and facilities needed for the operation of a society or enterprise.", translation: "Cơ sở hạ tầng", example: "...with efficient transport infrastructure, could help modem cities become more efficient...", extraExample: "The country's transport infrastructure is in desperate need of repair." },
        { topic: "Urban Planning & Architecture", word: "Sustainable", phonetic: "/səˈsteɪnəbl/", form: "Adjective", forms: "N: Sustainability | V: Sustain", def: "Able to be maintained at a certain rate or level; conserving an ecological balance.", translation: "Bền vững", example: "...could help modem cities become more efficient and sustainable.", extraExample: "The building was designed entirely with sustainable materials." },
        { topic: "Urban Planning & Architecture", word: "Unsustainable", phonetic: "/ˌʌnsəˈsteɪnəbl/", form: "Adjective", forms: "N: Sustainability | V: Sustain", def: "Not able to be maintained at the current rate or level.", translation: "Không bền vững", example: "Yet given that unsustainable urban models are a key cause of global climate change today...", extraExample: "Farming at this intensive scale is ecologically unsustainable." },

        // --- CATEGORY 2: Crises & Solutions ---
        { topic: "Crises & Solutions", word: "Catastrophe", phonetic: "/kəˈtæstrəfi/", form: "Noun", forms: "Adj: Catastrophic", def: "An event causing great and usually sudden damage or suffering; a disaster.", translation: "Thảm họa", example: "...radical solutions were called for to revolutionise the way people lived and safeguard humanity against catastrophe.", extraExample: "The earthquake was a devastating environmental catastrophe." },
        { topic: "Crises & Solutions", word: "Safeguard", phonetic: "/ˈseɪfɡɑːd/", form: "Verb", forms: "N: Safeguard", def: "Protect from harm or damage with an appropriate measure.", translation: "Bảo vệ, che chở", example: "...and safeguard humanity against catastrophe.", extraExample: "We must implement new policies to safeguard our personal information online." },
        { topic: "Crises & Solutions", word: "Pestilence", phonetic: "/ˈpestɪləns/", form: "Noun", forms: "N/A", def: "A fatal epidemic disease, especially bubonic plague.", translation: "Dịch bệnh, ôn dịch", example: "Around 1486 - after a pestilence that killed half the population in Milan...", extraExample: "In medieval times, pestilence wiped out entire cities within months." },
        { topic: "Crises & Solutions", word: "On the cusp of", phonetic: "/ɒn ðə kʌsp əv/", form: "Phrase", forms: "N/A", def: "At the point when something is about to change to something else.", translation: "Ở thời khắc giao thời, sắp sửa", example: "Today, the world is on the cusp of a climate crisis...", extraExample: "The technology company is on the cusp of a major breakthrough." },
        { topic: "Crises & Solutions", word: "Displacement", phonetic: "/dɪsˈpleɪsmənt/", form: "Noun", forms: "V: Displace", def: "The enforced departure of people from their homes, typically because of war, persecution, or natural disaster.", translation: "Sự phải di dời", example: "...which is predicted to cause widespread displacement, extinctions and death...", extraExample: "The civil war caused the mass displacement of thousands of refugees." },
        { topic: "Crises & Solutions", word: "Unaddressed", phonetic: "/ˌʌnəˈdrest/", form: "Adjective", forms: "V: Address", def: "Not dealt with or resolved.", translation: "Không được giải quyết", example: "...cause widespread displacement, extinctions and death, if left unaddressed.", extraExample: "The safety issues at the factory remained unaddressed for years." },
        { topic: "Crises & Solutions", word: "Radical", phonetic: "/ˈrædɪkl/", form: "Adjective", forms: "Adv: Radically", def: "Relating to or affecting the fundamental nature of something; far-reaching or thorough.", translation: "Triệt để, cấp tiến", example: "Then, as now, radical solutions were called for to revolutionise the way people lived...", extraExample: "The new manager implemented radical changes to the company's structure." },
        { topic: "Crises & Solutions", word: "Implement", phonetic: "/ˈɪmplɪment/", form: "Verb", forms: "N: Implementation", def: "Put (a decision, plan, agreement, etc.) into effect.", translation: "Thi hành, áp dụng", example: "...this idea of taking full advantage of the interior spaces wasn't implemented until the 1920s...", extraExample: "The new strict attendance policy will be implemented next month." },
        { topic: "Crises & Solutions", word: "Thoroughly", phonetic: "/ˈθʌrəli/", form: "Adverb", forms: "Adj: Thorough", def: "In a careful and complete way.", translation: "Một cách cẩn thận, hoàn toàn", example: "...compact modem city which was thoroughly technically conceived.", extraExample: "I thoroughly enjoyed the beautiful performance." },

        // --- CATEGORY 3: Ideas & Development ---
        { topic: "Ideas & Development", word: "Embody", phonetic: "/ɪmˈbɒdi/", form: "Verb", forms: "N: Embodiment", def: "To be an expression of or give a tangible or visible form to an idea or quality.", translation: "Hiện thân của", example: "A true Renaissance man, he embodied scientific spirit, artistic talent and humanist sensibilities.", extraExample: "The national flag embodies the spirit and history of the country." },
        { topic: "Ideas & Development", word: "Sensibility", phonetic: "/ˌsensəˈbɪləti/", form: "Noun", forms: "Adj: Sensible", def: "The ability to appreciate and respond to complex emotional or aesthetic influences.", translation: "Cảm quan, sự nhạy cảm", example: "...he embodied scientific spirit, artistic talent and humanist sensibilities.", extraExample: "The poet's deep sensibility to nature is clearly reflected in his work." },
        { topic: "Ideas & Development", word: "Insignificance", phonetic: "/ˌɪnsɪɡˈnɪfɪkəns/", form: "Noun", forms: "Adj: Insignificant", def: "The quality of being too small or unimportant to be worth consideration.", translation: "Sự vô nghĩa, tầm thường", example: "Yet far from fading into insignificance, his thinking has carried down the centuries...", extraExample: "The cost of the repair fades into insignificance when compared to the value of the house." },
        { topic: "Ideas & Development", word: "Unfulfilled", phonetic: "/ˌʌnfʊlˈfɪld/", form: "Adjective", forms: "V: Fulfill | N: Fulfillment", def: "Not carried out or brought to completion.", translation: "Không được thực hiện, dang dở", example: "...which - due to its excessive costs - would remain unfulfilled.", extraExample: "He felt bitter about his many unfulfilled ambitions." },
        { topic: "Ideas & Development", word: "Renowned", phonetic: "/rɪˈnaʊnd/", form: "Adjective", forms: "N: Renown", def: "Known or talked about by many people; famous.", translation: "Nổi tiếng, lừng danh", example: "Although the Renaissance is renowned as an era of incredible progress in art...", extraExample: "The region is renowned for its outstanding natural beauty." },
        { topic: "Ideas & Development", word: "Reconstruct", phonetic: "/ˌriːkənˈstrʌkt/", form: "Verb", forms: "N: Reconstruction", def: "Build or form (something) again after it has been damaged or destroyed.", translation: "Tái tạo, dựng lại", example: "...a series of innovative thoughts can be reconstructed regarding the foundation of a new city...", extraExample: "The police are trying to reconstruct the exact sequence of events." },
        { topic: "Ideas & Development", word: "Rational", phonetic: "/ˈræʃnəl/", form: "Adjective", forms: "N: Rationality | Adv: Rationally", def: "Based on or in accordance with reason or logic.", translation: "Hợp lý, có lý trí", example: "His plans for a modem and ‘rational' city were consistent with Renaissance ideals.", extraExample: "We need to make a rational decision based purely on the facts." },
        { topic: "Ideas & Development", word: "Consistent with", phonetic: "/kənˈsɪstənt wɪð/", form: "Phrase", forms: "N: Consistency", def: "In agreement with.", translation: "Phù hợp với, nhất quán với", example: "His plans for a modem and ‘rational' city were consistent with Renaissance ideals.", extraExample: "His current statements are not consistent with the evidence we found." },
        { topic: "Ideas & Development", word: "Unconventional", phonetic: "/ˌʌnkənˈvenʃənl/", form: "Adjective", forms: "N: Convention", def: "Not based on or conforming to what is generally done or believed.", translation: "Khác thường, độc đáo", example: "This design can be seen in some of today's high-rise buildings but was unconventional at the time.", extraExample: "She has a highly unconventional approach to teaching mathematics." },
        { topic: "Ideas & Development", word: "Undisturbed", phonetic: "/ˌʌndɪˈstɜːbd/", form: "Adjective", forms: "V: Disturb | N: Disturbance", def: "Not interfered with or interrupted.", translation: "Không bị quấy rầy", example: "...people could walk undisturbed between elegant palaces and streets...", extraExample: "The animals in the nature reserve can live completely undisturbed." },
        { topic: "Ideas & Development", word: "Integrate", phonetic: "/ˈɪntɪɡreɪt/", form: "Verb", forms: "N: Integration", def: "Combine (one thing) with another so that they become a whole.", translation: "Tích hợp, hòa nhập", example: "...integrated with nature (especially water systems), with efficient transport infrastructure...", extraExample: "We aim to integrate modern technology smoothly into the classroom." },
        { topic: "Ideas & Development", word: "Align", phonetic: "/əˈlaɪn/", form: "Verb", forms: "N: Alignment", def: "Place or arrange in a straight line, or put in agreement.", translation: "Căn chỉnh, đồng điệu", example: "...why Leonardo was aligned so closely with modem urban planning...", extraExample: "We must align our business goals with our marketing strategy." },
        { topic: "Ideas & Development", word: "Ahead of its time", phonetic: "/əˈhed əv ɪts taɪm/", form: "Phrase", forms: "N/A", def: "Having ideas or creating things that are too advanced to be accepted or understood in the current era.", translation: "Đi trước thời đại", example: "Leonardo da Vinci's ideal city was centuries ahead of its time.", extraExample: "The scientist's theories were brilliant but decades ahead of their time." }
    ];

    // --- DOM Injection ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Word Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Definition:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Reading Context</span>"${item.example}"
                </div>
                <div class="example-box extra-example">
                    <span>General Example</span>"${item.extraExample}"
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    // --- Audio Synthesis ---
    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    // --- Topic Filtering ---
    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    // --- View Toggling ---
    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Urban')) topicName = 'Urban Planning & Architecture';
            if (activeFilter.includes('Crises')) topicName = 'Crises & Solutions';
            if (activeFilter.includes('Ideas')) topicName = 'Ideas & Development';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    // --- Flashcard Logic ---
    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="word-families" style="margin-bottom: 1rem; width: 100%; text-align: center; border: 1px dashed #e9d5ff; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #9d174d;">
                    <strong style="color: #be185d;">Word Forms:</strong> ${data.forms}
                </div>
                <div class="example-box" style="margin-bottom: 0.5rem; background-color: #f3e8ff; padding: 1rem; border-left: 4px solid #c084fc; border-radius: 8px; font-size: 0.95rem; color: #334155;">
                    <span style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #a855f7; margin-bottom: 0.35rem; font-weight: 800;">Reading Context</span>"${data.example}"
                </div>
                <div class="example-box extra-example" style="background-color: #f8fafc; padding: 1rem; border-left: 4px solid #94a3b8; border-radius: 8px; font-size: 0.95rem; color: #334155;">
                    <span style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.35rem; font-weight: 800;">General Example</span>"${data.extraExample}"
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
</html>
