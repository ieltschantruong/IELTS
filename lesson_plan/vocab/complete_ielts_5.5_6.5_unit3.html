<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 3 - Vocabulary</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Soft Lilac & Mint Green */
            --primary: #9333ea; /* Purple 600 */
            --primary-light: #f3e8ff; /* Purple 100 */
            --primary-hover: #7e22ce; /* Purple 700 */
            --text-main: #334155; /* Slate 700 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-body: #faf5ff; /* Purple 50 - Very light pastel background */
            --card-bg: #ffffff;
            --accent: #10b981; /* Emerald 500 (Mint) */
            --accent-light: #d1fae5; /* Emerald 100 */
            --border: #e9d5ff; /* Purple 200 */
            --badge-bg: #ffe4e6; /* Rose 100 */
            --badge-text: #e11d48; /* Rose 600 */
            --success: #059669; /* Emerald 600 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2rem; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800; font-family: var(--font-headings); }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.95rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary-light); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: var(--font-body); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(147, 51, 234, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.8rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.8rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(147, 51, 234, 0.15); border-color: var(--primary-light); }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.8rem; }
        .word-main { display: flex; align-items: center; gap: 0.8rem; }
        .word { font-size: 1.6rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { background: var(--primary-light); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; transition: all 0.2s ease; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(147, 51, 234, 0.4); }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { background-color: #f8fafc; border: 1px dashed #cbd5e1; padding: 0.6rem; border-radius: 8px; font-size: 0.9rem; color: #475569; margin-bottom: 1rem; line-height: 1.4; }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { font-size: 0.75rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 700; margin-bottom: 1rem; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em;}
        
        .definition { font-size: 1.05rem; margin-bottom: 0.4rem; color: var(--text-main); font-weight: 500; }
        .definition strong { color: var(--primary); }
        .translation { font-size: 1rem; color: var(--success); margin-bottom: 1rem; font-weight: 600; }

        .example-box { background-color: var(--accent-light); padding: 1.2rem; border-left: 4px solid var(--accent); border-radius: 8px; margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--success); margin-bottom: 0.35rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.35rem; color: #047857; line-height: 1.4; }

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 700px; height: 580px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 15px 35px rgba(147, 51, 234, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.2rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings);}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; }
        .flashcard-front .audio-btn { width: 50px; height: 50px; }
        .flashcard-front .audio-btn svg { width: 24px; height: 24px; }
        .flashcard-front .phonetic { font-size: 1.4rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.15rem; margin-bottom: 1.5rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.2rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2.5rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 0.6rem 1.5rem; border-radius: 25px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.2rem; color: var(--accent); min-width: 80px; text-align: center; font-family: var(--font-headings); }

        @media (max-width: 768px) { 
            h1 { font-size: 2rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.5rem; } 
            .flashcard-back .definition { font-size: 1.05rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 3</h1>
        <p class="subtitle">Getting the Message Across</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Language & Learning')">Language & Learning</button>
        <button class="filter-btn" onclick="filterTopic('Film & Media')">Film & Media</button>
        <button class="filter-btn" onclick="filterTopic('Art & Colors')">Art & Colors</button>
        <button class="filter-btn" onclick="filterTopic('Music & Memory')">Music & Memory</button>
        <button class="filter-btn" onclick="filterTopic('Feelings & Expressions')">Feelings & Expressions</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #a7f3d0; color: var(--success);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 3)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Language & Learning ---
        { topic: "Language & Learning", word: "Imitate", phonetic: "/ˈɪmɪteɪt/", form: "Verb", forms: "N: Imitation", def: "To copy someone's speech, behavior, or actions.", translation: "Bắt chước", example: "Children often learn to speak by trying to imitate their parents." },
        { topic: "Language & Learning", word: "Language acquisition", phonetic: "/ˈlæŋɡwɪdʒ ˌækwɪˈzɪʃn/", form: "Noun Phrase", forms: "V: Acquire", def: "The process by which humans acquire the capacity to perceive and comprehend language.", translation: "Sự thụ đắc ngôn ngữ", example: "Early childhood is the most critical period for natural language acquisition." },
        { topic: "Language & Learning", word: "Linguistic development", phonetic: "/lɪŋˈɡwɪstɪk dɪˈveləpmənt/", form: "Noun Phrase", forms: "N/A", def: "The process and stages in which a child learns to use language.", translation: "Sự phát triển ngôn ngữ", example: "Reading books to toddlers greatly accelerates their linguistic development." },
        { topic: "Language & Learning", word: "Master", phonetic: "/ˈmɑːstə(r)/", form: "Verb", forms: "N: Mastery", def: "To acquire complete knowledge or skill in an area or subject.", translation: "Làm chủ, nắm vững", example: "It takes years of dedicated practice to fully master a foreign language." },
        { topic: "Language & Learning", word: "Trial and error", phonetic: "/ˈtraɪəl ænd ˈerə(r)/", form: "Noun Phrase", forms: "N/A", def: "The process of experimenting with various methods of doing something until one finds the most successful.", translation: "Thử nghiệm và mắc lỗi (thử và sai)", example: "Much of scientific discovery is achieved through a slow process of trial and error." },
        { topic: "Language & Learning", word: "Literate", phonetic: "/ˈlɪtərət/", form: "Adjective", forms: "N: Literacy | Opp: Illiterate", def: "Able to read and write; having knowledge of a particular subject.", translation: "Biết đọc biết viết, có kiến thức", example: "In today's digital age, it is crucial to be computer literate." },
        { topic: "Language & Learning", word: "Hypothesis", phonetic: "/haɪˈpɒθəsɪs/", form: "Noun", forms: "Plural: Hypotheses", def: "A proposed explanation made on the basis of limited evidence as a starting point for further investigation.", translation: "Giả thuyết", example: "The scientists conducted several experiments to test their initial hypothesis." },

        // --- Film & Media ---
        { topic: "Film & Media", word: "Blockbuster", phonetic: "/ˈblɒkbʌstə(r)/", form: "Noun", forms: "N/A", def: "A thing of great power or size, in particular a movie, book, or other product that is a great commercial success.", translation: "Phim/sách bom tấn", example: "The latest Marvel movie was a massive summer blockbuster at the box office." },
        { topic: "Film & Media", word: "Gripping", phonetic: "/ˈɡrɪpɪŋ/", form: "Adjective", forms: "V: Grip", def: "Firmly holding the attention or interest; exciting.", translation: "Cuốn hút, hấp dẫn", example: "The detective novel had such a gripping storyline that I couldn't put it down." },
        { topic: "Film & Media", word: "Cinema buff", phonetic: "/ˈsɪnəmə bʌf/", form: "Noun Phrase", forms: "N/A", def: "A person who is very interested in films and knows a lot about them.", translation: "Người đam mê điện ảnh", example: "As a cinema buff, he owns hundreds of classic movies on DVD." },
        { topic: "Film & Media", word: "Evocative", phonetic: "/ɪˈvɒkətɪv/", form: "Adjective", forms: "V: Evoke", def: "Bringing strong images, memories, or feelings to mind.", translation: "Gợi lên (cảm xúc, ký ức)", example: "The soundtrack featured evocative music that perfectly matched the tragic scene." },
        { topic: "Film & Media", word: "Portrayal", phonetic: "/pɔːˈtreɪəl/", form: "Noun", forms: "V: Portray", def: "A depiction of someone or something in a work of art or literature.", translation: "Sự khắc họa, miêu tả", example: "The actor won an award for his brilliant portrayal of the former president." },
        { topic: "Film & Media", word: "Convey", phonetic: "/kənˈveɪ/", form: "Verb", forms: "N: Conveyance", def: "To make an idea, impression, or feeling known or understandable to someone.", translation: "Truyền tải", example: "It is often difficult to properly convey the tone of your voice in a text message." },
        { topic: "Film & Media", word: "Transport someone to another world", phonetic: "/trænˈspɔːt.../", form: "Phrase", forms: "N/A", def: "To make someone feel as though they are in a different place or time, usually through imagination.", translation: "Đưa ai đó đến một thế giới khác (cảm giác)", example: "A truly great fantasy novel has the power to transport the reader to another world." },

        // --- Art & Colors ---
        { topic: "Art & Colors", word: "Depict", phonetic: "/dɪˈpɪkt/", form: "Verb", forms: "N: Depiction", def: "To show or represent by a drawing, painting, or other art form.", translation: "Miêu tả, vẽ lại", example: "The ancient cave paintings depict scenes of hunting and daily life." },
        { topic: "Art & Colors", word: "Dazzling", phonetic: "/ˈdæzlɪŋ/", form: "Adjective", forms: "V: Dazzle", def: "Extremely bright, especially so as to blind the eyes temporarily; extremely impressive.", translation: "Chói lọi, rực rỡ", example: "She wore a dazzling diamond necklace to the awards ceremony." },
        { topic: "Art & Colors", word: "Composition", phonetic: "/ˌkɒmpəˈzɪʃn/", form: "Noun", forms: "V: Compose", def: "The nature of something's ingredients or constituents; the way in which a whole or mixture is made up.", translation: "Bố cục (nghệ thuật), sự cấu thành", example: "The photographer spent a long time arranging the perfect composition before taking the shot." },
        { topic: "Art & Colors", word: "Vivid", phonetic: "/ˈvɪvɪd/", form: "Adjective", forms: "Adv: Vividly", def: "Producing powerful feelings or strong, clear images in the mind.", translation: "Sống động, chói lọi", example: "The author's vivid descriptions made it easy to visualize the fantasy landscape." },
        { topic: "Art & Colors", word: "Somber", phonetic: "/ˈsɒmbə(r)/", form: "Adjective", forms: "N/A", def: "Dark or dull in color or tone; gloomy.", translation: "U ám, ảm đạm", example: "He wore a somber black suit to the funeral." },
        { topic: "Art & Colors", word: "Fluorescent", phonetic: "/flʊəˈresnt/", form: "Adjective", forms: "N: Fluorescence", def: "Strikingly bright, glowing, or vivid (of a color or light).", translation: "Huỳnh quang, chói lọi", example: "The safety workers wear fluorescent yellow vests so they can be easily seen." },
        { topic: "Art & Colors", word: "Arts literate", phonetic: "/ɑːts ˈlɪtərət/", form: "Adjective", forms: "N/A", def: "Having knowledge and understanding of the arts.", translation: "Có hiểu biết về nghệ thuật", example: "The new school curriculum aims to make students more arts literate." },

        // --- Music & Memory ---
        { topic: "Music & Memory", word: "Tone-deaf", phonetic: "/təʊn-def/", form: "Adjective", forms: "N/A", def: "Unable to perceive differences of musical pitch accurately.", translation: "Mù âm nhạc, hát phô", example: "I love singing in the shower, even though I am completely tone-deaf." },
        { topic: "Music & Memory", word: "Catchy tune", phonetic: "/ˈkætʃi tjuːn/", form: "Noun Phrase", forms: "N/A", def: "A musical melody that is appealing and easy to remember.", translation: "Giai điệu bắt tai", example: "That pop song has such a catchy tune that it has been stuck in my head all day." },
        { topic: "Music & Memory", word: "Soothing ambience", phonetic: "/ˈsuːðɪŋ ˈæmbiəns/", form: "Noun Phrase", forms: "N/A", def: "A relaxing and calm atmosphere or environment.", translation: "Không gian êm dịu, thư giãn", example: "The spa features soft music and dim lighting to create a soothing ambience." },
        { topic: "Music & Memory", word: "Rendition", phonetic: "/renˈdɪʃn/", form: "Noun", forms: "V: Render", def: "A performance or interpretation, especially of a dramatic role or piece of music.", translation: "Màn trình diễn, cách thể hiện", example: "The singer gave a beautiful, acoustic rendition of the classic rock song." },
        { topic: "Music & Memory", word: "Recollection", phonetic: "/ˌrekəˈlekʃn/", form: "Noun", forms: "V: Recollect", def: "The action or faculty of remembering something.", translation: "Hồi ức, sự nhớ lại", example: "To the best of my recollection, we have never actually met before." },
        { topic: "Music & Memory", word: "Massive hit", phonetic: "/ˈmæsɪv hɪt/", form: "Noun Phrase", forms: "N/A", def: "A very successful and popular song, movie, or product.", translation: "Bản hit lớn, thành công vang dội", example: "The band's debut single became a massive hit all over Europe." },
        { topic: "Music & Memory", word: "Engraved", phonetic: "/ɪnˈɡreɪvd/", form: "Adjective", forms: "V: Engrave", def: "Cut or carved into a surface; firmly established or fixed in one's mind.", translation: "Khắc họa, in sâu (vào tâm trí)", example: "The memory of my first day at university is engraved in my mind." },

        // --- Feelings & Expressions ---
        { topic: "Feelings & Expressions", word: "Bereft of hope", phonetic: "/bɪˈreft ɒv həʊp/", form: "Phrase", forms: "N/A", def: "Completely without hope; desperate.", translation: "Mất hết hy vọng", example: "After failing the exam for the third time, he felt completely bereft of hope." },
        { topic: "Feelings & Expressions", word: "Put someone at ease", phonetic: "/pʊt ... æt iːz/", form: "Phrase", forms: "N/A", def: "To make someone feel relaxed and comfortable.", translation: "Làm ai đó cảm thấy thoải mái", example: "The doctor's friendly smile immediately put the nervous patient at ease." },
        { topic: "Feelings & Expressions", word: "Have what it takes", phonetic: "/hæv wɒt ɪt teɪks/", form: "Idiom", forms: "N/A", def: "To have the necessary qualities, skills, or abilities to be successful.", translation: "Có đủ tố chất/khả năng", example: "She is smart, determined, and definitely has what it takes to be a great leader." },
        { topic: "Feelings & Expressions", word: "At a fast clip", phonetic: "/æt ə fɑːst klɪp/", form: "Phrase", forms: "N/A", def: "At a rapid pace or speed.", translation: "Với tốc độ nhanh", example: "Technology in the medical field is advancing at a fast clip." },
        { topic: "Feelings & Expressions", word: "Justify", phonetic: "/ˈdʒʌstɪfaɪ/", form: "Verb", forms: "N: Justification", def: "To show or prove to be right or reasonable.", translation: "Biện minh, bào chữa", example: "It is difficult to justify spending so much money on a single piece of clothing." },
        { topic: "Feelings & Expressions", word: "Amused", phonetic: "/əˈmjuːzd/", form: "Adjective", forms: "V: Amuse | N: Amusement", def: "Finding something funny or entertaining.", translation: "Thích thú, buồn cười", example: "I could tell from her smile that she was highly amused by the joke." },
        { topic: "Feelings & Expressions", word: "Take up", phonetic: "/teɪk ʌp/", form: "Phrasal Verb", forms: "N/A", def: "To begin a new hobby or activity.", translation: "Bắt đầu (một sở thích/thói quen)", example: "I decided to take up painting in my free time to help me relax." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fbcfe8; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            
            let femaleVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Zira') ||
                voice.name.includes('Karen') ||
                voice.name.includes('Tessa') ||
                voice.name.includes('Fiona') ||
                voice.name.includes('Moira') ||
                voice.name.includes('Veena')
            );
            
            if (!femaleVoice) {
                femaleVoice = voices.find(voice => voice.lang.includes('en-GB') && !voice.name.includes('Male'));
            }
            
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                utterance.pitch = 1.3; 
            }

            window.speechSynthesis.speak(utterance);
        } else {
            console.log("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilter.includes('Language')) topicName = 'Language & Learning';
            if (activeFilter.includes('Film')) topicName = 'Film & Media';
            if (activeFilter.includes('Art')) topicName = 'Art & Colors';
            if (activeFilter.includes('Music')) topicName = 'Music & Memory';
            if (activeFilter.includes('Feelings')) topicName = 'Feelings & Expressions';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem;">
                    <span style="color: var(--success);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
</html>
