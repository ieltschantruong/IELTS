<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 2 - Vocabulary</title>
    <style>
        :root {
            /* Theme: Emerald Green & Amber */
            --primary: #047857; /* Emerald 700 */
            --primary-light: #d1fae5; /* Emerald 100 */
            --primary-hover: #065f46; /* Emerald 800 */
            --text-main: #1e293b;
            --text-muted: #475569;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --accent: #d97706; /* Amber 600 */
            --accent-light: #fef3c7; /* Amber 100 */
            --border: #a7f3d0; /* Emerald 200 */
            --badge-bg: #fef3c7; /* Amber 100 */
            --badge-text: #b45309; /* Amber 700 */
            --success: #0284c7; /* Sky 600 for translation text */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-top: 2rem; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 6px rgba(4, 120, 87, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 6px rgba(217, 119, 6, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); border: 1px solid var(--primary-light); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(4, 120, 87, 0.15); border-color: var(--border); }
        .vocab-card.hidden { display: none; }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.75rem; }
        .word-main { display: flex; align-items: center; gap: 0.5rem; }
        .word { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.4rem; border-radius: 50%; transition: transform 0.2s, background-color 0.2s; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary-light); }
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        
        .word-families { background-color: #f1f5f9; border: 1px dashed #cbd5e1; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #475569; margin-bottom: 1rem; }
        .word-families strong { color: var(--primary); }

        .topic-tag { font-size: 0.8rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; margin-bottom: 1rem; display: inline-block;}
        
        .definition { font-size: 1rem; margin-bottom: 0.25rem; color: var(--text-main); }
        .definition strong { color: var(--primary); }
        
        /* Translation and Usage */
        .translation { font-size: 0.95rem; color: var(--success); margin-bottom: 0.5rem; font-weight: 600; }

        .example-box { background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary-hover); margin-bottom: 0.35rem; font-weight: 800; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 650px; height: 500px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(4, 120, 87, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 2.8rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .flashcard-front .audio-btn { font-size: 2rem; background: var(--primary-light); padding: 0.8rem; }
        .flashcard-front .phonetic { font-size: 1.3rem; color: var(--text-muted); font-style: italic; }
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        
        .flashcard-back .definition { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.1rem; margin-bottom: 1rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; font-size: 1rem; padding: 1rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1rem; font-weight: 700; cursor: pointer; padding: 0.5rem 1.2rem; border-radius: 20px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.1rem; color: var(--accent); min-width: 70px; text-align: center; }

        @media (max-width: 768px) { 
            h1 { font-size: 1.8rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.2rem; } 
            .flashcard-back .definition { font-size: 1rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 2</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; font-weight: 500;">Reading & Speaking Vocabulary with Word Formation</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Vocabulary</button>
        <button class="filter-btn" onclick="filterTopic('Reading')">Reading Section</button>
        <button class="filter-btn" onclick="filterTopic('Speaking')">Speaking Section</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 80%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 80%; background-color: var(--accent-light); border-color: #fde68a; color: var(--badge-text);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Skill</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 100</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 6.5-7.5 Unit 2)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- READING ---
        { topic: "Reading", word: "Tray", phonetic: "/treɪ/", form: "Noun", forms: "N/A", def: "A flat, shallow container with a raised rim, typically used for carrying food and drink.", translation: "Cái khay", example: "The waiter carried the drinks on a silver tray." },
        { topic: "Reading", word: "Camouflage", phonetic: "/ˈkæməflɑːʒ/", form: "Noun / Verb", forms: "Adj: Camouflaged", def: "The disguising of military personnel, equipment, or animals by painting or covering them to make them blend in with their surroundings.", translation: "Sự ngụy trang, ngụy trang", example: "The soldier's uniform provided excellent camouflage in the dense jungle." },
        { topic: "Reading", word: "Striking colors", phonetic: "/ˈstraɪkɪŋ ˈkʌləz/", form: "Noun Phrase", forms: "Adj: Striking | N: Color", def: "Colors that attract attention by reason of being unusual, extreme, or prominent.", translation: "Màu sắc nổi bật/sặc sỡ", example: "The tropical bird is easily identifiable by its striking colors." },
        { topic: "Reading", word: "Eyeball", phonetic: "/ˈaɪbɔːl/", form: "Noun / Verb", forms: "N/A", def: "The round part of the eye of a vertebrate, within the eyelids and socket.", translation: "Nhãn cầu / Nhìn chằm chằm", example: "The optician carefully examined the patient's right eyeball." },
        { topic: "Reading", word: "Be packed with", phonetic: "/bi pækt wɪð/", form: "Phrase", forms: "V: Pack | Adj: Packed", def: "To be completely full of something.", translation: "Chứa đầy, chật ních", example: "The presentation was packed with useful information for the students." },
        { topic: "Reading", word: "Haphazard", phonetic: "/hæpˈhæzəd/", form: "Adjective", forms: "Adv: Haphazardly", def: "Lacking any obvious principle of organization, order, or plan.", translation: "Bừa bãi, lung tung", example: "The files were placed on the shelves in a completely haphazard manner." },
        { topic: "Reading", word: "Accurate", phonetic: "/ˈækjərət/", form: "Adjective", forms: "N: Accuracy | Adv: Accurately", def: "Correct in all details; exact or precise.", translation: "Chính xác", example: "We need to ensure that the scientific measurements are highly accurate." },
        { topic: "Reading", word: "Consistent", phonetic: "/kənˈsɪstənt/", form: "Adjective", forms: "N: Consistency | Adv: Consistently", def: "Acting or done in the same way over time, especially so as to be fair or accurate.", translation: "Nhất quán, kiên định", example: "He has been a very consistent player throughout the entire football season." },
        { topic: "Reading", word: "Competent", phonetic: "/ˈkɒmpɪtənt/", form: "Adjective", forms: "N: Competence | Adv: Competently", def: "Having the necessary ability, knowledge, or skill to do something successfully.", translation: "Có năng lực, thạo việc", example: "She is a highly competent manager who handles crises efficiently." },
        { topic: "Reading", word: "Familiar", phonetic: "/fəˈmɪliə(r)/", form: "Adjective", forms: "N: Familiarity | V: Familiarize", def: "Well known from long or close association.", translation: "Quen thuộc", example: "The handwriting on the envelope looked surprisingly familiar to me." },
        { topic: "Reading", word: "Identical", phonetic: "/aɪˈdentɪkl/", form: "Adjective", forms: "Adv: Identically | N: Identity", def: "Similar in every detail; exactly alike.", translation: "Giống hệt nhau", example: "The two experimental compounds showed identical chemical properties." },
        { topic: "Reading", word: "Overwhelming", phonetic: "/ˌəʊvəˈwelmɪŋ/", form: "Adjective", forms: "V: Overwhelm | Adv: Overwhelmingly", def: "Very great in amount; very strong.", translation: "Tràn ngập, áp đảo", example: "The evidence against the suspect in the court case was overwhelming." },
        { topic: "Reading", word: "Repertoire", phonetic: "/ˈrepətwɑː(r)/", form: "Noun", forms: "N/A", def: "A stock of skills or types of behavior that a person habitually uses (all the things a person knows).", translation: "Vốn kỹ năng, vốn tiết mục", example: "The chef has a vast repertoire of traditional French recipes." },
        { topic: "Reading", word: "Property", phonetic: "/ˈprɒpəti/", form: "Noun", forms: "N/A", def: "An attribute, quality, or characteristic of something.", translation: "Đặc tính, đặc điểm", example: "Aloe vera is famous for its soothing and healing properties." },
        { topic: "Reading", word: "Entity", phonetic: "/ˈentəti/", form: "Noun", forms: "N/A", def: "A thing with distinct and independent existence.", translation: "Thực thể", example: "The two departments will now operate as completely separate entities." },
        { topic: "Reading", word: "Cue", phonetic: "/kjuː/", form: "Noun / Verb", forms: "N/A", def: "A thing said or done that serves as a signal to an actor or other person to enter or to begin their speech or performance.", translation: "Tín hiệu, gợi ý", example: "The dog was trained to sit patiently until given the cue." },
        { topic: "Reading", word: "Phase", phonetic: "/feɪz/", form: "Noun / Verb", forms: "N/A", def: "A distinct period or stage in a series of events or a change of development.", translation: "Giai đoạn", example: "The construction project is currently entering its final and most difficult phase." },
        { topic: "Reading", word: "In the course of", phonetic: "/ɪn ðə kɔːs əv/", form: "Phrase", forms: "N/A", def: "During the specified period or process.", translation: "Trong suốt quá trình", example: "In the course of the research, several unexpected anomalies were discovered." },
        { topic: "Reading", word: "Affair", phonetic: "/əˈfeə(r)/", form: "Noun", forms: "N/A", def: "An event or sequence of events of a specified kind or that has previously been referred to.", translation: "Sự kiện, vấn đề, vụ việc", example: "The government's handling of the financial affair was heavily criticized by the press." },
        { topic: "Reading", word: "Co-author", phonetic: "/kəʊ ˈɔːθə(r)/", form: "Noun / Verb", forms: "N/A", def: "A joint author of a book, paper, or report.", translation: "Đồng tác giả", example: "He is the co-author of the ground-breaking study on climate change." },
        { topic: "Reading", word: "Pre-condition", phonetic: "/ˌpriːkənˈdɪʃn/", form: "Noun", forms: "N/A", def: "A condition that must be fulfilled before other things can happen or be done.", translation: "Điều kiện tiên quyết", example: "A stable economy is a pre-condition for significant foreign investment." },
        { topic: "Reading", word: "Post-graduate", phonetic: "/ˌpəʊstˈɡrædʒuət/", form: "Noun / Adjective", forms: "N: Graduation | V: Graduate", def: "Relating to a course of study undertaken after completing a first degree.", translation: "Nghiên cứu sinh, sau đại học", example: "She is applying for a post-graduate program in environmental science." },
        { topic: "Reading", word: "Come up with", phonetic: "/kʌm ʌp wɪð/", form: "Phrasal Verb", forms: "N/A", def: "To suggest or think of an idea or plan.", translation: "Nghĩ ra, nảy ra", example: "The marketing team needs to come up with a better strategy for the new product." },
        { topic: "Reading", word: "Come to", phonetic: "/kʌm tu/", form: "Phrasal Verb", forms: "N/A", def: "To add up to a particular amount.", translation: "Lên tới, đạt tới", example: "With tax and tip, the dinner bill came to exactly $150." },
        { topic: "Reading", word: "Turn out", phonetic: "/tɜːn aʊt/", form: "Phrasal Verb", forms: "N: Turnout", def: "To happen in a particular way or to have a particular result, especially an unexpected one.", translation: "Hóa ra, thành ra", example: "The weather was terrible in the morning, but it turned out to be a beautiful afternoon." },
        { topic: "Reading", word: "Turn up", phonetic: "/tɜːn ʌp/", form: "Phrasal Verb", forms: "N/A", def: "To arrive or appear, especially unexpectedly.", translation: "Xuất hiện, đến nơi", example: "We waited for him for an hour, but he never turned up." },
        { topic: "Reading", word: "Work out", phonetic: "/wɜːk aʊt/", form: "Phrasal Verb", forms: "N: Workout", def: "To solve a problem by calculation or study; to exercise.", translation: "Tìm ra giải pháp, tập thể dục", example: "I am trying to work out the total cost of the renovation." },
        { topic: "Reading", word: "Point out", phonetic: "/pɔɪnt aʊt/", form: "Phrasal Verb", forms: "N/A", def: "To direct someone's attention to something.", translation: "Chỉ ra", example: "The professor pointed out several grammatical errors in my essay." },
        { topic: "Reading", word: "Narrow down", phonetic: "/ˈnærəʊ daʊn/", form: "Phrasal Verb", forms: "N/A", def: "To reduce the number of possibilities or choices.", translation: "Thu hẹp (sự lựa chọn)", example: "We managed to narrow down the list of job applicants from fifty to just three." },
        { topic: "Reading", word: "Carry out", phonetic: "/ˈkæri aʊt/", form: "Phrasal Verb", forms: "N/A", def: "To perform or complete a job or activity.", translation: "Tiến hành, thực hiện", example: "The hospital will carry out further tests to determine the cause of the illness." },
        { topic: "Reading", word: "Compromise", phonetic: "/ˈkɒmprəmaɪz/", form: "Noun / Verb", forms: "Adj: Uncompromising", def: "An agreement reached by each side making concessions.", translation: "Sự thỏa hiệp", example: "In any successful business partnership, both parties must be willing to compromise." },
        { topic: "Reading", word: "Privilege", phonetic: "/ˈprɪvəlɪdʒ/", form: "Noun", forms: "Adj: Privileged", def: "A special right, advantage, or immunity granted or available only to a particular person or group.", translation: "Đặc quyền", example: "Access to clean water should be a basic human right, not a privilege." },
        { topic: "Reading", word: "Prospect", phonetic: "/ˈprɒspekt/", form: "Noun", forms: "Adj: Prospective", def: "The possibility or likelihood of some future event occurring.", translation: "Triển vọng, viễn cảnh", example: "The prospect of finding a cure for the disease is looking very promising." },
        { topic: "Reading", word: "Therapy", phonetic: "/ˈθerəpi/", form: "Noun", forms: "N: Therapist | Adj: Therapeutic", def: "Treatment intended to relieve or heal a disorder.", translation: "Liệu pháp, phương pháp điều trị", example: "He attends physical therapy twice a week to heal his shoulder injury." },
        { topic: "Reading", word: "Ailment", phonetic: "/ˈeɪlmənt/", form: "Noun", forms: "N/A", def: "An illness, typically a minor one.", translation: "Bệnh tật (thường là bệnh nhẹ)", example: "The herb is traditionally used to treat minor stomach ailments." },
        { topic: "Reading", word: "Insanity", phonetic: "/ɪnˈsænəti/", form: "Noun", forms: "Adj: Insane", def: "The state of being seriously mentally ill; madness or extreme foolishness.", translation: "Sự điên rồ, bệnh tâm thần", example: "It would be absolute insanity to invest all your money in that risky venture." },
        { topic: "Reading", word: "Conceal", phonetic: "/kənˈsiːl/", form: "Verb", forms: "N: Concealment", def: "Keep from sight; hide.", translation: "Che giấu", example: "She tried to conceal her disappointment when she didn't get the promotion." },
        { topic: "Reading", word: "Harness", phonetic: "/ˈhɑːnɪs/", form: "Verb", forms: "N: Harness", def: "Control and make use of (natural resources), especially to produce energy.", translation: "Khai thác, sử dụng", example: "Engineers are looking for new ways to harness the power of ocean waves." },
        { topic: "Reading", word: "Seize", phonetic: "/siːz/", form: "Verb", forms: "N: Seizure", def: "Take hold of suddenly and forcibly.", translation: "Nắm lấy, tóm lấy", example: "You must seize every opportunity that comes your way to succeed in life." },
        { topic: "Reading", word: "Synthesize", phonetic: "/ˈsɪnθəsaɪz/", form: "Verb", forms: "N: Synthesis | Adj: Synthetic", def: "Make (something) by synthesis, especially chemically; combine into a coherent whole.", translation: "Tổng hợp", example: "The researchers managed to synthesize the chemical compound in the laboratory." },

    // --- DOM Injection ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Word Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Definition:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span>"${item.example}"
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    // --- Audio Synthesis ---
    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    // --- Topic Filtering ---
    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    // --- View Toggling ---
    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Reading')) topicName = 'Reading';
            if (activeFilter.includes('Speaking')) topicName = 'Speaking';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    // --- Flashcard Logic ---
    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main);">
                    <span style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-hover); margin-bottom: 0.25rem; font-weight: bold;">Usage Example</span>"${data.example}"
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
