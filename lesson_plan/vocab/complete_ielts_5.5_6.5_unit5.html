<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 5 - The World In Our Hands</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Earthy Sage Green & Sunrise Peach (Nature/Environment theme) */
            --primary: #4a7c59; /* Sage Green 700 */
            --primary-light: #e8f0eb; /* Sage Green 50 */
            --primary-hover: #3b6347; /* Sage Green 800 */
            --text-main: #2c3e35; /* Dark Forest Green for text */
            --text-muted: #687d71; /* Muted Green-Grey */
            --bg-body: #f4f7f5; /* Very light earthy grey/green background */
            --card-bg: #ffffff;
            --accent: #e27d60; /* Soft Terracotta/Peach */
            --accent-light: #fbeae5; /* Very light peach */
            --border: #c4d6cb; /* Light sage border */
            --badge-bg: #fceebb; /* Soft Yellow */
            --badge-text: #8a6d1c; /* Dark Gold/Brown */
            --success: #0284c7; /* Sky 600 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2.5rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.02em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            letter-spacing: 0.1em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.5rem 1.2rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(226, 125, 96, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 30px -10px rgba(74, 124, 89, 0.15); 
            border-color: var(--primary); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.8rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1) rotate(5deg); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(74, 124, 89, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { 
            background-color: #f4f7f5; 
            border: 1px dashed #c4d6cb; 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: #4a5c53; 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box::before {
            content: '"';
            position: absolute;
            top: 0;
            right: 15px;
            font-family: var(--font-headings);
            font-size: 4rem;
            color: var(--accent);
            opacity: 0.2;
            line-height: 1;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #b84f30; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(74, 124, 89, 0.15); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 4rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.6rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #fdfefd; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.3rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: #8ba194; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-hover);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 1rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 550px; } 
            .flashcard-front .word { font-size: 3rem; } 
            .flashcard-back .definition { font-size: 1.2rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 5</h1>
        <p class="subtitle">The World In Our Hands</p>
    </header>

    <!-- Topic Filters -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Nature & Environment')">Nature & Env.</button>
        <button class="filter-btn" onclick="filterTopic('Climate & Weather')">Climate & Weather</button>
        <button class="filter-btn" onclick="filterTopic('Animals & Wildlife')">Animals & Wildlife</button>
        <button class="filter-btn" onclick="filterTopic('Environmental Action')">Env. Action</button>
        <button class="filter-btn" onclick="filterTopic('Science & Implementation')">Science & Implementation</button>
    </div>

    <!-- View Toggles -->
    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fbcfe8; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: #cbd5e1; margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 5)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Nature & Environment ---
        { topic: "Nature & Environment", word: "Lush", phonetic: "/lʌʃ/", form: "Adjective", forms: "N/A", def: "(Of an area) having a lot of green, healthy plants, grass, and trees.", translation: "Xanh tươi, sum sê", example: "The hikers were amazed by the lush vegetation in the tropical rainforest." },
        { topic: "Nature & Environment", word: "Gigantic", phonetic: "/dʒaɪˈɡæntɪk/", form: "Adjective", forms: "Adv: Gigantically", def: "Extremely large; enormous.", translation: "Khổng lồ, to lớn", example: "We stood in awe at the base of the gigantic redwood tree." },
        { topic: "Nature & Environment", word: "Arable", phonetic: "/ˈærəbl/", form: "Adjective", forms: "N/A", def: "Used or suitable for growing crops.", translation: "Có thể trồng trọt được", example: "The country's economy relies heavily on its vast areas of arable land." },
        { topic: "Nature & Environment", word: "Vegetation", phonetic: "/ˌvedʒəˈteɪʃn/", form: "Noun", forms: "N: Vegetal (rare)", def: "Plants in general, or plants that are found in a particular area.", translation: "Thảm thực vật, cây cối", example: "The desert has very little vegetation due to the extreme lack of water." },
        { topic: "Nature & Environment", word: "Flora and fauna", phonetic: "/ˈflɔːrə ənd ˈfɔːnə/", form: "Phrase", forms: "N/A", def: "The plants and animals of a particular region, habitat, or geological period.", translation: "Hệ động thực vật", example: "The island is famous for its unique flora and fauna, not found anywhere else." },
        { topic: "Nature & Environment", word: "Oasis", phonetic: "/əʊˈeɪsɪs/", form: "Noun", forms: "Plural: Oases", def: "A place in a desert where there is water and therefore plants and trees.", translation: "Ốc đảo", example: "After days of traveling through the dry dunes, the village appeared like an oasis." },
        { topic: "Nature & Environment", word: "Orchard", phonetic: "/ˈɔːtʃəd/", form: "Noun", forms: "N/A", def: "A piece of land planted with fruit trees.", translation: "Vườn cây ăn quả", example: "We spent the afternoon picking apples in a local orchard." },

        // --- Climate & Weather ---
        { topic: "Climate & Weather", word: "Downpour", phonetic: "/ˈdaʊnpɔː(r)/", form: "Noun", forms: "N/A", def: "A heavy fall of rain.", translation: "Trận mưa rào, mưa lớn", example: "We got caught in a sudden downpour and were completely soaked." },
        { topic: "Climate & Weather", word: "Dismal", phonetic: "/ˈdɪzməl/", form: "Adjective", forms: "Adv: Dismally", def: "Depressing; dreary (especially used to describe bad weather).", translation: "Ảm đạm, u buồn, tồi tệ", example: "The weather was dismal, with grey skies and constant drizzle all week." },
        { topic: "Climate & Weather", word: "Heatwave", phonetic: "/ˈhiːtweɪv/", form: "Noun", forms: "N/A", def: "A period of time such as a few weeks when the weather is much hotter than usual.", translation: "Đợt nắng nóng", example: "The government issued health warnings during the extreme summer heatwave." },
        { topic: "Climate & Weather", word: "Monsoon", phonetic: "/mɒnˈsuːn/", form: "Noun", forms: "Adj: Monsoonal", def: "The season of heavy rain during the summer in hot Asian countries.", translation: "Gió mùa, mùa mưa", example: "The farmers eagerly awaited the monsoon to water their dry crops." },
        { topic: "Climate & Weather", word: "Drenched", phonetic: "/drentʃt/", form: "Adjective", forms: "V: Drench", def: "Wet thoroughly; soaked.", translation: "Ướt sũng", example: "Without an umbrella, he arrived at the office completely drenched." },
        { topic: "Climate & Weather", word: "Breezy", phonetic: "/ˈbriːzi/", form: "Adjective", forms: "N: Breeze", def: "Pleasantly windy.", translation: "Có gió hiu hiu, mát mẻ", example: "It was a bright, breezy day, perfect for flying a kite." },

        // --- Animals & Wildlife ---
        { topic: "Animals & Wildlife", word: "Omnivore", phonetic: "/ˈɒmnɪvɔː(r)/", form: "Noun", forms: "Adj: Omnivorous", def: "An animal that is naturally able to eat both plants and meat.", translation: "Động vật ăn tạp", example: "Bears and humans are both examples of omnivores." },
        { topic: "Animals & Wildlife", word: "Companion animal", phonetic: "/kəmˈpæniən ˈænɪml/", form: "Noun phrase", forms: "N/A", def: "An animal kept for company or pleasure rather than for utility; a pet.", translation: "Thú cưng, vật nuôi bầu bạn", example: "Dogs are often considered the ultimate companion animal due to their loyalty." },
        { topic: "Animals & Wildlife", word: "Affectionate", phonetic: "/əˈfekʃənət/", form: "Adjective", forms: "N: Affection | Adv: Affectionately", def: "Showing feelings of liking or love.", translation: "Trìu mến, đáng yêu", example: "Cats can be surprisingly affectionate when they want attention." },
        { topic: "Animals & Wildlife", word: "Arthropods", phonetic: "/ˈɑːθrəpɒdz/", form: "Noun", forms: "Adj: Arthropodal", def: "A type of animal with no spine, a hard outer skin, and jointed legs (e.g., insects, spiders).", translation: "Động vật chân khớp", example: "Arthropods form the largest phylum in the animal kingdom." },
        { topic: "Animals & Wildlife", word: "Amphibians", phonetic: "/æmˈfɪbiənz/", form: "Noun", forms: "Adj: Amphibious", def: "Animals, such as frogs, that live both on land and in water but must produce their eggs in water.", translation: "Động vật lưỡng cư", example: "Frogs and salamanders are well-known amphibians." },
        { topic: "Animals & Wildlife", word: "Claw", phonetic: "/klɔː/", form: "Noun", forms: "V: Claw", def: "One of the sharp curved nails at the end of each of the toes of some animals and birds.", translation: "Vuốt, móng vuốt", example: "The eagle used its sharp claws to catch the fish." },

        // --- Environmental Action ---
        { topic: "Environmental Action", word: "Combat", phonetic: "/ˈkɒmbæt/", form: "Verb", forms: "N: Combat", def: "To try to stop something unpleasant or harmful from happening or increasing.", translation: "Chống lại, ngăn chặn", example: "We must take immediate action to combat the effects of climate change." },
        { topic: "Environmental Action", word: "Purify", phonetic: "/ˈpjʊərɪfaɪ/", form: "Verb", forms: "N: Purification", def: "To remove bad substances from something to make it pure.", translation: "Làm sạch, lọc trong", type: "Reading", example: "Plants play a crucial role in purifying the air we breathe." },
        { topic: "Environmental Action", word: "Abandon", phonetic: "/əˈbændən/", form: "Verb", forms: "N: Abandonment", def: "To leave a place, thing, or person, usually forever.", translation: "Từ bỏ, bỏ rơi", example: "The villagers were forced to abandon their homes due to the rising floodwaters." },
        { topic: "Environmental Action", word: "Vulnerable", phonetic: "/ˈvʌlnərəbl/", form: "Adjective", forms: "N: Vulnerability", def: "Able to be easily physically or mentally hurt, influenced, or attacked.", translation: "Dễ bị tổn thương", example: "Polar bears are highly vulnerable to the melting of Arctic ice." },
        { topic: "Environmental Action", word: "Irreversible", phonetic: "/ˌɪrɪˈvɜːsəbl/", form: "Adjective", forms: "Adv: Irreversibly", def: "Not possible to change; impossible to return to a previous condition.", translation: "Không thể đảo ngược", example: "The oil spill caused irreversible damage to the local marine ecosystem." },
        { topic: "Environmental Action", word: "Accumulate", phonetic: "/əˈkjuːmjəleɪt/", form: "Verb", forms: "N: Accumulation", def: "To collect a large number of things over a long period of time.", translation: "Tích tụ, tích lũy", example: "Toxic chemicals can accumulate in the soil over many years of farming." },
        { topic: "Environmental Action", word: "Offset", phonetic: "/ˈɒfset/", form: "Verb", forms: "N/A", def: "To balance one influence against an opposing influence, so that there is no great difference as a result.", translation: "Bù đắp", example: "The company planted thousands of trees to offset its carbon emissions." },
        { topic: "Environmental Action", word: "Exhausted", phonetic: "/ɪɡˈzɔːstɪd/", form: "Adjective", forms: "V: Exhaust | N: Exhaustion", def: "Completely used up (in the context of resources).", translation: "Cạn kiệt", example: "If we are not careful, the earth's natural resources will soon be exhausted." },

        // --- Science & Implementation ---
        { topic: "Science & Implementation", word: "Generate", phonetic: "/ˈdʒenəreɪt/", form: "Verb", forms: "N: Generation", def: "To cause something to exist; to produce energy in a particular form.", translation: "Tạo ra, phát ra (năng lượng)", example: "Wind turbines are used to generate clean, renewable electricity." },
        { topic: "Science & Implementation", word: "Utilize", phonetic: "/ˈjuːtəlaɪz/", form: "Verb", forms: "N: Utilization", def: "To use something in an effective way.", translation: "Tận dụng, sử dụng", example: "We must utilize solar power more effectively to reduce our reliance on fossil fuels." },
        { topic: "Science & Implementation", word: "Infrastructure", phonetic: "/ˈɪnfrəstrʌktʃə(r)/", form: "Noun", forms: "Adj: Infrastructural", def: "The basic systems and services, such as transport and power supplies, that a country needs.", translation: "Cơ sở hạ tầng", example: "The government is investing heavily in green infrastructure." },
        { topic: "Science & Implementation", word: "Practicable", phonetic: "/ˈpræktɪkəbl/", form: "Adjective", forms: "N: Practicability", def: "Able to be done or put into practice successfully.", translation: "Khả thi, có thể thực hiện được", example: "Building a dam in that specific location is simply not practicable." },
        { topic: "Science & Implementation", word: "Proponent", phonetic: "/prəˈpəʊnənt/", form: "Noun", forms: "N/A", def: "A person who speaks publicly in support of a particular idea or plan of action.", translation: "Người ủng hộ, người đề xướng", example: "She is a strong proponent of using public transport to reduce pollution." },
        { topic: "Science & Implementation", word: "Subsidy", phonetic: "/ˈsʌbsədi/", form: "Noun", forms: "V: Subsidize", def: "Money given as part of the cost of something, to help or encourage it to happen.", translation: "Tiền trợ cấp", example: "The government offers a subsidy to homeowners who install solar panels." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #e5d082; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">${item.example}</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Custom Toast Notification function to replace alerts
    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        // Hide after 3.5 seconds
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; // Slightly slower for language learning
            
            // Try to find a good British or clear female voice
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Google UK English Female')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); // Prevent flipping the card
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        // Update active button styling
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Filter Grid View
        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        // Filter Flashcard View Data if active
        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            // Determine active filter to sync flashcards
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Nature')) topicName = 'Nature & Environment';
            else if (activeFilterText.includes('Climate')) topicName = 'Climate & Weather';
            else if (activeFilterText.includes('Animals')) topicName = 'Animals & Wildlife';
            else if (activeFilterText.includes('Env. Action')) topicName = 'Environmental Action';
            else if (activeFilterText.includes('Science')) topicName = 'Science & Implementation';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        // Remove flip class if present to reset face before injecting data
        flashcardScene.classList.remove('is-flipped');
        
        // Delay content injection slightly so it happens during/after the flip animation back
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">${data.example}</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    // Initialize application on load
    window.onload = function() {
        renderGrid();
    };

</script>
</body>
</html>
