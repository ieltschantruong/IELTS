<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 5 - Stepping Back In Time</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Earthy Terracotta & Dusty Sage (History, Archaeology, Nostalgia) */
            --primary: #b06a5b; /* Terracotta / Dusty Cedar */
            --primary-light: #f4ecea; /* Very light terracotta */
            --primary-hover: #8a4e42; /* Deep rust */
            --text-main: #4a3f3c; /* Dark brown/grey */
            --text-muted: #80736e; /* Muted brown */
            --bg-body: #fdfbf9; /* Warm parchment off-white */
            --card-bg: #ffffff;
            --accent: #7a9184; /* Dusty Sage Green */
            --accent-light: #e9f0ec; /* Very light sage */
            --border: #e3d9d5; /* Warm grey/brown border */
            --badge-bg: #fcefdc; /* Soft sand/gold */
            --badge-text: #a86c2e; /* Golden brown */
            --success: #52756d; /* Muted teal for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        
        header { text-align: center; margin-top: 3rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.01em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.15rem; 
            font-weight: 600; 
            letter-spacing: 0.15em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.6rem 1.3rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(176, 106, 91, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid var(--border); 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(122, 145, 132, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 30px -10px rgba(176, 106, 91, 0.15); 
            border-color: var(--primary-light); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.7rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(176, 106, 91, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.05rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .word-families { 
            background-color: var(--bg-body); 
            border: 1px dashed var(--border); 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.6rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #4a5d52; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(74, 63, 60, 0.08); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.8rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.5rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #faf9f7; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.35rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.25rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed; bottom: 30px; right: 30px; background: var(--primary-hover); color: white;
            padding: 1rem 1.5rem; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .toast-notification.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 0.9rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 550px; } 
            .flashcard-front .word { font-size: 2.8rem; } 
            .flashcard-back .definition { font-size: 1.15rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 5</h1>
        <p class="subtitle">Stepping Back In Time</p>
    </header>

    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Evolution & Anatomy')">Evolution & Anatomy</button>
        <button class="filter-btn" onclick="filterTopic('Archaeology & History')">Archaeology & History</button>
        <button class="filter-btn" onclick="filterTopic('Survival & Action')">Survival & Action</button>
        <button class="filter-btn" onclick="filterTopic('Emotions & Reflection')">Emotions & Reflection</button>
        <button class="filter-btn" onclick="filterTopic('Attributes & Concepts')">Attributes & Concepts</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Expressions')">Idioms & Expressions</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--badge-bg); border-color: #f6dca1; color: var(--badge-text);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    const vocabBank = [
        // --- Evolution & Anatomy ---
        { topic: "Evolution & Anatomy", word: "Bipedal", phonetic: "/baɪˈpiːdl/", form: "Adjective", forms: "N: Bipedalism", def: "Walking on two legs rather than four.", translation: "Đi bằng hai chân", example: "The evolution of bipedalism was a crucial step for early hominids." },
        { topic: "Evolution & Anatomy", word: "Upright stance", phonetic: "/ˈʌpraɪt stɑːns/", form: "Noun Phrase", forms: "N/A", def: "A posture of standing straight up on two feet.", translation: "Tư thế đứng thẳng", example: "An upright stance allowed early humans to see over tall grass." },
        { topic: "Evolution & Anatomy", word: "Limb", phonetic: "/lɪm/", form: "Noun", forms: "N/A", def: "An arm or leg of a person or animal.", translation: "Chi, chân tay", example: "Primates use their upper limbs for swinging through trees." },
        { topic: "Evolution & Anatomy", word: "Forearm", phonetic: "/ˈfɔːrɑːm/", form: "Noun", forms: "N/A", def: "The lower part of the arm, between the elbow and the wrist.", translation: "Cẳng tay", example: "The muscles in the forearm are essential for a strong grip." },
        { topic: "Evolution & Anatomy", word: "Knuckle", phonetic: "/ˈnʌkl/", form: "Noun", forms: "N/A", def: "One of the joints in the hand where your fingers bend.", translation: "Đốt ngón tay", example: "Chimpanzees typically walk using knuckle-walking locomotion." },
        { topic: "Evolution & Anatomy", word: "Patella", phonetic: "/pəˈtelə/", form: "Noun", forms: "Syn: Knee cap", def: "The small bone at the front of the knee joint.", translation: "Xương bánh chè", example: "The fossilized patella showed signs of heavy wear from walking." },
        { topic: "Evolution & Anatomy", word: "Shoulder blade", phonetic: "/ˈʃəʊldə bleɪd/", form: "Noun", forms: "Syn: Scapula", def: "One of the two large flat bones on the upper back.", translation: "Xương bả vai", example: "The spear had pierced the animal's shoulder blade." },
        { topic: "Evolution & Anatomy", word: "Rib", phonetic: "/rɪb/", form: "Noun", forms: "N/A", def: "One of the curved bones that form the cage protecting the heart and lungs.", translation: "Xương sườn", example: "Archaeologists found a set of perfectly preserved ribs." },
        { topic: "Evolution & Anatomy", word: "Robust", phonetic: "/rəʊˈbʌst/", form: "Adjective", forms: "N: Robustness", def: "Strong, healthy, and unlikely to break or fail.", translation: "Cường tráng, khỏe mạnh", example: "Neanderthals had a highly robust skeleton adapted to cold climates." },
        { topic: "Evolution & Anatomy", word: "Stocky", phonetic: "/ˈstɒki/", form: "Adjective", forms: "N/A", def: "Broad and solidly built, usually short.", translation: "Vạm vỡ, thấp béo", example: "The animal had a stocky build, making it highly powerful." },
        { topic: "Evolution & Anatomy", word: "Locomotion", phonetic: "/ˌləʊkəˈməʊʃn/", form: "Noun", forms: "N/A", def: "The ability to move from one place to another.", translation: "Sự vận động, sự di chuyển", example: "Flight is the primary mode of locomotion for most birds." },
        { topic: "Evolution & Anatomy", word: "Chimpanzee", phonetic: "/ˌtʃɪmpænˈziː/", form: "Noun", forms: "N/A", def: "A small, very intelligent African ape.", translation: "Tinh tinh", example: "The chimpanzee is humanity's closest living genetic relative." },

        // --- Archaeology & History ---
        { topic: "Archaeology & History", word: "Excavation", phonetic: "/ˌekskəˈveɪʃn/", form: "Noun", forms: "V: Excavate", def: "The act of digging in the ground to find things from the past.", translation: "Sự khai quật", example: "The archaeological excavation revealed a hidden ancient city." },
        { topic: "Archaeology & History", word: "Specimen", phonetic: "/ˈspesɪmən/", form: "Noun", forms: "N/A", def: "A single example of something, especially an animal or plant, used for scientific study.", translation: "Mẫu vật", example: "This museum holds a rare specimen of a prehistoric fish." },
        { topic: "Archaeology & History", word: "Artifact", phonetic: "/ˈɑːtɪfækt/", form: "Noun", forms: "N/A", def: "An object made by a human being, typically of cultural or historical interest.", translation: "Đồ tạo tác, cổ vật", example: "The museum exhibits artifacts dating back to the Bronze Age." },
        { topic: "Archaeology & History", word: "Anthropologist", phonetic: "/ˌænθrəˈpɒlədʒɪst/", form: "Noun", forms: "N: Anthropology", def: "Someone who scientifically studies humans and their customs, beliefs, and relationships.", translation: "Nhà nhân chủng học", example: "The anthropologist spent years living with the indigenous tribe." },
        { topic: "Archaeology & History", word: "Axe", phonetic: "/æks/", form: "Noun", forms: "N/A", def: "A tool used for chopping wood, typically of iron with a steel edge or anciently made of stone.", translation: "Cái rìu", example: "They discovered a stone axe used by early humans for hunting." },
        { topic: "Archaeology & History", word: "Spear", phonetic: "/spɪə(r)/", form: "Noun", forms: "N/A", def: "A weapon with a long shaft and a pointed tip, used for thrusting or throwing.", translation: "Cái giáo, cái mác", example: "The hunters sharpened the wooden spear using rocks." },
        { topic: "Archaeology & History", word: "Ivory", phonetic: "/ˈaɪvəri/", form: "Noun", forms: "N/A", def: "The hard, yellowish-white substance that forms the tusks of elephants and walruses.", translation: "Ngà (voi)", example: "Ancient artisans carved beautiful small statues out of mammoth ivory." },
        { topic: "Archaeology & History", word: "Ash", phonetic: "/æʃ/", form: "Noun", forms: "N/A", def: "The soft grey powder that remains after something has burned.", translation: "Tro, tàn tro", example: "Layers of volcanic ash helped preserve the ancient ruins perfectly." },
        { topic: "Archaeology & History", word: "Beads", phonetic: "/biːdz/", form: "Noun", forms: "N/A", def: "Small pieces of glass, stone, or similar material with a hole through it, for threading with others.", translation: "Hạt chuỗi", example: "The necklace was made of colorful glass beads." },
        { topic: "Archaeology & History", word: "Thorn", phonetic: "/θɔːn/", form: "Noun", forms: "N/A", def: "A stiff, sharp-pointed, straight or curved woody projection on the stem of a plant.", translation: "Gai", example: "Early humans sometimes used large thorns as primitive needles." },
        { topic: "Archaeology & History", word: "Schools of painting", phonetic: "/skuːlz əv ˈpeɪntɪŋ/", form: "Phrase", forms: "N/A", def: "Groups of artists who share similar styles, techniques, or geographical origins.", translation: "Trường phái hội họa", example: "The exhibition highlights the differences between the two rival schools of painting." },

        // --- Survival & Action ---
        { topic: "Survival & Action", word: "Die out", phonetic: "/daɪ aʊt/", form: "Phrasal Verb", forms: "N/A", def: "To become less common and finally stop existing; become extinct.", translation: "Tuyệt chủng, biến mất hoàn toàn", example: "The dinosaurs died out millions of years ago." },
        { topic: "Survival & Action", word: "Emerge", phonetic: "/ɪˈmɜːdʒ/", form: "Verb", forms: "N: Emergence", def: "To appear by coming out of something or out from behind something.", translation: "Xuất hiện, nổi lên", example: "New species began to emerge after the ice age ended." },
        { topic: "Survival & Action", word: "Retreat", phonetic: "/rɪˈtriːt/", form: "Verb", forms: "N: Retreat", def: "To move away or back; to withdraw.", translation: "Rút lui, lùi lại", example: "As the climate warmed, the massive glaciers began to retreat." },

        { topic: "Attributes & Concepts", word: "Proficient", phonetic: "/prəˈfɪʃnt/", form: "Adjective", forms: "N: Proficiency", def: "Skilled and experienced.", translation: "Thành thạo", example: "Early humans became proficient at making complex stone tools." },
        { topic: "Attributes & Concepts", word: "Compelling", phonetic: "/kəmˈpelɪŋ/", form: "Adjective", forms: "V: Compel", def: "If a reason, argument, etc. is compelling, it makes you believe it or accept it because it is so strong.", translation: "Thuyết phục, hấp dẫn", example: "The discovery provides compelling evidence for the theory of evolution." },
        { topic: "Attributes & Concepts", word: "Permanent", phonetic: "/ˈpɜːmənənt/", form: "Adjective", forms: "Ant: Temporary", def: "Lasting for a long time or forever.", translation: "Vĩnh cửu, dài hạn", example: "Farming allowed people to build permanent settlements instead of moving around." },

        { topic: "Attributes & Concepts", word: "Portable design", phonetic: "/ˈpɔːtəbl dɪˈzaɪn/", form: "Phrase", forms: "N/A", def: "Made or designed to be easy to carry or move safely.", translation: "Thiết kế di động", example: "The ancient abacus was essentially a calculator with a portable design." },
        { topic: "Attributes & Concepts", word: "Versatile", phonetic: "/ˈvɜːsətaɪl/", form: "Adjective", forms: "N: Versatility", def: "Able to change easily from one activity to another or able to be used for many different purposes.", translation: "Đa năng, linh hoạt", example: "The hand axe was a remarkably versatile tool for early hominids." },
        { topic: "Attributes & Concepts", word: "Bulky", phonetic: "/ˈbʌlki/", form: "Adjective", forms: "N: Bulk", def: "Too big and taking up too much space.", translation: "Cồng kềnh", example: "Early computers were extremely bulky and took up entire rooms." },
        { topic: "Attributes & Concepts", word: "Durable", phonetic: "/ˈdjʊərəbl/", form: "Adjective", forms: "N: Durability", def: "Able to last and be used for a long time without becoming damaged.", translation: "Bền bỉ", example: "Stone is a highly durable material, which is why ancient tools survived." },
        { topic: "Attributes & Concepts", word: "Obsolete / Antiquated", phonetic: "/ˈɒbsəliːt / ˈæntɪkweɪtɪd/", form: "Adjective", forms: "Syn: Outdated", def: "Not in use any more, having been replaced by something newer and better.", translation: "Lỗi thời, cổ lỗ sĩ", example: "The invention of the automobile rendered horse-drawn carriages obsolete." },
        { topic: "Attributes & Concepts", word: "Taxing", phonetic: "/ˈtæksɪŋ/", form: "Adjective", forms: "N/A", def: "Requiring a lot of effort or energy.", translation: "Đòi hỏi nhiều sức lực, mệt mỏi", example: "Farming the rocky soil was physically taxing work." },
        { topic: "Attributes & Concepts", word: "Altruistic", phonetic: "/ˌæltruˈɪstɪk/", form: "Adjective", forms: "N: Altruism", def: "Showing a wish to help or bring advantages to others, even if it results in disadvantage for yourself.", translation: "Vị tha", example: "Sharing food within the tribe was an altruistic behavior essential for survival." },
        { topic: "Attributes & Concepts", word: "Tact and prudence", phonetic: "/tækt ənd ˈpruːdns/", form: "Phrase", forms: "Adj: Tactful / Prudent", def: "Carefulness in what you say or do, and good judgment avoiding risks.", translation: "Sự khéo léo và thận trọng", example: "Resolving the territorial dispute required great tact and prudence." },

        // --- Idioms & Expressions ---
        { topic: "Idioms & Expressions", word: "Go in one ear and out the other", phonetic: "/ɡəʊ ɪn wʌn ɪər ənd aʊt ðə ˈʌðə/", form: "Idiom", forms: "N/A", def: "If you tell someone something and it goes in one ear and out the other, they pay no attention to it and immediately forget it.", translation: "Vào tai này ra tai kia", example: "I keep telling him to preserve the artifacts carefully, but it just goes in one ear and out the other." },
        { topic: "Idioms & Expressions", word: "Know better", phonetic: "/nəʊ ˈbetə/", form: "Idiom", forms: "N/A", def: "To be wise or moral enough not to do something.", translation: "Biết điều hơn (không làm điều ngu ngốc)", example: "He should have known better than to touch the fragile painting." },
        { topic: "Idioms & Expressions", word: "See sense", phonetic: "/siː sens/", form: "Idiom", forms: "N/A", def: "To be reasonable and have good judgment.", translation: "Thấy được lẽ phải, suy nghĩ hợp lý", example: "I hope the developers finally see sense and stop destroying the historical site." },
        { topic: "Idioms & Expressions", word: "A token of", phonetic: "/ə ˈtəʊkən əv/", form: "Phrase", forms: "N/A", def: "Something that you do, or a thing that you give someone, that expresses your feelings or intentions.", translation: "Như một biểu tượng/món quà của...", example: "Please accept this antique watch as a token of my appreciation." },
        { topic: "Idioms & Expressions", word: "A weight off one's mind", phonetic: "/ə weɪt ɒf wʌnz maɪnd/", form: "Idiom", forms: "N/A", def: "A relief from a worry or problem.", translation: "Trút được gánh nặng trong lòng", example: "Passing the history exam was a huge weight off my mind." },
        { topic: "Idioms & Expressions", word: "Turn over a new leaf", phonetic: "/tɜːn ˈəʊvər ə njuː liːf/", form: "Idiom", forms: "N/A", def: "To start behaving in a better way.", translation: "Bước sang trang mới, thay đổi bản thân", example: "After failing the class, he promised to turn over a new leaf and study harder." },
        { topic: "Idioms & Expressions", word: "Cram for the exam", phonetic: "/kræm fɔː ði ɪɡˈzæm/", form: "Idiom", forms: "N/A", def: "To try to learn a lot very quickly before an examination.", translation: "Học nhồi nhét cho kỳ thi", example: "She stayed up all night to cram for the archeology exam." },
        { topic: "Idioms & Expressions", word: "Walk on air", phonetic: "/wɔːk ɒn eə/", form: "Idiom", forms: "N/A", def: "To feel extremely excited or happy.", translation: "Vui như trên mây", example: "When the museum accepted his artifact donation, he was walking on air." },
        { topic: "Idioms & Expressions", word: "Make a resolution", phonetic: "/meɪk ə ˌrezəˈluːʃn/", form: "Phrase", forms: "N/A", def: "To make a firm decision to do or not to do something.", translation: "Đưa ra quyết tâm", example: "At the start of the year, she made a resolution to visit more historical sites." },
        { topic: "Idioms & Expressions", word: "Set my heart on something", phonetic: "/set maɪ hɑːt ɒn ˈsʌmθɪŋ/", form: "Idiom", forms: "N/A", def: "To want to get or achieve something very much.", translation: "Quyết tâm/khao khát làm gì đó", example: "I have set my heart on becoming an anthropologist." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #f6dca1; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            
            // Clean up phrasing for better TTS pronunciation
            let cleanText = text.replace(/\bsth\b/g, 'something').replace(/\bsb\b/g, 'somebody');
            cleanText = cleanText.replace(/\(.*?\)/g, ''); // Remove text in parentheses
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; 
            
            // Prefer a clear voice
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Google UK English') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Daniel')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); 
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Evolution')) topicName = 'Evolution & Anatomy';
            else if (activeFilterText.includes('Archaeology')) topicName = 'Archaeology & History';
            else if (activeFilterText.includes('Survival')) topicName = 'Survival & Action';
            else if (activeFilterText.includes('Emotions')) topicName = 'Emotions & Reflection';
            else if (activeFilterText.includes('Attributes')) topicName = 'Attributes & Concepts';
            else if (activeFilterText.includes('Idioms')) topicName = 'Idioms & Expressions';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    window.onload = function() {
        renderGrid();
    };

</script>
</body>
