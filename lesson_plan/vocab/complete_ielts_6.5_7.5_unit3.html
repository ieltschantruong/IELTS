<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 3 - Vocabulary</title>
    <style>
        :root {
            /* Theme: Deep Indigo & Mint/Teal */
            --primary: #312e81; /* Indigo 900 */
            --primary-light: #e0e7ff; /* Indigo 100 */
            --primary-hover: #3730a3; /* Indigo 800 */
            --text-main: #1e293b;
            --text-muted: #475569;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --accent: #0d9488; /* Teal 600 */
            --accent-light: #ccfbf1; /* Teal 100 */
            --border: #c7d2fe; /* Indigo 200 */
            --badge-bg: #ccfbf1; /* Teal 100 */
            --badge-text: #0f766e; /* Teal 700 */
            --success: #be185d; /* Pink 700 for translation text to pop */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-top: 2rem; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 6px rgba(49, 46, 129, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 6px rgba(13, 148, 136, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); border: 1px solid var(--primary-light); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(49, 46, 129, 0.15); border-color: var(--border); }
        .vocab-card.hidden { display: none; }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.75rem; }
        .word-main { display: flex; align-items: center; gap: 0.5rem; }
        .word { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.4rem; border-radius: 50%; transition: transform 0.2s, background-color 0.2s; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary-light); }
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        
        .word-families { background-color: #f1f5f9; border: 1px dashed #cbd5e1; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #475569; margin-bottom: 1rem; }
        .word-families strong { color: var(--primary); }

        .topic-tag { font-size: 0.8rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; margin-bottom: 1rem; display: inline-block;}
        
        .definition { font-size: 1rem; margin-bottom: 0.25rem; color: var(--text-main); }
        .definition strong { color: var(--primary); }
        
        /* Translation and Usage */
        .translation { font-size: 0.95rem; color: var(--success); margin-bottom: 0.5rem; font-weight: 600; }

        .example-box { background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary-hover); margin-bottom: 0.35rem; font-weight: 800; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 650px; height: 500px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(49, 46, 129, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 2.8rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .flashcard-front .audio-btn { font-size: 2rem; background: var(--primary-light); padding: 0.8rem; }
        .flashcard-front .phonetic { font-size: 1.3rem; color: var(--text-muted); font-style: italic; }
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        
        .flashcard-back .definition { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.1rem; margin-bottom: 1rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; font-size: 1rem; padding: 1rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1rem; font-weight: 700; cursor: pointer; padding: 0.5rem 1.2rem; border-radius: 20px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.1rem; color: var(--accent); min-width: 70px; text-align: center; }

        @media (max-width: 768px) { 
            h1 { font-size: 1.8rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.2rem; } 
            .flashcard-back .definition { font-size: 1rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 3</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; font-weight: 500;">Listening, Reading, Speaking & Writing Vocabulary</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Vocabulary</button>
        <button class="filter-btn" onclick="filterTopic('Listening')">Listening</button>
        <button class="filter-btn" onclick="filterTopic('Reading')">Reading</button>
        <button class="filter-btn" onclick="filterTopic('Speaking')">Speaking</button>
        <button class="filter-btn" onclick="filterTopic('Writing')">Writing</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 80%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 80%; background-color: var(--accent-light); border-color: #5eead4; color: var(--badge-text);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Skill</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 110</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    const vocabBank = [
        // --- LISTENING ---
        { topic: "Listening", word: "Seminar", phonetic: "/ˈsemɪnɑː(r)/", form: "Noun", forms: "N/A", def: "A class at university or college when a small group of students and a teacher discuss or study a particular topic.", translation: "Hội thảo, lớp chuyên đề", example: "We had a very interesting seminar on climate change this morning." },
        { topic: "Listening", word: "Clinic", phonetic: "/ˈklɪnɪk/", form: "Noun", forms: "Adj: Clinical", def: "A building or part of a hospital where people can go for special medical treatment or advice.", translation: "Phòng khám", example: "She went to the local health clinic to get her blood pressure checked." },
        { topic: "Listening", word: "Stiffness", phonetic: "/ˈstɪfnəs/", form: "Noun", forms: "Adj: Stiff | Adv: Stiffly", def: "The quality of being difficult to bend or move (especially muscles or joints).", translation: "Sự căng cứng (cơ bắp, khớp)", example: "He experienced some stiffness in his neck after sleeping in an awkward position." },
        { topic: "Listening", word: "Posture", phonetic: "/ˈpɒstʃə(r)/", form: "Noun", forms: "N/A", def: "The position in which you hold your body when standing or sitting.", translation: "Tư thế, điệu bộ", example: "Sitting at a desk all day can lead to very poor posture and back pain." },
        { topic: "Listening", word: "Painkiller", phonetic: "/ˈpeɪnkɪlə(r)/", form: "Noun", forms: "N/A", def: "A medicine that reduces or removes pain.", translation: "Thuốc giảm đau", example: "The doctor prescribed a strong painkiller for his severe headache." },
        { topic: "Listening", word: "Rehabilitation", phonetic: "/ˌriːhəˌbɪlɪˈteɪʃn/", form: "Noun", forms: "V: Rehabilitate", def: "The process of helping somebody to have a normal, useful life again after they have been ill or injured.", translation: "Sự phục hồi chức năng", example: "He is undergoing intense physical rehabilitation after his knee surgery." },
        { topic: "Listening", word: "Manipulate", phonetic: "/məˈnɪpjuleɪt/", form: "Verb", forms: "N: Manipulation | Adj: Manipulative", def: "To control or use something in a skilful way (e.g., a machine or tool).", translation: "Điều khiển, thao tác", example: "The worker was trained to manipulate the heavy lifting machinery safely." },
        { topic: "Listening", word: "Prescribe", phonetic: "/prɪˈskraɪb/", form: "Verb", forms: "N: Prescription", def: "To tell somebody to take a particular medicine or have a particular treatment.", translation: "Kê đơn (thuốc)", example: "The physician decided to prescribe a course of antibiotics for the infection." },
        { topic: "Listening", word: "Lead a sedentary lifestyle", phonetic: "/liːd ə ˈsedntri ˈlaɪfstaɪl/", form: "Phrase", forms: "N/A", def: "To live in a way that involves a lot of sitting and very little exercise.", translation: "Sống lối sống ít vận động", example: "Office workers often lead a sedentary lifestyle, which increases the risk of obesity." },
        { topic: "Listening", word: "Sustain an injury", phonetic: "/səˈsteɪn ən ˈɪndʒəri/", form: "Phrase", forms: "V: Suffer an injury", def: "To experience or suffer harm or damage to the body.", translation: "Bị chấn thương", example: "The football player sustained a serious ankle injury during the final match." },
        { topic: "Listening", word: "Sprain an ankle", phonetic: "/spreɪn ən ˈæŋkl/", form: "Phrase", forms: "N: Sprain", def: "To injure the joint connecting the foot to the leg by twisting it suddenly.", translation: "Bong gân mắt cá chân", example: "She tripped on the uneven pavement and managed to sprain her ankle." },
        { topic: "Listening", word: "Devise", phonetic: "/dɪˈvaɪz/", form: "Verb", forms: "N/A", def: "To invent something new or a new way of doing something.", translation: "Nghĩ ra, sáng chế, lập ra", example: "The management team must devise a new strategy to increase sales." },
        { topic: "Listening", word: "Get fed up with", phonetic: "/ɡet fed ʌp wɪð/", form: "Phrasal Verb", forms: "N/A", def: "To become bored or unhappy with something, especially something you have experienced for too long.", translation: "Phát chán với, chán ngấy", example: "I am getting completely fed up with this terrible rainy weather." },

        // --- READING ---
        { topic: "Reading", word: "Placebo effect", phonetic: "/pləˈsiːbəʊ ɪˈfekt/", form: "Noun Phrase", forms: "N/A", def: "A beneficial effect produced by a placebo drug or treatment, which cannot be attributed to the properties of the placebo itself.", translation: "Hiệu ứng giả dược", example: "The patient's recovery was largely attributed to the placebo effect rather than the actual medication." },
        { topic: "Reading", word: "Side effect", phonetic: "/saɪd ɪˈfekt/", form: "Noun Phrase", forms: "N/A", def: "An extra, usually bad, occurrence caused by taking a drug.", translation: "Tác dụng phụ", example: "Drowsiness and nausea are common side effects of this allergy medicine." },
        { topic: "Reading", word: "Anti-depressant", phonetic: "/ˌænti dɪˈpresnt/", form: "Noun", forms: "N: Depression | Adj: Depressed", def: "A drug used to treat mental depression.", translation: "Thuốc chống trầm cảm", example: "He was prescribed an anti-depressant to help manage his severe anxiety and low mood." },
        { topic: "Reading", word: "Pharmacology", phonetic: "/ˌfɑːməˈkɒlədʒi/", form: "Noun", forms: "Adj: Pharmacological | N: Pharmacist", def: "The branch of medicine concerned with the uses, effects, and modes of action of drugs.", translation: "Dược lý học", example: "She is studying pharmacology at university with the goal of developing new medicines." },
        { topic: "Reading", word: "Psychiatry", phonetic: "/saɪˈkaɪətri/", form: "Noun", forms: "Adj: Psychiatric | N: Psychiatrist", def: "The study and treatment of mental illness, emotional disturbance, and abnormal behaviour.", translation: "Tâm thần học", example: "Advances in modern psychiatry have greatly improved the treatment of severe mental disorders." },
        { topic: "Reading", word: "Make matters worse", phonetic: "/meɪk ˈmætəz wɜːs/", form: "Phrase", forms: "N/A", def: "To make a difficult or bad situation even worse.", translation: "Làm cho vấn đề tồi tệ hơn", example: "I was already late for the meeting, and to make matters worse, my car broke down." },
        { topic: "Reading", word: "Hinge on", phonetic: "/hɪndʒ ɒn/", form: "Phrasal Verb", forms: "N/A", def: "To depend entirely on something.", translation: "Phụ thuộc hoàn toàn vào", historic: "The success of the entire marketing campaign hinges on our ability to reach younger consumers." },
        { topic: "Reading", word: "Breakthrough", phonetic: "/ˈbreɪkθruː/", form: "Noun", forms: "N/A", def: "A sudden, dramatic, and important discovery or development.", translation: "Sự đột phá", example: "The discovery of DNA structure was a major breakthrough in biological science." },
        { topic: "Reading", word: "Venture", phonetic: "/ˈventʃə(r)/", form: "Noun", forms: "V: Venture", def: "A risky or daring journey or undertaking; a business enterprise.", translation: "Dự án kinh doanh mạo hiểm, cuộc phiêu lưu", example: "The investors poured millions of dollars into the new tech venture." },
        { topic: "Reading", word: "Comb through", phonetic: "/kəʊm θruː/", form: "Phrasal Verb", forms: "N/A", def: "To search a place or a text very carefully in order to find something.", translation: "Tìm kiếm kỹ lưỡng, rà soát", example: "The detectives had to comb through thousands of documents to find the evidence." },
        { topic: "Reading", word: "Empathy", phonetic: "/ˈempəθi/", form: "Noun", forms: "Adj: Empathetic | V: Empathize", def: "The ability to understand and share the feelings of another.", translation: "Sự thấu cảm, sự đồng cảm", example: "A good nurse must show deep empathy towards their suffering patients." },
        { topic: "Reading", word: "Rival", phonetic: "/ˈraɪvl/", form: "Noun / Verb", forms: "N: Rivalry", def: "A person or thing competing with another for the same objective or for superiority.", translation: "Đối thủ / Cạnh tranh", example: "The two tech companies have been fierce rivals for over a decade." },
        { topic: "Reading", word: "Outcome", phonetic: "/ˈaʊtkʌm/", form: "Noun", forms: "N/A", def: "The way a thing turns out; a consequence.", translation: "Kết quả, hậu quả", example: "The final outcome of the peace negotiations will be announced tomorrow." },
        { topic: "Reading", word: "Blockbuster", phonetic: "/ˈblɒkbʌstə(r)/", form: "Noun", forms: "N/A", def: "Something very successful, especially a very successful book or film.", translation: "Sản phẩm thành công vang dội (bom tấn)", example: "The pharmaceutical company released a blockbuster drug that cured the disease." },
        { topic: "Reading", word: "Trail behind", phonetic: "/treɪl bɪˈhaɪnd/", form: "Phrasal Verb", forms: "N/A", def: "To be losing in a race, competition, or election.", translation: "Tụt lại phía sau, đi sau", example: "Our company's sales are starting to trail behind our main competitors." },
        { topic: "Reading", word: "Jargon", phonetic: "/ˈdʒɑːɡən/", form: "Noun", forms: "N/A", def: "Special words or expressions that are used by a particular profession or group and are difficult for others to understand.", translation: "Biệt ngữ, từ ngữ chuyên ngành", example: "The legal document was full of confusing jargon that I couldn't comprehend." },
        { topic: "Reading", word: "Futile", phonetic: "/ˈfjuːtaɪl/", form: "Adjective", forms: "N: Futility", def: "Incapable of producing any useful result; pointless.", translation: "Vô ích, vô ích", example: "All attempts to persuade him to change his mind proved completely futile." },
        { topic: "Reading", word: "Mistaken", phonetic: "/mɪˈsteɪkən/", form: "Adjective", forms: "V: Mistake | N: Mistake", def: "Wrong in one's opinion or judgment.", translation: "Sai lầm, hiểu lầm", example: "If you think I am going to pay for the damage, you are sadly mistaken." },
        { topic: "Reading", word: "Innovative", phonetic: "/ˈɪnəvətɪv/", form: "Adjective", forms: "N: Innovation | V: Innovate", def: "Featuring new methods; advanced and original.", translation: "Có tính đổi mới, sáng tạo", example: "The tech startup is known for its highly innovative approach to software design." },
        { topic: "Reading", word: "Hybrid", phonetic: "/ˈhaɪbrɪd/", form: "Noun / Adjective", forms: "N/A", def: "A thing made by combining two different elements.", translation: "Con lai, sự lai tạo, hỗn hợp", example: "The new car is a hybrid that runs on both electricity and petrol." },
        { topic: "Reading", word: "Baffled", phonetic: "/ˈbæfld/", form: "Adjective", forms: "V: Baffle | N: Bafflement", def: "Totally bewilder or perplex.", translation: "Bối rối, lúng túng", example: "The doctors were completely baffled by the patient's strange symptoms." },
        { topic: "Reading", word: "Consistent", phonetic: "/kənˈsɪstənt/", form: "Adjective", forms: "N: Consistency | Adv: Consistently", def: "Acting or done in the same way over time, especially so as to be fair or accurate.", translation: "Nhất quán, kiên định", example: "We need a consistent approach to tackling environmental problems globally." },
        { topic: "Reading", word: "Bogus", phonetic: "/ˈbəʊɡəs/", form: "Adjective", forms: "N/A", def: "Not genuine or true; fake.", translation: "Giả mạo, không có thật", example: "He was arrested for selling bogus insurance policies to elderly people." },
        { topic: "Reading", word: "Falter", phonetic: "/ˈfɔːltə(r)/", form: "Verb", forms: "N/A", def: "To lose strength or momentum.", translation: "Chùn bước, loạng choạng, suy yếu", example: "The economy has begun to falter after years of steady growth." },
        { topic: "Reading", word: "Gauge", phonetic: "/ɡeɪdʒ/", form: "Verb", forms: "N: Gauge", def: "Estimate or determine the magnitude, amount, or volume of.", translation: "Đo lường, đánh giá", example: "It is difficult to gauge the exact extent of the damage caused by the storm." },
        { topic: "Reading", word: "Dominate", phonetic: "/ˈdɒmɪneɪt/", form: "Verb", forms: "N: Domination | Adj: Dominant", def: "Have a commanding influence on; exercise control over.", translation: "Thống trị, áp đảo", example: "Large multinational corporations tend to dominate the global food market." },
        { topic: "Reading", word: "Yield", phonetic: "/jiːld/", form: "Verb / Noun", forms: "N/A", def: "Produce or provide (a natural, agricultural, or industrial product).", translation: "Sản sinh, mang lại / Sản lượng", example: "The new farming techniques yielded a much larger crop this season." },

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--accent-light); border-color: #5eead4; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Definition:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span>"${item.example}"
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Listening')) topicName = 'Listening';
            if (activeFilter.includes('Reading')) topicName = 'Reading';
            if (activeFilter.includes('Speaking')) topicName = 'Speaking';
            if (activeFilter.includes('Writing')) topicName = 'Writing';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main);">
                    <span style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary-hover); margin-bottom: 0.25rem; font-weight: bold;">Usage Example</span>"${data.example}"
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
</html>
