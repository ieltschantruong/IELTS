<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 4 - Vocabulary</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Light Pastel Mint & Soft Rose */
            --primary: #0d9488; /* Teal 600 */
            --primary-light: #ccfbf1; /* Teal 100 */
            --primary-hover: #0f766e; /* Teal 700 */
            --text-main: #334155; /* Slate 700 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-body: #f0fdf4; /* Mint Cream / Green 50 */
            --card-bg: #ffffff;
            --accent: #f43f5e; /* Rose 500 */
            --accent-light: #ffe4e6; /* Rose 100 */
            --border: #a7f3d0; /* Mint 200 */
            --badge-bg: #fef08a; /* Yellow 200 */
            --badge-text: #b45309; /* Amber 700 */
            --success: #0284c7; /* Sky Blue for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        .header-banner { background-color: var(--card-bg); color: var(--text-main); text-align: center; padding: 1rem; font-weight: 700; font-size: 1.2rem; letter-spacing: 0.1em; width: 100%; border-bottom: 3px solid var(--primary); margin-bottom: 2rem; text-transform: uppercase; font-family: var(--font-headings); }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800; font-family: var(--font-headings); }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; font-weight: 500; letter-spacing: 0.05em; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.95rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary-light); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: var(--font-body); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(244, 63, 94, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.8rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.8rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(13, 148, 136, 0.15); border-color: var(--primary-light); }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.8rem; }
        .word-main { display: flex; align-items: center; gap: 0.8rem; }
        .word { font-size: 1.6rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { background: var(--primary-light); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; transition: all 0.2s ease; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(13, 148, 136, 0.4); }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { background-color: #f8fafc; border: 1px dashed #cbd5e1; padding: 0.6rem; border-radius: 8px; font-size: 0.9rem; color: #475569; margin-bottom: 1rem; line-height: 1.4; }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { font-size: 0.75rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 700; margin-bottom: 1rem; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em;}
        
        .definition { font-size: 1.05rem; margin-bottom: 0.4rem; color: var(--text-main); font-weight: 500; }
        .definition strong { color: var(--primary); }
        
        /* Translation and Usage */
        .translation { font-size: 1rem; color: var(--success); margin-bottom: 1rem; font-weight: 600; }

        .example-box { background-color: var(--accent-light); padding: 1.2rem; border-left: 4px solid var(--accent); border-radius: 8px; margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.35rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.35rem; color: #881337; line-height: 1.4; }
        
        .extra-example { background-color: var(--primary-light); border-left-color: var(--primary); margin-top: 0.75rem; }
        .extra-example span { color: var(--primary); }
        .extra-example .example-text { color: #064e3b; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 700px; height: 580px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 15px 35px rgba(13, 148, 136, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.2rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings);}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; }
        .flashcard-front .audio-btn { width: 50px; height: 50px; }
        .flashcard-front .audio-btn svg { width: 24px; height: 24px; }
        .flashcard-front .phonetic { font-size: 1.4rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.15rem; margin-bottom: 1.5rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.2rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2.5rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 0.6rem 1.5rem; border-radius: 25px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.2rem; color: var(--accent); min-width: 80px; text-align: center; font-family: var(--font-headings); }

        @media (max-width: 768px) { 
            h1 { font-size: 2rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.5rem; } 
            .flashcard-back .definition { font-size: 1.05rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="header-banner">Grade 12 | Chan Truong</div>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 4</h1>
        <p class="subtitle">Art, Culture & Society Vocabulary Builder</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Art & Creation')">Art & Creation</button>
        <button class="filter-btn" onclick="filterTopic('History & Culture')">History & Culture</button>
        <button class="filter-btn" onclick="filterTopic('Emotions & Attitudes')">Emotions & Attitudes</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Useful Phrases')">Idioms & Useful Phrases</button>
        <button class="filter-btn" onclick="filterTopic('Adjectives & Descriptions')">Adjectives & Descriptions</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fbcfe8; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 62</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 6.5-7.5 Unit 4)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Art & Creation ---
        { topic: "Art & Creation", word: "Palette", phonetic: "/ˈpælət/", form: "Noun", forms: "N/A", def: "A thin board or slab on which an artist lays and mixes colors.", translation: "Bảng pha màu", example: "The artist blended vibrant blues and greens on her palette." },
        { topic: "Art & Creation", word: "Pottery", phonetic: "/ˈpɒtəri/", form: "Noun", forms: "N: Potter", def: "Pots, dishes, and other articles made of baked clay.", translation: "Đồ gốm", example: "She enrolled in a pottery class to learn how to make ceramic bowls." },
        { topic: "Art & Creation", word: "Powder", phonetic: "/ˈpaʊdə(r)/", form: "Noun / Verb", forms: "Adj: Powdery", def: "Fine, dry particles produced by the grinding, crushing, or disintegration of a solid substance.", translation: "Bột", example: "Ancient artists crushed colorful rocks into fine powder to make paint." },
        { topic: "Art & Creation", word: "Sap", phonetic: "/sæp/", form: "Noun", forms: "N/A", def: "The fluid which circulates in the vascular system of a plant.", translation: "Nhựa cây", example: "They extracted sap from the trees to use as a natural binder for pigments." },
        { topic: "Art & Creation", word: "Fluid", phonetic: "/ˈfluːɪd/", form: "Noun / Adjective", forms: "N: Fluidity", def: "A substance that has no fixed shape and yields easily to external pressure; a gas or liquid.", translation: "Chất lỏng / Uyển chuyển", example: "Watercolors require a lot of fluid to achieve the right transparency." },
        { topic: "Art & Creation", word: "Canvas", phonetic: "/ˈkænvəs/", form: "Noun", forms: "N/A", def: "A strong, coarse unbleached cloth made from hemp, flax, or yarn, used to make sails, tents, or as a surface for oil painting.", translation: "Tranh bạt, vải bạt", example: "He stared at the blank canvas, waiting for inspiration to strike." },
        { topic: "Art & Creation", word: "Showcase", phonetic: "/ˈʃəʊkeɪs/", form: "Verb / Noun", forms: "N/A", def: "Exhibit; display.", translation: "Trưng bày, phô diễn", example: "The gallery will showcase the works of local talented sculptors." },
        { topic: "Art & Creation", word: "Pigment", phonetic: "/ˈpɪɡmənt/", form: "Noun", forms: "N: Pigmentation", def: "The natural coloring matter of animal or plant tissue; a substance used for coloring or painting.", translation: "Sắc tố, bột màu", example: "Red ochre was a highly valued pigment in ancient cave paintings." },
        { topic: "Art & Creation", word: "Composition", phonetic: "/ˌkɒmpəˈzɪʃn/", form: "Noun", forms: "V: Compose | N: Composer", def: "The nature of something's ingredients or constituents; a work of music, literature, or art.", translation: "Bố cục, tác phẩm", example: "The photographer spent hours arranging the perfect composition." },
        { topic: "Art & Creation", word: "Display", phonetic: "/dɪˈspleɪ/", form: "Verb / Noun", forms: "N/A", def: "Put (something) in a prominent place in order that it may readily be seen.", translation: "Trưng bày", example: "The museum will display the newly discovered artifacts next week." },
        { topic: "Art & Creation", word: "Carve", phonetic: "/kɑːv/", form: "Verb", forms: "N: Carving", def: "Cut (a hard material) in order to produce an object, design, or figure.", translation: "Chạm khắc", example: "The sculptor used a chisel to carve a beautiful swan out of ice." },
        { topic: "Art & Creation", word: "Workmanship / Craftsmanship", phonetic: "/ˈwɜːkmənʃɪp/ / /ˈkrɑːftsmənʃɪp/", form: "Noun", forms: "N: Craftsman", def: "The degree of skill with which a product is made or a job done.", translation: "Sự khéo léo, tay nghề", example: "The exquisite detail on the wooden table showed incredible craftsmanship." },

        // --- History & Culture ---
        { topic: "History & Culture", word: "Arrow", phonetic: "/ˈærəʊ/", form: "Noun", forms: "N/A", def: "A shaft sharpened at the front and with feathers or vanes at the back, shot from a bow as a weapon or for sport.", translation: "Mũi tên", example: "Archaeologists found a bronze arrow buried deep in the ancient ruins." },
        { topic: "History & Culture", word: "Archaeology", phonetic: "/ˌɑːkiˈɒlədʒi/", form: "Noun", forms: "N: Archaeologist | Adj: Archaeological", def: "The study of human history and prehistory through the excavation of sites and the analysis of artifacts.", translation: "Khảo cổ học", example: "Her degree in archaeology allowed her to work on digs in Egypt." },
        { topic: "History & Culture", word: "Milestone", phonetic: "/ˈmaɪlstəʊn/", form: "Noun", forms: "N/A", def: "An action or event marking a significant change or stage in development.", translation: "Cột mốc quan trọng", example: "The invention of the printing press was a major milestone in human history." },
        { topic: "History & Culture", word: "Weapon", phonetic: "/ˈwepən/", form: "Noun", forms: "Adj: Weaponized", def: "A thing designed or used for inflicting bodily harm or physical damage.", translation: "Vũ khí", example: "Early humans crafted weapons out of stone and bone to hunt for food." },
        { topic: "History & Culture", word: "Ceremony", phonetic: "/ˈserəməni/", form: "Noun", forms: "Adj: Ceremonial", def: "A formal religious or public occasion, typically one celebrating a particular event or anniversary.", translation: "Nghi lễ", example: "The indigenous tribe held a special ceremony to welcome the spring." },
        { topic: "History & Culture", word: "Shelter", phonetic: "/ˈʃeltə(r)/", form: "Noun / Verb", forms: "N/A", def: "A place giving temporary protection from bad weather or danger.", translation: "Nơi trú ẩn", example: "The hikers sought shelter in a cave when the thunderstorm began." },
        { topic: "History & Culture", word: "Indigenous", phonetic: "/ɪnˈdɪdʒənəs/", form: "Adjective", forms: "N/A", def: "Originating or occurring naturally in a particular place; native.", translation: "Bản địa", example: "The kangaroo is an animal that is indigenous to Australia." },
        { topic: "History & Culture", word: "Date back", phonetic: "/deɪt bæk/", form: "Phrasal Verb", forms: "N/A", def: "To have existed since a specific time in the past.", translation: "Có từ thời, bắt nguồn từ", example: "These ancient cave paintings date back over ten thousand years." },
        { topic: "History & Culture", word: "Advance", phonetic: "/ədˈvɑːns/", form: "Verb / Noun", forms: "Adj: Advanced", def: "Move forwards in a purposeful way; make or cause to make progress.", translation: "Sự tiến bộ, tiến lên", example: "There have been massive advances in telecommunications over the past decade." },
        { topic: "History & Culture", word: "Circulation", phonetic: "/ˌsɜːkjəˈleɪʃn/", form: "Noun", forms: "V: Circulate", def: "The public availability or knowledge of something; the continuous motion of fluid.", translation: "Sự lưu thông, lượng phát hành", example: "The newspaper has a daily circulation of over one million copies." },

        // --- Emotions & Attitudes ---
        { topic: "Emotions & Attitudes", word: "Be passionate about", phonetic: "/bi ˈpæʃənət əˈbaʊt/", form: "Phrase", forms: "N: Passion", def: "To have very strong feelings or emotions about something, especially because you think it is important.", translation: "Đam mê về điều gì", example: "She is deeply passionate about environmental conservation." },
        { topic: "Emotions & Attitudes", word: "Have a passion for", phonetic: "/hæv ə ˈpæʃn fɔː(r)/", form: "Phrase", forms: "Adj: Passionate", def: "To enjoy something very much.", translation: "Có niềm đam mê với", example: "Ever since he was a child, he has had a passion for classical music." },
        { topic: "Emotions & Attitudes", word: "Spontaneously", phonetic: "/spɒnˈteɪniəsli/", form: "Adverb", forms: "Adj: Spontaneous | N: Spontaneity", def: "As a result of a sudden impulse and without premeditation.", translation: "Một cách tự phát", example: "The crowd spontaneously erupted into cheers when the team scored." },
        { topic: "Emotions & Attitudes", word: "Be reluctant to do sth", phonetic: "/bi rɪˈlʌktənt tu duː ˈsʌmθɪŋ/", form: "Phrase", forms: "N: Reluctance", def: "Unwilling and hesitant; disinclined.", translation: "Miễn cưỡng làm gì", example: "He was reluctant to admit his mistake in front of the whole class." },
        { topic: "Emotions & Attitudes", word: "Aspiration", phonetic: "/ˌæspəˈreɪʃn/", form: "Noun", forms: "V: Aspire | Adj: Aspirational", def: "A hope or ambition of achieving something.", translation: "Khát vọng", example: "Her highest aspiration is to become a published author." },
        { topic: "Emotions & Attitudes", word: "Provoke", phonetic: "/prəˈvəʊk/", form: "Verb", forms: "Adj: Provocative | N: Provocation", def: "Stimulate or give rise to (a reaction or emotion, typically a strong or unwelcome one) in someone.", translation: "Khơi gợi, kích động", example: "The controversial artwork was designed to provoke a strong emotional response." },
        { topic: "Emotions & Attitudes", word: "Glamorize", phonetic: "/ˈɡlæməraɪz/", form: "Verb", forms: "N: Glamour | Adj: Glamorous", def: "Make (something) seem glamorous or desirable, especially spuriously so.", translation: "Tô hồng, làm hào nhoáng", example: "Many movies tend to glamorize the lives of criminals and spies." },
        { topic: "Emotions & Attitudes", word: "Be engrossed in", phonetic: "/bi ɪnˈɡrəʊst ɪn/", form: "Phrase", forms: "N/A", def: "Absorb all the attention or interest of.", translation: "Say mê, chìm đắm vào", example: "She was so engrossed in her book that she didn't hear the phone ring." },

        // --- Adjectives, Concepts & Descriptions ---

    // --- DOM Injection ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fde047; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    // --- Audio Synthesis ---
    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            
            // Try to find a female voice profile
            let femaleVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Zira') ||
                voice.name.includes('Karen') ||
                voice.name.includes('Tessa') ||
                voice.name.includes('Fiona') ||
                voice.name.includes('Moira') ||
                voice.name.includes('Veena')
            );
            
            // Fallback to any en-GB voice that isn't explicitly male
            if (!femaleVoice) {
                femaleVoice = voices.find(voice => voice.lang.includes('en-GB') && !voice.name.includes('Male'));
            }
            
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                utterance.pitch = 1.3; // mimic female pitch
            }

            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    // --- Topic Filtering ---
    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    // --- View Toggling ---
    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Art')) topicName = 'Art & Creation';
            if (activeFilter.includes('History')) topicName = 'History & Culture';
            if (activeFilter.includes('Emotions')) topicName = 'Emotions & Attitudes';
            if (activeFilter.includes('Idioms')) topicName = 'Idioms & Useful Phrases';
            if (activeFilter.includes('Adjectives')) topicName = 'Adjectives & Descriptions';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    // --- Flashcard Logic ---
    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem;">
                    <span style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
