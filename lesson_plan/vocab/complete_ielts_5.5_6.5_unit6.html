<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 6 - Making Money Spending Money</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Dusty Blue & Caramel (Finance/Commerce theme) */
            --primary: #4a6fa5; /* Dusty Slate Blue */
            --primary-light: #eef2f6; /* Very light slate */
            --primary-hover: #365580; /* Darker Slate Blue */
            --text-main: #334155; /* Slate 700 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-body: #f8fafc; /* Slate 50 - Off-white background */
            --card-bg: #ffffff;
            --accent: #e59866; /* Soft Caramel / Terracotta */
            --accent-light: #fdf3ed; /* Very light caramel */
            --border: #cbd5e1; /* Slate 300 */
            --badge-bg: #fef08a; /* Yellow 200 */
            --badge-text: #854d0e; /* Yellow 800 */
            --success: #059669; /* Emerald 600 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2.5rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.02em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            letter-spacing: 0.1em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.5rem 1.2rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(229, 152, 102, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 30px -10px rgba(74, 111, 165, 0.15); 
            border-color: var(--primary); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.8rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1) rotate(5deg); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(74, 111, 165, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { 
            background-color: var(--bg-body); 
            border: 1px dashed var(--border); 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box::before {
            content: '"';
            position: absolute;
            top: 0;
            right: 15px;
            font-family: var(--font-headings);
            font-size: 4rem;
            color: var(--accent);
            opacity: 0.15;
            line-height: 1;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #b45f06; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(74, 111, 165, 0.15); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 4rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.6rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #fcfdfe; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.3rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-hover);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 1rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 550px; } 
            .flashcard-front .word { font-size: 3rem; } 
            .flashcard-back .definition { font-size: 1.2rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 6</h1>
        <p class="subtitle">Making Money Spending Money</p>
    </header>

    <!-- Topic Filters -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Retail & Shopping')">Retail & Shopping</button>
        <button class="filter-btn" onclick="filterTopic('Consumer Psychology')">Consumer Psych</button>
        <button class="filter-btn" onclick="filterTopic('Business & Finance')">Business & Finance</button>
        <button class="filter-btn" onclick="filterTopic('Personal Finance')">Personal Finance</button>
        <button class="filter-btn" onclick="filterTopic('Value & Cost')">Value & Cost</button>
        <button class="filter-btn" onclick="filterTopic('Attitudes & Actions')">Attitudes</button>
    </div>

    <!-- View Toggles -->
    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fbd3bc; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 6)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Retail & Shopping ---
        { topic: "Retail & Shopping", word: "Bargain", phonetic: "/ˈbɑːɡɪn/", form: "Noun", forms: "V: Bargain", def: "Something on sale at a lower price than its true value.", translation: "Món hời, của rẻ", example: "I picked up a few really good bargains in the holiday sales." },
        { topic: "Retail & Shopping", word: "Shoplifting", phonetic: "/ˈʃɒplɪftɪŋ/", form: "Noun", forms: "N: Shoplifter | V: Shoplift", def: "The illegal act of taking goods from a shop without paying for them.", translation: "Tội ăn cắp vặt ở cửa hàng", example: "The store installed more cameras to deter shoplifting." },
        { topic: "Retail & Shopping", word: "Aisle", phonetic: "/aɪl/", form: "Noun", forms: "N/A", def: "A long, narrow space between rows of shelves in a large shop.", translation: "Lối đi (giữa các kệ hàng)", example: "You'll find the coffee and tea in the next aisle." },
        { topic: "Retail & Shopping", word: "Retailer", phonetic: "/ˈriːteɪlə(r)/", form: "Noun", forms: "N/V: Retail", def: "A person, shop, or business that sells goods to the public.", translation: "Nhà bán lẻ", example: "The clothing line is sold by a major high-street retailer." },
        { topic: "Retail & Shopping", word: "Branded", phonetic: "/ˈbrændɪd/", form: "Adjective", forms: "N: Brand", def: "Made by a well-known company and having that company's name on it.", translation: "Có thương hiệu", example: "Branded goods are usually much more expensive than store-brand items." },
        { topic: "Retail & Shopping", word: "Own-label", phonetic: "/ˌəʊn ˈleɪbl/", form: "Adjective", forms: "N/A", def: "Used to describe goods sold under the name of the shop that sells them, rather than the manufacturer.", translation: "Nhãn hàng riêng của siêu thị", example: "Supermarkets make higher profits on their own-label products." },
        { topic: "Retail & Shopping", word: "Unplanned purchase", phonetic: "/ˌʌnˈplænd ˈpɜːtʃəs/", form: "Noun Phrase", forms: "N/A", def: "Buying something that you had not intended to buy before entering a store.", translation: "Mua sắm ngoài kế hoạch (mua ngẫu hứng)", example: "Placing candy near the checkout counter encourages unplanned purchases." },

        // --- Consumer Psychology ---
        { topic: "Consumer Psychology", word: "Tempt", phonetic: "/tempt/", form: "Verb", forms: "N: Temptation | Adj: Tempting", def: "To make someone want to have or do something, especially something unnecessary or wrong.", translation: "Cám dỗ, xúi giục", example: "The delicious smell of the bakery tempted me to buy a pastry." },
        { topic: "Consumer Psychology", word: "Manipulate", phonetic: "/məˈnɪpjuleɪt/", form: "Verb", forms: "N: Manipulation | Adj: Manipulative", def: "To control something or someone to your advantage, often unfairly or dishonestly.", translation: "Thao túng", example: "Clever advertising can easily manipulate consumers into buying things they don't need." },
        { topic: "Consumer Psychology", word: "Persuade", phonetic: "/pəˈsweɪd/", form: "Verb", forms: "N: Persuasion | Adj: Persuasive", def: "To make someone do or believe something by giving them a good reason to do it.", translation: "Thuyết phục", example: "The salesperson tried to persuade me to buy the more expensive model." },
        { topic: "Consumer Psychology", word: "Decoy items", phonetic: "/ˈdiːkɔɪ ˈaɪtəmz/", form: "Noun Phrase", forms: "N/A", def: "Products placed strategically to make other target products look more attractive or reasonably priced.", translation: "Hàng mồi nhử", example: "The highly priced premium wine serves as a decoy item to make the mid-range wine look like a bargain." },
        { topic: "Consumer Psychology", word: "Deter", phonetic: "/dɪˈtɜː(r)/", form: "Verb", forms: "N: Deterrent", def: "To prevent someone from doing something or to make someone less enthusiastic about doing it.", translation: "Ngăn cản, làm nản lòng", example: "High prices deter many young people from buying their first home." },
        { topic: "Consumer Psychology", word: "Pay lip service to", phonetic: "/peɪ ˈlɪp sɜːvɪs tu/", form: "Idiom", forms: "N/A", def: "To say that you agree with something but do nothing to support it.", translation: "Nói đãi bôi, ủng hộ suông", example: "Many companies pay lip service to environmental issues without actually changing their practices." },

        // --- Business & Finance ---
        { topic: "Business & Finance", word: "Asset", phonetic: "/ˈæset/", form: "Noun", forms: "N/A", def: "A useful or valuable quality, skill, or person; property owned by a person or company.", translation: "Tài sản, vốn quý", example: "A company's most valuable asset is often its highly trained workforce." },
        { topic: "Business & Finance", word: "Turnover", phonetic: "/ˈtɜːnəʊvə(r)/", form: "Noun", forms: "N/A", def: "The amount of money that a company takes in over a specific period of time.", translation: "Doanh thu", example: "The small business has an annual turnover of roughly $500,000." },
        { topic: "Business & Finance", word: "Revenue", phonetic: "/ˈrevənjuː/", form: "Noun", forms: "N/A", def: "The income that a government or company receives regularly.", translation: "Nguồn thu, doanh thu", example: "Taxes provide most of the government's revenue." },
        { topic: "Business & Finance", word: "Visibility", phonetic: "/ˌvɪzəˈbɪləti/", form: "Noun", forms: "Adj: Visible", def: "The degree to which something is seen or known about.", translation: "Sự hiện diện, mức độ nhận diện", example: "The company sponsored the marathon to increase its brand visibility." },
        { topic: "Business & Finance", word: "Boost", phonetic: "/buːst/", form: "Verb", forms: "N: Boost", def: "To improve or increase something.", translation: "Thúc đẩy, tăng cường", example: "Lowering interest rates is meant to boost the struggling economy." },

        // --- Personal Finance ---
        { topic: "Personal Finance", word: "A piggy bank", phonetic: "/ə ˈpɪɡi bæŋk/", form: "Noun", forms: "N/A", def: "A small container, usually in the shape of a pig, used by children for saving money.", translation: "Ống heo tiết kiệm", example: "She put all her loose change into her piggy bank." },
        { topic: "Personal Finance", word: "Save for a rainy day", phonetic: "/seɪv fɔːr ə ˈreɪni deɪ/", form: "Idiom", forms: "N/A", def: "To save money for a time when it might be needed unexpectedly in the future.", translation: "Dành dụm phòng khi khó khăn", example: "I got a bonus at work, but I'm going to put it in the bank and save it for a rainy day." },
        { topic: "Personal Finance", word: "Broke", phonetic: "/brəʊk/", form: "Adjective", forms: "N/A", def: "Completely without money (informal).", translation: "Cháy túi, hết tiền", example: "I can't afford to go out for dinner tonight; I'm completely broke." },
        { topic: "Personal Finance", word: "Pocket money", phonetic: "/ˈpɒkɪt ˈmʌni/", form: "Noun", forms: "Syn: Allowance", def: "A small amount of money given regularly to children by their parents.", translation: "Tiền tiêu vặt", example: "He saved his pocket money for months to buy a new video game." },

        { topic: "Attitudes & Actions", word: "Desperate", phonetic: "/ˈdespərət/", form: "Adjective", forms: "N: Desperation", def: "Needing or wanting something very much; feeling that you have no hope and are ready to do anything.", translation: "Tuyệt vọng, liều lĩnh", example: "They are facing a desperate shortage of funding for the new project." },

    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fde047; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">${item.example}</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Custom Toast Notification function to replace alerts
    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        // Hide after 3.5 seconds
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; // Slightly slower for language learning
            
            // Try to find a good British or clear female voice
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Google UK English Female') ||
                voice.name.includes('Daniel')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); // Prevent flipping the card
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        // Update active button styling
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Filter Grid View
        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        // Filter Flashcard View Data if active
        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            // Determine active filter to sync flashcards
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Retail')) topicName = 'Retail & Shopping';
            else if (activeFilterText.includes('Consumer')) topicName = 'Consumer Psychology';
            else if (activeFilterText.includes('Business')) topicName = 'Business & Finance';
            else if (activeFilterText.includes('Personal')) topicName = 'Personal Finance';
            else if (activeFilterText.includes('Value')) topicName = 'Value & Cost';
            else if (activeFilterText.includes('Attitudes')) topicName = 'Attitudes & Actions';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        // Remove flip class if present to reset face before injecting data
        flashcardScene.classList.remove('is-flipped');
        
        // Delay content injection slightly so it happens during/after the flip animation back
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">${data.example}</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    // Initialize application on load
    window.onload = function() {
        renderGrid();
    };

</script>
</body>
</html>
