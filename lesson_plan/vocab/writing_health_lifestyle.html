<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | Health & Lifestyle - Vocabulary Learning</title>
    <style>
        :root {
            /* Theme: Pastel Pink / Light Summer */
            --primary: #ec4899; /* Pink 500 */
            --primary-light: #fce7f3; /* Pink 100 */
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-body: #fdf2f8; /* Pink 50 */
            --card-bg: #ffffff;
            --accent: #be185d; /* Pink 700 */
            --border: #fbcfe8; /* Pink 200 */
            --badge-bg: #f3e8ff; /* Soft Purple */
            --badge-text: #7e22ce;
            --success: #14b8a6; /* Teal/Mint for contrast */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        .copyright-banner { background-color: var(--accent); color: white; text-align: center; padding: 0.8rem 1rem; font-weight: 800; font-size: 1.1rem; letter-spacing: 0.1em; width: 100%; box-shadow: 0 4px 6px rgba(190, 24, 93, 0.2); margin-bottom: 2rem; text-transform: uppercase; }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--accent); font-size: 2.4rem; margin-bottom: 0.5rem; font-weight: 800; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 700; background: var(--card-bg); color: var(--accent); border: 2px solid var(--border); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 6px rgba(236, 72, 153, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 700; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--success); color: white; border-color: var(--success); box-shadow: 0 4px 6px rgba(20, 184, 166, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--success); color: var(--success); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); border: 2px solid var(--primary-light); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(236, 72, 153, 0.15); border-color: var(--border); }
        .vocab-card.hidden { display: none; }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.75rem; }
        .word-main { display: flex; align-items: center; gap: 0.5rem; }
        .word { font-size: 1.4rem; font-weight: 800; color: var(--accent); text-transform: capitalize; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.4rem; border-radius: 50%; transition: transform 0.2s, background-color 0.2s; color: var(--accent); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary-light); }
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        
        .word-families { background-color: var(--badge-bg); border: 1px dashed #d8b4fe; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: var(--badge-text); margin-bottom: 1rem; }
        .word-families strong { color: #6b21a8; }

        .topic-tag { font-size: 0.8rem; color: var(--primary); background: var(--primary-light); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 800; margin-bottom: 1rem; display: inline-block;}
        
        .definition { font-size: 1rem; margin-bottom: 0.25rem; color: var(--text-main); }
        .definition strong { color: var(--accent); }
        
        /* Translation and Usage */
        .translation { font-size: 0.95rem; color: var(--success); margin-bottom: 0.5rem; font-weight: 700; }

        .example-box { background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.35rem; font-weight: 800; }
        .extra-example { background-color: #f8fafc; border-left-color: #94a3b8; margin-top: 0.75rem; }
        .extra-example span { color: #64748b; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 650px; height: 550px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(236, 72, 153, 0.15); border: 4px solid white; background: var(--card-bg); padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 2.8rem; margin-bottom: 1rem; color: var(--accent); text-transform: capitalize; font-weight: 800;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .flashcard-front .audio-btn { font-size: 2rem; background: var(--primary-light); padding: 0.8rem; }
        .flashcard-front .phonetic { font-size: 1.3rem; color: var(--text-muted); font-style: italic; }
        .flashcard-back { transform: rotateY(180deg); background: var(--bg-body); align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--accent); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        
        .flashcard-back .definition { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.1rem; margin-bottom: 1rem; color: var(--success); font-weight: 700;}
        .flashcard-back .example-box { width: 100%; font-size: 1rem; padding: 1rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--accent); font-size: 1rem; font-weight: 800; cursor: pointer; padding: 0.5rem 1.2rem; border-radius: 20px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.1rem; color: var(--success); min-width: 70px; text-align: center; }

        @media (max-width: 768px) { 
            h1 { font-size: 1.8rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 620px; } 
            .flashcard-front .word { font-size: 2.2rem; } 
            .flashcard-back .definition { font-size: 1rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="copyright-banner">&copy; IELTS Chan Truong</div>

<div class="container">
    <header>
        <h1>Writing | Health & Lifestyle</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; font-weight: 600;">Target Band 6.5 - 7.5+ | Vocabulary Builder</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Diet & Nutrition')">Diet & Nutrition</button>
        <button class="filter-btn" onclick="filterTopic('Physical & Mental Health')">Physical & Mental Health</button>
        <button class="filter-btn" onclick="filterTopic('Public Health & Society')">Public Health & Society</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcard Study</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 80%;">Families</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic: General</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning & Usage</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 41</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: #fbcfe8; margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Writing | Health & Lifestyle)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- CATEGORY 1: Diet & Nutrition ---
        { topic: "Diet & Nutrition", word: "Obesity", phonetic: "/əʊˈbiːsəti/", form: "Noun", forms: "Adj: Obese", def: "The state of being grossly fat or overweight.", translation: "Bệnh béo phì", example: "Childhood obesity has become a pressing issue in many developed nations.", extraExample: "The doctor warned him that obesity could lead to serious heart conditions." },
        { topic: "Diet & Nutrition", word: "Malnutrition", phonetic: "/ˌmælnjʊˈtrɪʃn/", form: "Noun", forms: "Adj: Malnourished", def: "Lack of proper nutrition, caused by not having enough to eat or not eating the right things.", translation: "Sự suy dinh dưỡng", example: "In impoverished regions, malnutrition remains a primary cause of high infant mortality.", extraExample: "The refugee camp suffered from severe malnutrition and a lack of clean water." },
        { topic: "Diet & Nutrition", word: "Metabolism", phonetic: "/məˈtæbəlɪzəm/", form: "Noun", forms: "Adj: Metabolic | V: Metabolize", def: "The chemical processes that occur within a living organism in order to maintain life.", translation: "Sự trao đổi chất", example: "Regular cardiovascular exercise is proven to significantly boost one's metabolism.", extraExample: "As people age, their metabolism naturally begins to slow down." },
        { topic: "Diet & Nutrition", word: "Additive", phonetic: "/ˈædətɪv/", form: "Noun", forms: "V: Add | N: Addition", def: "A substance added to something in small quantities, typically to improve or preserve it.", translation: "Chất phụ gia", example: "Many processed foods contain chemical additives that can be detrimental to health.", extraExample: "This organic juice contains absolutely no artificial additives or preservatives." },
        { topic: "Diet & Nutrition", word: "Nutrient", phonetic: "/ˈnjuːtriənt/", form: "Noun", forms: "Adj: Nutritious | N: Nutrition", def: "A substance that provides nourishment essential for growth and the maintenance of life.", translation: "Chất dinh dưỡng", example: "A balanced diet must provide all the essential nutrients required for healthy growth.", extraExample: "Broccoli and spinach are packed with essential vitamins and nutrients." },
        { topic: "Diet & Nutrition", word: "A balanced diet", phonetic: "/ə ˈbælənst ˈdaɪət/", form: "Noun Phrase", forms: "N/A", def: "A diet consisting of a variety of different types of food and providing adequate amounts of nutrients.", translation: "Chế độ ăn uống cân bằng", example: "Maintaining a balanced diet is arguably the most effective way to prevent chronic diseases.", extraExample: "She ensures her children eat a balanced diet with plenty of greens." },
        { topic: "Diet & Nutrition", word: "Processed foods", phonetic: "/ˈprəʊsest fuːdz/", form: "Noun Phrase", forms: "V: Process", def: "Foods that have been altered from their natural state, usually for safety or convenience.", translation: "Thực phẩm chế biến sẵn", example: "An overreliance on processed foods is a leading factor in the modern obesity epidemic.", extraExample: "He decided to cut out processed foods and only eat fresh, whole ingredients." },
        { topic: "Diet & Nutrition", word: "Dietary habits", phonetic: "/ˈdaɪətəri ˈhæbɪts/", form: "Noun Phrase", forms: "N: Diet", def: "The customary decisions an individual makes regarding what foods they eat.", translation: "Thói quen ăn uống", example: "Poor dietary habits adopted in childhood often persist into adulthood.", extraExample: "Changing your dietary habits is the first step toward long-term weight loss." },
        { topic: "Diet & Nutrition", word: "High in saturated fats", phonetic: "/haɪ ɪn ˈsætʃəreɪtɪd fæts/", form: "Phrase", forms: "N: Saturation", def: "Containing a high amount of a type of fat containing a high proportion of fatty acid molecules (usually from animal products).", translation: "Chứa lượng chất béo bão hòa cao", example: "Diets high in saturated fats are universally recognized as a major risk factor for strokes.", extraExample: "Fast food is notoriously high in saturated fats and sodium." },
        { topic: "Diet & Nutrition", word: "To cut down on", phonetic: "/tuː kʌt daʊn ɒn/", form: "Phrasal Verb", forms: "N/A", def: "To reduce the amount or quantity of something consumed.", translation: "Cắt giảm (lượng tiêu thụ)", example: "Health experts strongly advise citizens to cut down on sugar to mitigate diabetes risks.", extraExample: "I am trying to cut down on caffeine by drinking decaf coffee." },
        { topic: "Diet & Nutrition", word: "Caloric intake", phonetic: "/kəˈlɒrɪk ˈɪnteɪk/", form: "Noun Phrase", forms: "N: Calorie", def: "The total number of calories a person consumes daily.", translation: "Lượng calo nạp vào", example: "Individuals should closely monitor their daily caloric intake to prevent excessive weight gain.", extraExample: "Athletes require a much higher caloric intake than the average person." },

        // --- CATEGORY 2: Physical & Mental Health ---
        { topic: "Physical & Mental Health", word: "Sedentary", phonetic: "/ˈsedntri/", form: "Adjective", forms: "N/A", def: "Tending to spend much time seated; somewhat inactive.", translation: "Ít vận động, ngồi nhiều", example: "Modern technology has contributed to an increasingly sedentary lifestyle among office workers.", extraExample: "He decided to join a gym to combat his sedentary habits." },
        { topic: "Physical & Mental Health", word: "Susceptible", phonetic: "/səˈseptəbl/", form: "Adjective", forms: "N: Susceptibility", def: "Likely or liable to be influenced or harmed by a particular thing.", translation: "Dễ bị tổn thương, dễ mắc bệnh", example: "Elderly people are particularly susceptible to respiratory infections during winter.", extraExample: "Lack of sleep makes you more susceptible to catching a cold." },
        { topic: "Physical & Mental Health", word: "Chronic", phonetic: "/ˈkrɒnɪk/", form: "Adjective", forms: "Adv: Chronically", def: "(Of an illness) persisting for a long time or constantly recurring.", translation: "Mãn tính, kinh niên", example: "The healthcare system is struggling to cope with the rise in chronic illnesses such as asthma.", extraExample: "He has been suffering from chronic back pain for over a decade." },
        { topic: "Physical & Mental Health", word: "Alleviate", phonetic: "/əˈliːvieɪt/", form: "Verb", forms: "N: Alleviation", def: "Make (suffering, deficiency, or a problem) less severe.", translation: "Làm giảm bớt, xoa dịu", example: "Regular yoga and meditation can effectively alleviate symptoms of mental stress.", extraExample: "The doctor prescribed painkillers to alleviate her immediate discomfort." },
        { topic: "Physical & Mental Health", word: "Rejuvenate", phonetic: "/rɪˈdʒuːvəneɪt/", form: "Verb", forms: "N: Rejuvenation", def: "Make (someone or something) look or feel younger, fresher, or more lively.", translation: "Làm trẻ hóa, phục hồi năng lượng", example: "Taking a short holiday can help rejuvenate employees and increase their subsequent productivity.", extraExample: "The spa treatment left her feeling completely relaxed and rejuvenated." },
        { topic: "Physical & Mental Health", word: "Vigorous", phonetic: "/ˈvɪɡərəs/", form: "Adjective", forms: "N: Vigor | Adv: Vigorously", def: "Strong, healthy, and full of energy; characterized by or involving physical strength, effort, or energy.", translation: "Mạnh mẽ, mãnh liệt (thể chất)", example: "A minimum of thirty minutes of vigorous exercise daily is recommended for optimal health.", extraExample: "He gave the dirty carpet a vigorous scrubbing." },
        { topic: "Physical & Mental Health", word: "Immunity", phonetic: "/ɪˈmjuːnəti/", form: "Noun", forms: "Adj: Immune | V: Immunize", def: "The ability of an organism to resist a particular infection or toxin.", translation: "Hệ miễn dịch, khả năng miễn dịch", example: "A diet rich in vitamins is essential for boosting the body's natural immunity.", extraExample: "The vaccine provides lifelong immunity against the virus." },
        { topic: "Physical & Mental Health", word: "Ailment", phonetic: "/ˈeɪlmənt/", form: "Noun", forms: "N/A", def: "An illness, typically a minor one.", translation: "Căn bệnh, sự ốm đau", example: "Minor ailments can easily escalate into serious conditions if left untreated.", extraExample: "Ginger and honey tea is a traditional remedy for winter ailments." },
        { topic: "Physical & Mental Health", word: "Vitality", phonetic: "/vaɪˈtæləti/", form: "Noun", forms: "Adj: Vital", def: "The state of being strong and active; energy.", translation: "Sinh khí, sức sống", example: "Engaging in outdoor sports significantly enhances both the physical and mental vitality of children.", extraExample: "Despite her old age, she retains an incredible sense of vitality." },
        { topic: "Physical & Mental Health", word: "To lead a sedentary lifestyle", phonetic: "/tuː liːd ə ˈsedntri ˈlaɪfstaɪl/", form: "Phrase", forms: "N/A", def: "To live a life that involves sitting down a lot and little exercise.", translation: "Sống một lối sống ít vận động", example: "It is undeniable that leading a sedentary lifestyle is a primary cause of cardiovascular issues.", extraExample: "Since working from home, she has started to lead a dangerously sedentary lifestyle." },
        { topic: "Physical & Mental Health", word: "To suffer from chronic diseases", phonetic: "/tuː ˈsʌfə frɒm ˈkrɒnɪk dɪˈziːzɪz/", form: "Phrase", forms: "N/A", def: "To experience long-lasting medical conditions.", translation: "Mắc các bệnh mãn tính", example: "An aging population means more citizens will inevitably suffer from chronic diseases.", extraExample: "My grandfather suffers from chronic diseases that require daily medication." },
        { topic: "Physical & Mental Health", word: "To build up resistance to", phonetic: "/tuː bɪld ʌp rɪˈzɪstəns tuː/", form: "Phrase", forms: "V: Resist", def: "To gradually develop the body's ability to fight off illnesses.", translation: "Tăng cường sức đề kháng với", example: "Children playing outdoors helps them build up resistance to common pathogens.", extraExample: "Vaccines help the body build up resistance to dangerous viruses." },
        { topic: "Physical & Mental Health", word: "To be susceptible to illness", phonetic: "/tuː bi səˈseptəbl tuː ˈɪlnəs/", form: "Phrase", forms: "N/A", def: "To be highly likely to get sick.", translation: "Dễ bị mắc bệnh", example: "Those who lack sufficient sleep are far more susceptible to illness.", extraExample: "Working in a damp, cold environment makes you more susceptible to illness." },
        { topic: "Physical & Mental Health", word: "Psychological well-being", phonetic: "/ˌsaɪkəˈlɒdʒɪkl ˌwelˈbiːɪŋ/", form: "Noun Phrase", forms: "N/A", def: "The overall state of one's mental and emotional health.", translation: "Sự khỏe mạnh về tâm lý", example: "Employers must recognize that their staff's psychological well-being is vital to company success.", extraExample: "Regular social interaction is crucial for maintaining your psychological well-being." },

        // --- CATEGORY 3: Public Health & Society ---
        { topic: "Public Health & Society", word: "Detrimental", phonetic: "/ˌdetrɪˈmentl/", form: "Adjective", forms: "N: Detriment", def: "Tending to cause harm.", translation: "Gây hại, có hại", example: "Smoking has a highly detrimental effect on the respiratory system.", extraExample: "Too much screen time can be detrimental to a child's eyesight." },
        { topic: "Public Health & Society", word: "Epidemic", phonetic: "/ˌepɪˈdemɪk/", form: "Noun", forms: "N/A", def: "A widespread occurrence of an infectious disease (or a bad habit) in a community at a particular time.", translation: "Đại dịch, sự lan tràn (nghĩa bóng)", example: "Governments must take immediate action to curb the current epidemic of youth obesity.", extraExample: "The city was struck by a severe flu epidemic last winter." },
        { topic: "Public Health & Society", word: "Preventive", phonetic: "/prɪˈventɪv/", form: "Adjective", forms: "V: Prevent | N: Prevention", def: "Designed to keep something undesirable such as illness, harm, or accidents from occurring.", translation: "Phòng ngừa", example: "Investing in preventive medicine is far more cost-effective than treating advanced diseases.", extraExample: "Regular dental check-ups are an important preventive measure." },
        { topic: "Public Health & Society", word: "Regimen", phonetic: "/ˈredʒɪmən/", form: "Noun", forms: "N/A", def: "A prescribed course of medical treatment, way of life, or diet for the promotion or restoration of health.", translation: "Phác đồ, chế độ (ăn uống/tập luyện)", example: "Following a strict daily regimen of diet and exercise is crucial for diabetics.", extraExample: "The athlete's training regimen requires him to wake up at 5 AM every day." },

    // --- DOM Injection ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Word Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Definition:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Writing Context</span>"${item.example}"
                </div>
                <div class="example-box extra-example">
                    <span>General Example</span>"${item.extraExample}"
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    // --- Audio Synthesis ---
    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    // --- Topic Filtering ---
    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    // --- View Toggling ---
    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Diet')) topicName = 'Diet & Nutrition';
            if (activeFilter.includes('Physical')) topicName = 'Physical & Mental Health';
            if (activeFilter.includes('Public')) topicName = 'Public Health & Society';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    // --- Flashcard Logic ---
    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="word-families" style="margin-bottom: 1rem; width: 100%; text-align: center; border: 1px dashed #fbcfe8; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #9d174d;">
                    <strong style="color: #be185d;">Word Forms:</strong> ${data.forms}
                </div>
                <div class="example-box" style="margin-bottom: 0.5rem; background-color: #fce7f3; padding: 1rem; border-left: 4px solid #ec4899; border-radius: 8px; font-size: 0.95rem; color: #334155;">
                    <span style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #be185d; margin-bottom: 0.35rem; font-weight: 800;">Writing Context</span>"${data.example}"
                </div>
                <div class="example-box extra-example" style="background-color: #f8fafc; padding: 1rem; border-left: 4px solid #94a3b8; border-radius: 8px; font-size: 0.95rem; color: #334155;">
                    <span style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.35rem; font-weight: 800;">General Example</span>"${data.extraExample}"
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
