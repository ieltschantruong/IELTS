<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Chan Truong | Listening Practice | Water Hyacinth Nanotech</title>
    <style>
        :root {
            /* Theme: Minimalist Light Summer / Sweet Candy Purple & Pastel Pink */
            --primary: #c084fc; /* Candy Purple */
            --primary-light: #f3e8ff;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-body: #faf5ff;
            --card-bg: #ffffff;
            --accent: #a855f7;
            --border: #e9d5ff;
            --badge-bg: #fce7f3; /* Pastel Pink */
            --badge-text: #db2777;
            --success: #f472b6; /* Soft Pink */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        .header-banner { background-color: var(--card-bg); color: var(--accent); text-align: center; padding: 1rem; font-weight: 800; font-size: 1.2rem; letter-spacing: 0.15em; width: 100%; border-bottom: 3px solid var(--border); margin-bottom: 2rem; text-transform: uppercase; box-shadow: 0 2px 10px rgba(192, 132, 252, 0.1);}
        .copyright-banner { background-color: var(--accent); color: white; text-align: center; padding: 0.6rem 1rem; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.05em; width: 100%; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(168, 85, 247, 0.2); }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--accent); font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 600; background: var(--card-bg); color: var(--accent); border: 2px solid var(--border); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 6px rgba(192, 132, 252, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--success); color: white; border-color: var(--success); box-shadow: 0 4px 6px rgba(244, 114, 182, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--success); color: var(--success); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); border: 1px solid #fdf4ff; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(192, 132, 252, 0.15); border-color: var(--border); }
        .vocab-card.hidden { display: none; }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.75rem; }
        .word-main { display: flex; align-items: center; gap: 0.5rem; }
        .word { font-size: 1.4rem; font-weight: 800; color: var(--accent); text-transform: capitalize; }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.4rem; border-radius: 50%; transition: transform 0.2s, background-color 0.2s; color: var(--accent); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary-light); }
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        
        .word-families { background-color: #fdf2f8; border: 1px dashed #fbcfe8; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #9d174d; margin-bottom: 1rem; }
        .word-families strong { color: #be185d; }

        .topic-tag { font-size: 0.8rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; margin-bottom: 1rem; display: inline-block;}
        
        .definition { font-size: 1rem; margin-bottom: 0.25rem; color: var(--text-main); }
        .definition strong { color: var(--accent); }
        
        /* Translation and Usage */
        .translation { font-size: 0.95rem; color: var(--success); margin-bottom: 0.5rem; font-weight: 600; }

        .example-box { background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.35rem; font-weight: 800; }
        .extra-example { background-color: #f8fafc; border-left-color: #94a3b8; margin-top: 0.75rem; }
        .extra-example span { color: #64748b; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 650px; height: 550px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(192, 132, 252, 0.15); border: 2px solid #fdf4ff; background: var(--card-bg); padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 2.8rem; margin-bottom: 1rem; color: var(--accent); text-transform: capitalize; font-weight: 800;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .flashcard-front .audio-btn { font-size: 2rem; background: var(--primary-light); padding: 0.8rem; }
        .flashcard-front .phonetic { font-size: 1.3rem; color: var(--text-muted); font-style: italic; }
        .flashcard-back { transform: rotateY(180deg); background: #faf5ff; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--accent); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        
        .flashcard-back .definition { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.1rem; margin-bottom: 1rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; font-size: 1rem; padding: 1rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--accent); font-size: 1rem; font-weight: 700; cursor: pointer; padding: 0.5rem 1.2rem; border-radius: 20px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.1rem; color: var(--success); min-width: 70px; text-align: center; }

        @media (max-width: 768px) { 
            h1 { font-size: 1.8rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 620px; } 
            .flashcard-front .word { font-size: 2.2rem; } 
            .flashcard-back .definition { font-size: 1rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="header-banner">Academic Training</div>
<div class="copyright-banner">&copy; IELTS Chan Truong</div>

<div class="container">
    <header>
        <h1>Listening Practice | Water Hyacinth Nanotech</h1>
    </header>

    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Ecology & Environment')">Ecology & Environment</button>
        <button class="filter-btn" onclick="filterTopic('Negative Impacts & Challenges')">Negative Impacts & Challenges</button>
        <button class="filter-btn" onclick="filterTopic('Solutions & Agriculture')">Solutions & Agriculture</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcard Study</button>
    </div>

    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 80%;">Families</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic: General</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning & Usage</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 32</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: #e9d5ff; margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <main id="grid-view">
        </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank
    // ---------------------------------------------------------
    const vocabBank = [
        // --- CATEGORY 1: Ecology & Environment ---
        { topic: "Ecology & Environment", word: "Invasive", phonetic: "/ɪnˈveɪ.sɪv/", form: "Adjective", forms: "N: Invasion | V: Invade", def: "Tending to spread very quickly and undesirably or harmfully.", translation: "Xâm lấn, có tính xâm lược", example: "The water hyacinth, as the world's worst invasive aquatic plant, has attracted significant attention.", extraExample: "The government is trying to stop the spread of invasive species in the national park." },
        { topic: "Ecology & Environment", word: "Aquatic", phonetic: "/əˈkwæt.ɪk/", form: "Adjective", forms: "N/A", def: "Relating to water; living in or near water.", translation: "Sống dưới nước, thủy sinh", example: "The water hyacinth, as the world's worst invasive aquatic plant...", extraExample: "Dolphins and whales are examples of intelligent aquatic mammals." },
        { topic: "Ecology & Environment", word: "Habitat", phonetic: "/ˈhæb.ɪ.tæt/", form: "Noun", forms: "N: Habitation", def: "The natural home or environment of an animal, plant, or other organism.", translation: "Môi trường sống", example: "What kind of habitat does water hyacinth thrive most in?", extraExample: "The destruction of their natural habitat threatens the survival of wild tigers." },
        { topic: "Ecology & Environment", word: "Thrive", phonetic: "/θraɪv/", form: "Verb", forms: "Adj: Thriving", def: "To grow, develop, or be successful.", translation: "Phát triển mạnh, sinh sôi", example: "What kind of habitat does water hyacinth thrive most in?", extraExample: "Children will thrive when they are given a loving and supportive environment." },
        { topic: "Ecology & Environment", word: "Proliferation", phonetic: "/prəˌlɪf.əˈreɪ.ʃən/", form: "Noun", forms: "V: Proliferate", def: "Rapid increase in the number or amount of something.", translation: "Sự gia tăng nhanh chóng, sinh sôi nảy nở", example: "...contributes significantly to the rapid proliferation of this weed...", extraExample: "The sudden proliferation of smartphones has changed how we communicate." },
        { topic: "Ecology & Environment", word: "Deforestation", phonetic: "/diːˌfɒr.ɪˈsteɪ.ʃən/", form: "Noun", forms: "V: Deforest", def: "The action of clearing a wide area of trees.", translation: "Nạn phá rừng", example: "Excessive deforestation accelerates soil erosion...", extraExample: "Deforestation in the Amazon rainforest is a major contributor to climate change." },
        { topic: "Ecology & Environment", word: "Erosion", phonetic: "/ɪˈrəʊ.ʒən/", form: "Noun", forms: "V: Erode", def: "The process of eroding or being eroded by wind, water, or other natural agents.", translation: "Sự xói mòn", example: "Excessive deforestation accelerates soil erosion, which indirectly compounds this issue.", extraExample: "The cliffs have suffered from severe coastal erosion over the last century." },
        { topic: "Ecology & Environment", word: "Density", phonetic: "/ˈden.sɪ.ti/", form: "Noun", forms: "Adj: Dense", def: "The degree of compactness of a substance.", translation: "Mật độ", example: "...it takes time for this external insect species to reach a density sufficient enough to affect ecological development.", extraExample: "The population density in the city center is incredibly high." },
        { topic: "Ecology & Environment", word: "Fibrous", phonetic: "/ˈfaɪ.brəs/", form: "Adjective", forms: "N: Fibre", def: "Consisting of or characterized by fibers.", translation: "Có sợi, dạng sợi", example: "The plant itself... has a fibrous tissue and a high energy and protein content...", extraExample: "Vegetables like celery and carrots are very fibrous and good for digestion." },
        { topic: "Ecology & Environment", word: "Sufficient", phonetic: "/səˈfɪʃ.ənt/", form: "Adjective", forms: "N: Sufficiency | Adv: Sufficiently", def: "Enough; adequate.", translation: "Đủ, đầy đủ", example: "...to reach a density sufficient enough to affect ecological development.", extraExample: "Please make sure you have sufficient water before starting the hike." },

        // --- CATEGORY 2: Negative Impacts & Challenges ---
        { topic: "Negative Impacts & Challenges", word: "Intertwined", phonetic: "/ˌɪn.təˈtwaɪnd/", form: "Adjective", forms: "V: Intertwine", def: "Twisted or joined together closely.", translation: "Quấn vào nhau, bện vào nhau", example: "Turbines of the power station are often shut down because of the intertwined leaves.", extraExample: "The tree branches were tightly intertwined, making a natural roof." },
        { topic: "Negative Impacts & Challenges", word: "Cease", phonetic: "/siːs/", form: "Verb", forms: "N: Cessation", def: "To stop happening or existing; to bring or come to an end.", translation: "Ngừng, chấm dứt", example: "Dams often cease to function as a result, severely restricting the electricity generation.", extraExample: "The company ceased operations after running out of funding." },
        { topic: "Negative Impacts & Challenges", word: "Restrict", phonetic: "/rɪˈstrɪkt/", form: "Verb", forms: "N: Restriction | Adj: Restrictive", def: "Put a limit on; keep under control.", translation: "Hạn chế, thu hẹp", example: "...Dams often cease to function as a result, severely restricting the electricity generation.", extraExample: "The new diet strictly restricts the consumption of sugary drinks." },
        { topic: "Negative Impacts & Challenges", word: "Infest", phonetic: "/ɪnˈfest/", form: "Verb", forms: "N: Infestation", def: "To be present in large numbers, typically so as to cause damage or disease.", translation: "Phá hoại, tràn ngập", example: "Since the nineteen hundreds, this weed has infested lakes, rivers, and creeks...", extraExample: "The abandoned house was infested with rats and insects." },
        { topic: "Negative Impacts & Challenges", word: "Disastrous", phonetic: "/dɪˈzɑː.strəs/", form: "Adjective", forms: "N: Disaster | Adv: Disastrously", def: "Causing great damage.", translation: "Tai hại, thảm khốc", example: "I guess whoever introduced this plant had never expected the disastrous impact it would have...", extraExample: "The decision to launch the product early had a disastrous effect on sales." },
        { topic: "Negative Impacts & Challenges", word: "Compound", phonetic: "/kəmˈpaʊnd/", form: "Verb", forms: "N: Compound", def: "Make (something bad) worse; intensify the negative aspects of.", translation: "Làm phức tạp thêm, làm tồi tệ hơn", example: "This is normally compounded with a decrease of nutrients along the river banks.", extraExample: "His financial problems were compounded when he lost his job." },
        { topic: "Negative Impacts & Challenges", word: "Excessive", phonetic: "/ɪkˈses.ɪv/", form: "Adjective", forms: "N: Excess | Adv: Excessively", def: "More than is necessary, normal, or desirable; immoderate.", translation: "Quá mức, thái quá", example: "Excessive deforestation accelerates soil erosion...", extraExample: "The police used excessive force to control the peaceful crowd." },
        { topic: "Negative Impacts & Challenges", word: "Accelerate", phonetic: "/əkˈsel.ə.reɪt/", form: "Verb", forms: "N: Acceleration", def: "Begin to move more quickly; increase in rate, amount, or extent.", translation: "Tăng tốc, thúc đẩy", example: "Excessive deforestation accelerates soil erosion...", extraExample: "The car can accelerate from 0 to 60 mph in just four seconds." },
        { topic: "Negative Impacts & Challenges", word: "Aggravate", phonetic: "/ˈæɡ.rə.veɪt/", form: "Verb", forms: "N: Aggravation", def: "Make (a problem, injury, or offense) worse or more serious.", translation: "Làm trầm trọng thêm", example: "...frequent rain might partly aggravate this by carrying some of the nutrients into the waterways.", extraExample: "Scratching the rash will only aggravate the skin condition." },
        { topic: "Negative Impacts & Challenges", word: "Unforeseen", phonetic: "/ˌʌn.fɔːˈsiːn/", form: "Adjective", forms: "V: Foresee", def: "Not anticipated or predicted.", translation: "Không lường trước được", example: "The side effects of this method on local ecology will remain unforeseen for years...", extraExample: "Due to unforeseen circumstances, the concert has been cancelled." },
        { topic: "Negative Impacts & Challenges", word: "Inefficient", phonetic: "/ˌɪn.ɪˈfɪʃ.ənt/", form: "Adjective", forms: "N: Inefficiency | Adv: Inefficiently", def: "Not achieving maximum productivity; wasting or failing to make the best use of time or resources.", translation: "Kém hiệu quả", example: "It is, however, inefficient for workers to process extensive areas...", extraExample: "The old heating system is highly inefficient and costs too much to run." },

        // --- CATEGORY 3: Solutions & Agriculture ---
        { topic: "Solutions & Agriculture", word: "Originate", phonetic: "/əˈrɪdʒ.ən.eɪt/", form: "Verb", forms: "N: Origin | Adj: Original", def: "Have a specified beginning; create or initiate (something).", translation: "Bắt nguồn, khởi phát", example: "So where did water hyacinth originate from?", extraExample: "The popular game originated in ancient China." },
        { topic: "Solutions & Agriculture", word: "Ornamental", phonetic: "/ˌɔː.nəˈmen.təl/", form: "Adjective", forms: "N: Ornament", def: "Serving or intended as an ornament; decorative.", translation: "Để trang trí, làm cảnh", example: "Later, it was introduced into Europe and Africa as an ornamental garden pond plant...", extraExample: "The sword was purely ornamental and never used in combat." },
        { topic: "Solutions & Agriculture", word: "Eradicate", phonetic: "/ɪˈræd.ɪ.keɪt/", form: "Verb", forms: "N: Eradication", def: "Destroy completely; put an end to.", translation: "Diệt trừ, xóa bỏ", example: "Are there any effective measures to control or even eradicate this weed?", extraExample: "The global vaccination program aims to eradicate the disease completely." },
        { topic: "Solutions & Agriculture", word: "Dredge", phonetic: "/dredʒ/", form: "Verb", forms: "N: Dredging", def: "Clear the bed of (a harbor, river, or other area of water) by scooping out mud, weeds, and rubbish.", translation: "Nạo vét", example: "...costly to use large cutting and dredging equipment.", extraExample: "The local council had to dredge the canal to allow boats to pass safely." },
        { topic: "Solutions & Agriculture", word: "Ironically", phonetic: "/aɪˈrɒn.ɪ.kəl.i/", form: "Adverb", forms: "N: Irony | Adj: Ironic", def: "In a way that is contrary to what is expected or intended.", translation: "Trớ trêu thay, mỉa mai thay", example: "Ironically, it costs even more to dispose of this plant than to remove it.", extraExample: "Ironically, the fire station was the building that burned down." },
        { topic: "Solutions & Agriculture", word: "Dispose of", phonetic: "/dɪˈspəʊz əv/", form: "Phrasal Verb", forms: "N: Disposal", def: "Get rid of by throwing away or giving or selling to someone else.", translation: "Vứt bỏ, xử lý", example: "Ironically, it costs even more to dispose of this plant than to remove it.", extraExample: "You must safely dispose of the chemical waste." },
        { topic: "Solutions & Agriculture", word: "Yield", phonetic: "/jiːld/", form: "Noun", forms: "V: Yield", def: "Produce or provide (a natural, agricultural, or industrial product).", translation: "Sản lượng, hoa lợi", example: "It can grow crops with increased yield.", extraExample: "The new fertilizer significantly improved the wheat yield this year." },
        { topic: "Solutions & Agriculture", word: "Edible", phonetic: "/ˈed.ə.bəl/", form: "Adjective", forms: "N/A", def: "Fit to be eaten (often used to contrast with poisonous varieties).", translation: "Có thể ăn được", example: "In India, attempts have been made to grow these types of edible mushrooms...", extraExample: "Make sure you only pick the mushrooms that are edible." },
        { topic: "Solutions & Agriculture", word: "Organically", phonetic: "/ɔːˈɡæn.ɪ.kəl.i/", form: "Adverb", forms: "Adj: Organic", def: "Without the use of artificial fertilizers or pesticides.", translation: "Một cách hữu cơ", example: "...attempts have been made to grow these types of edible mushrooms organically...", extraExample: "The farm grows all of its vegetables organically to protect the environment." },
        { topic: "Solutions & Agriculture", word: "Urgent", phonetic: "/ˈɜː.dʒənt/", form: "Adjective", forms: "N: Urgency | Adv: Urgently", def: "Requiring immediate action or attention.", translation: "Khẩn cấp, cấp bách", example: "...developing alternative sources of energy will be more urgent than ever.", extraExample: "The patient is in critical condition and needs urgent medical attention." },
        { topic: "Solutions & Agriculture", word: "Alternative", phonetic: "/ɒlˈtɜː.nə.tɪv/", form: "Adjective", forms: "N: Alternative", def: "Available as another possibility or choice.", translation: "Thay thế, có thể lựa chọn", example: "The mixture can be used as alternative soil rather than fertilizer.", extraExample: "We had to find an alternative route because the main road was flooded." }
    ];

    // --- DOM Injection ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Word Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Definition:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Listening Context</span>"${item.example}"
                </div>
                <div class="example-box extra-example">
                    <span>General Example</span>"${item.extraExample}"
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    // --- Audio Synthesis ---
    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    // --- Topic Filtering ---
    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    // --- View Toggling ---
    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Ecology')) topicName = 'Ecology & Environment';
            if (activeFilter.includes('Negative')) topicName = 'Negative Impacts & Challenges';
            if (activeFilter.includes('Solutions')) topicName = 'Solutions & Agriculture';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    // --- Flashcard Logic ---
    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="word-families" style="margin-bottom: 1rem; width: 100%; text-align: center; border: 1px dashed #fbcfe8; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #9d174d;">
                    <strong style="color: #be185d;">Word Forms:</strong> ${data.forms}
                </div>
                <div class="example-box" style="margin-bottom: 0.5rem; background-color: #f3e8ff; padding: 1rem; border-left: 4px solid #a855f7; border-radius: 8px; font-size: 0.95rem; color: #334155;">
                    <span style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #a855f7; margin-bottom: 0.35rem; font-weight: 800;">Listening Context</span>"${data.example}"
                </div>
                <div class="example-box extra-example" style="background-color: #f8fafc; padding: 1rem; border-left: 4px solid #94a3b8; border-radius: 8px; font-size: 0.95rem; color: #334155;">
                    <span style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.35rem; font-weight: 800;">General Example</span>"${data.extraExample}"
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
</html>
