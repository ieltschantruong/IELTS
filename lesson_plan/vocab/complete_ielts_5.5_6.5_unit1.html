<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 1 - Vocabulary</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Soft Pastel Lavender & Pink */
            --primary: #8b5cf6; /* Violet 500 */
            --primary-light: #ede9fe; /* Violet 100 */
            --primary-hover: #7c3aed; /* Violet 600 */
            --text-main: #475569; /* Slate 600 */
            --text-muted: #94a3b8; /* Slate 400 */
            --bg-body: #faf5ff; /* Fuchsia 50 - Very light pastel background */
            --card-bg: #ffffff;
            --accent: #f472b6; /* Pink 400 */
            --accent-light: #fce7f3; /* Pink 100 */
            --border: #e9d5ff; /* Purple 200 */
            --badge-bg: #fef08a; /* Yellow 200 */
            --badge-text: #b45309; /* Amber 700 */
            --success: #38bdf8; /* Light Sky Blue for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2rem; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800; font-family: var(--font-headings); }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.95rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary-light); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: var(--font-body); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(244, 114, 182, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.8rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.8rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(139, 92, 246, 0.15); border-color: var(--primary-light); }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.8rem; }
        .word-main { display: flex; align-items: center; gap: 0.8rem; }
        .word { font-size: 1.6rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { background: var(--primary-light); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; transition: all 0.2s ease; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4); }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { background-color: #f8fafc; border: 1px dashed #cbd5e1; padding: 0.6rem; border-radius: 8px; font-size: 0.9rem; color: #475569; margin-bottom: 1rem; line-height: 1.4; }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { font-size: 0.75rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 700; margin-bottom: 1rem; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em;}
        
        .definition { font-size: 1.05rem; margin-bottom: 0.4rem; color: var(--text-main); font-weight: 500; }
        .definition strong { color: var(--primary); }
        .translation { font-size: 1rem; color: var(--success); margin-bottom: 1rem; font-weight: 600; }

        .example-box { background-color: var(--accent-light); padding: 1.2rem; border-left: 4px solid var(--accent); border-radius: 8px; margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.35rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.35rem; color: #be185d; line-height: 1.4; }

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 700px; height: 580px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 15px 35px rgba(139, 92, 246, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.2rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings);}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; }
        .flashcard-front .audio-btn { width: 50px; height: 50px; }
        .flashcard-front .audio-btn svg { width: 24px; height: 24px; }
        .flashcard-front .phonetic { font-size: 1.4rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.15rem; margin-bottom: 1.5rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.2rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2.5rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 0.6rem 1.5rem; border-radius: 25px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.2rem; color: var(--accent); min-width: 80px; text-align: center; font-family: var(--font-headings); }

        @media (max-width: 768px) { 
            h1 { font-size: 2rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.5rem; } 
            .flashcard-back .definition { font-size: 1.05rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 1</h1>
        <p class="subtitle">Starting Somewhere New</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Adaptation & Perception')">Adaptation & Perception</button>
        <button class="filter-btn" onclick="filterTopic('Migration & Demographics')">Migration</button>
        <button class="filter-btn" onclick="filterTopic('Career & Ambition')">Career & Ambition</button>
        <button class="filter-btn" onclick="filterTopic('Travel & Lifestyle')">Travel & Lifestyle</button>
        <button class="filter-btn" onclick="filterTopic('Housing & Environment')">Housing & Environment</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Phrases')">Idioms & Phrases</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fbcfe8; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 1)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Adaptation & Perception (Reading) ---
        { topic: "Adaptation & Perception", word: "Conduct", phonetic: "/kənˈdʌkt/", form: "Verb", forms: "N: Conductor", def: "To organize and perform a particular activity.", translation: "Tiến hành, thực hiện", example: "The researchers are conducting a survey to understand immigrant experiences." },
        { topic: "Adaptation & Perception", word: "Resent", phonetic: "/rɪˈzent/", form: "Verb", forms: "N: Resentment | Adj: Resentful", def: "To feel bitter or angry about something, especially because you feel it is unfair.", translation: "Bực tức, phẫn nộ", example: "She resented being treated like a foreigner in her own hometown." },
        { topic: "Adaptation & Perception", word: "Adapt", phonetic: "/əˈdæpt/", form: "Verb", forms: "N: Adaptation | Adj: Adaptable", def: "To change, or to change something, to suit different conditions or uses.", translation: "Thích nghi", example: "It took him several months to fully adapt to the fast-paced lifestyle of the city." },
        { topic: "Adaptation & Perception", word: "Perceive", phonetic: "/pəˈsiːv/", form: "Verb", forms: "N: Perception | Adj: Perceptive", def: "To come to an opinion about something, or have a belief about something.", translation: "Nhận thức, nhìn nhận", example: "New technology is often perceived as a threat by older generations." },
        { topic: "Adaptation & Perception", word: "Inevitable", phonetic: "/ɪˈnevɪtəbl/", form: "Adjective", forms: "Adv: Inevitably | N: Inevitability", def: "Certain to happen and unable to be avoided or prevented.", translation: "Không thể tránh khỏi", example: "When moving to a new country, experiencing some culture shock is inevitable." },
        { topic: "Adaptation & Perception", word: "Intrigued", phonetic: "/ɪnˈtriːɡd/", form: "Adjective", forms: "V: Intrigue | Adj: Intriguing", def: "Interested and wanting to know more about something.", translation: "Bị hấp dẫn, tò mò", example: "I was intrigued by the unique customs of the local indigenous tribe." },
        { topic: "Adaptation & Perception", word: "Accustomed to", phonetic: "/əˈkʌstəmd tu/", form: "Phrase", forms: "N/A", def: "Familiar with something; used to something.", translation: "Quen với", example: "After a year in London, she finally became accustomed to the rainy weather." },
        { topic: "Adaptation & Perception", word: "Subtle", phonetic: "/ˈsʌtl/", form: "Adjective", forms: "N: Subtlety | Adv: Subtly", def: "Not loud, bright, noticeable, or obvious in any way.", translation: "Tinh tế, phảng phất, khó thấy", example: "There are subtle differences in etiquette between the two neighboring countries." },
        { topic: "Adaptation & Perception", word: "Interpret", phonetic: "/ɪnˈtɜːprət/", form: "Verb", forms: "N: Interpretation | N: Interpreter", def: "To decide what the intended meaning of something is.", translation: "Giải thích, phiên dịch, hiểu", example: "A smile can be interpreted differently depending on the cultural context." },

        // --- Migration & Demographics (Reading) ---
        { topic: "Migration & Demographics", word: "Expatriate", phonetic: "/eksˈpætriət/", form: "Noun", forms: "Slang: Expat", def: "Someone who does not live in their own country.", translation: "Người sống và làm việc ở nước ngoài", example: "A large community of expatriates lives in the coastal areas of Spain." },
        { topic: "Migration & Demographics", word: "Immigrant", phonetic: "/ˈɪmɪɡrənt/", form: "Noun", forms: "V: Immigrate | N: Immigration", def: "A person who has come to a different country in order to live there permanently.", translation: "Người nhập cư", example: "The city's diverse culture is heavily influenced by its large immigrant population." },
        { topic: "Migration & Demographics", word: "Refugee", phonetic: "/ˌrefjuˈdʒiː/", form: "Noun", forms: "N: Refuge", def: "A person who has escaped from their own country for political, religious, or economic reasons.", translation: "Người tị nạn", example: "Thousands of refugees fled across the border to escape the conflict." },
        { topic: "Migration & Demographics", word: "Mobility", phonetic: "/məʊˈbɪləti/", form: "Noun", forms: "Adj: Mobile", def: "The ability to move freely or be easily moved.", translation: "Sự di động, tính lưu động", example: "Modern transportation has greatly increased the social and geographic mobility of the workforce." },
        { topic: "Migration & Demographics", word: "Exponential", phonetic: "/ˌekspəˈnenʃl/", form: "Adjective", forms: "Adv: Exponentially", def: "Describes a rate of increase that grows more and more rapidly.", translation: "Theo cấp số nhân, tăng vọt", example: "The city has seen exponential growth in its population over the last decade." },

        // --- Career & Ambition (Speaking) ---
        { topic: "Career & Ambition", word: "Aspire to do something", phonetic: "/əˈspaɪə tu du ˈsʌmθɪŋ/", form: "Phrase", forms: "N: Aspiration", def: "To want something very much or hope to achieve something.", translation: "Khao khát làm điều gì", example: "As a young student, she always aspired to become a leading heart surgeon." },
        { topic: "Career & Ambition", word: "Pursue", phonetic: "/pəˈsjuː/", form: "Verb", forms: "N: Pursuit", def: "To try to achieve something over a period of time.", translation: "Theo đuổi", example: "He decided to leave his corporate job to pursue his dream of opening a bakery." },
        { topic: "Career & Ambition", word: "Meticulousness", phonetic: "/məˈtɪkjələsnəs/", form: "Noun", forms: "Adj: Meticulous", def: "Great attention to detail; very careful and precise.", translation: "Sự tỉ mỉ, cẩn thận", example: "The architect was known for his extreme meticulousness in planning every detail." },
        { topic: "Career & Ambition", word: "Demanding", phonetic: "/dɪˈmɑːndɪŋ/", form: "Adjective", forms: "V: Demand", def: "Needing a lot of time, attention, or energy.", translation: "Đòi hỏi khắt khe, áp lực", example: "Being a professional athlete is a physically and mentally demanding career." },
        { topic: "Career & Ambition", word: "Diligent", phonetic: "/ˈdɪlɪdʒənt/", form: "Adjective", forms: "N: Diligence", def: "Careful and using a lot of effort.", translation: "Siêng năng, cần cù", example: "He is a highly diligent student who always completes his assignments ahead of time." },

        // --- Travel & Lifestyle (Speaking) ---
        { topic: "Travel & Lifestyle", word: "Recharge", phonetic: "/ˌriːˈtʃɑːdʒ/", form: "Verb", forms: "N/A", def: "To rest and relax in order to regain energy and strength.", translation: "Nạp lại năng lượng", example: "I took a weekend trip to the mountains simply to relax and recharge." },
        { topic: "Travel & Lifestyle", word: "Wander off the beaten track", phonetic: "/ˈwɒndər ɒf ðə ˈbiːtn træk/", form: "Idiom", forms: "N/A", def: "To go to a place where few people go, far from main roads or popular spots.", translation: "Đi chệch khỏi lối mòn (khám phá nơi ít người biết)", example: "Instead of visiting famous museums, we prefer to wander off the beaten track and find hidden cafes." },
        { topic: "Travel & Lifestyle", word: "Savor local delicacies", phonetic: "/ˈseɪvə ˈləʊkl ˈdelɪkəsiz/", form: "Phrase", forms: "N/A", def: "To enjoy food that is typical or unique to a specific region.", translation: "Thưởng thức đặc sản địa phương", example: "One of the best parts of traveling to Italy is savoring local delicacies like fresh pasta." },
        { topic: "Travel & Lifestyle", word: "Discerning", phonetic: "/dɪˈsɜːnɪŋ/", form: "Adjective", forms: "V: Discern | N: Discernment", def: "Showing good judgment, especially about style and quality.", translation: "Sáng suốt, có gu thẩm mỹ", example: "The hotel caters to discerning travelers who expect the highest level of service." },

        // --- Housing & Environment (Speaking) ---
        { topic: "Housing & Environment", word: "Accommodation", phonetic: "/əˌkɒməˈdeɪʃn/", form: "Noun", forms: "V: Accommodate", def: "A place to live, work, stay, etc.", translation: "Chỗ ở", example: "It was difficult to find cheap accommodation in the city center during the festival." },
        { topic: "Housing & Environment", word: "Spacious", phonetic: "/ˈspeɪʃəs/", form: "Adjective", forms: "N: Space", def: "Having a lot of space; large in area.", translation: "Rộng rãi", example: "They recently moved into a bright and spacious apartment overlooking the park." },
        { topic: "Housing & Environment", word: "Open-plan", phonetic: "/ˌəʊpən ˈplæn/", form: "Adjective", forms: "N/A", def: "An open-plan room or building has few or no walls inside, so it is not divided into smaller rooms.", translation: "Thiết kế không gian mở", example: "The new office features an open-plan layout to encourage collaboration." },
        { topic: "Housing & Environment", word: "Metropolis", phonetic: "/məˈtrɒpəlɪs/", form: "Noun", forms: "Adj: Metropolitan", def: "A very large city, often the most important city in a large area or country.", translation: "Đô thị, thành phố lớn", example: "Tokyo is a bustling metropolis that never seems to sleep." },
        { topic: "Housing & Environment", word: "Laid-back", phonetic: "/ˌleɪdˈbæk/", form: "Adjective", forms: "N/A", def: "Relaxed in manner and character; not usually worried about other people's behaviour.", translation: "Thư thái, ung dung", example: "People living in rural areas tend to have a much more laid-back attitude towards life." },
        { topic: "Housing & Environment", word: "Pretentious", phonetic: "/prɪˈtenʃəs/", form: "Adjective", forms: "N: Pretension", def: "Trying to appear or sound more important or smarter than you are.", translation: "Tự phụ, khoe khoang", example: "The restaurant was overly expensive and the atmosphere felt a bit pretentious." },

        // --- Idioms & Phrases ---
        { topic: "Idioms & Phrases", word: "Think outside the box", phonetic: "/θɪŋk aʊtˈsaɪd ðə bɒks/", form: "Idiom", forms: "N/A", def: "To think imaginatively using new ideas instead of traditional or expected ones.", translation: "Suy nghĩ đột phá, sáng tạo", example: "To solve this complex urban planning issue, we really need to think outside the box." },
        { topic: "Idioms & Phrases", word: "Have a burning passion for", phonetic: "/hæv ə ˈbɜːnɪŋ ˈpæʃn fɔː/", form: "Phrase", forms: "N/A", def: "To have a very strong and intense enthusiasm for something.", translation: "Có niềm đam mê cháy bỏng với", example: "She has a burning passion for environmental protection and volunteers every weekend." },
        { topic: "Idioms & Phrases", word: "Come down to a clash", phonetic: "/kʌm daʊn tu ə klæʃ/", form: "Phrase", forms: "N/A", def: "To result in a conflict or strong disagreement between opposing views.", translation: "Dẫn đến sự xung đột (quan điểm, văn hóa)", example: "The failure of the negotiation ultimately came down to a clash of cultural values." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fde047; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            
            let femaleVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Zira') ||
                voice.name.includes('Karen') ||
                voice.name.includes('Tessa') ||
                voice.name.includes('Fiona') ||
                voice.name.includes('Moira') ||
                voice.name.includes('Veena')
            );
            
            if (!femaleVoice) {
                femaleVoice = voices.find(voice => voice.lang.includes('en-GB') && !voice.name.includes('Male'));
            }
            
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                utterance.pitch = 1.3; 
            }

            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            // Map button text to actual topic properties
            if (activeFilter.includes('Adaptation')) topicName = 'Adaptation & Perception';
            if (activeFilter.includes('Migration')) topicName = 'Migration & Demographics';
            if (activeFilter.includes('Career')) topicName = 'Career & Ambition';
            if (activeFilter.includes('Travel')) topicName = 'Travel & Lifestyle';
            if (activeFilter.includes('Housing')) topicName = 'Housing & Environment';
            if (activeFilter.includes('Idioms')) topicName = 'Idioms & Phrases';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem;">
                    <span style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
</html>
