<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 2 - Vocabulary</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Pastel Sky Blue & Soft Amber */
            --primary: #3b82f6; /* Blue 500 */
            --primary-light: #dbeafe; /* Blue 100 */
            --primary-hover: #2563eb; /* Blue 600 */
            --text-main: #334155; /* Slate 700 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-body: #eff6ff; /* Blue 50 - Very light pastel background */
            --card-bg: #ffffff;
            --accent: #f59e0b; /* Amber 500 */
            --accent-light: #fef3c7; /* Amber 100 */
            --border: #bfdbfe; /* Blue 200 */
            --badge-bg: #e0e7ff; /* Indigo 100 */
            --badge-text: #4338ca; /* Indigo 700 */
            --success: #10b981; /* Emerald 500 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2rem; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800; font-family: var(--font-headings); }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.95rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary-light); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: var(--font-body); }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.8rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.8rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(59, 130, 246, 0.15); border-color: var(--primary-light); }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.8rem; }
        .word-main { display: flex; align-items: center; gap: 0.8rem; }
        .word { font-size: 1.6rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { background: var(--primary-light); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; transition: all 0.2s ease; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4); }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { background-color: #f8fafc; border: 1px dashed #cbd5e1; padding: 0.6rem; border-radius: 8px; font-size: 0.9rem; color: #475569; margin-bottom: 1rem; line-height: 1.4; }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { font-size: 0.75rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 700; margin-bottom: 1rem; display: inline-block; text-transform: uppercase; letter-spacing: 0.05em;}
        
        .definition { font-size: 1.05rem; margin-bottom: 0.4rem; color: var(--text-main); font-weight: 500; }
        .definition strong { color: var(--primary); }
        .translation { font-size: 1rem; color: var(--success); margin-bottom: 1rem; font-weight: 600; }

        .example-box { background-color: var(--accent-light); padding: 1.2rem; border-left: 4px solid var(--accent); border-radius: 8px; margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.35rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.35rem; color: #b45309; line-height: 1.4; }

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 700px; height: 580px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 15px 35px rgba(59, 130, 246, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.2rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings);}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; }
        .flashcard-front .audio-btn { width: 50px; height: 50px; }
        .flashcard-front .audio-btn svg { width: 24px; height: 24px; }
        .flashcard-front .phonetic { font-size: 1.4rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.15rem; margin-bottom: 1.5rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.2rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2.5rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.05rem; font-weight: 700; cursor: pointer; padding: 0.6rem 1.5rem; border-radius: 25px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.2rem; color: var(--accent); min-width: 80px; text-align: center; font-family: var(--font-headings); }

        @media (max-width: 768px) { 
            h1 { font-size: 2rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.5rem; } 
            .flashcard-back .definition { font-size: 1.05rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 2</h1>
        <p class="subtitle">It's Good For You</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Agriculture & Science')">Agriculture & Science</button>
        <button class="filter-btn" onclick="filterTopic('Health & Fitness')">Health & Fitness</button>
        <button class="filter-btn" onclick="filterTopic('Sleep & Routine')">Sleep & Routine</button>
        <button class="filter-btn" onclick="filterTopic('Food & Diet')">Food & Diet</button>
        <button class="filter-btn" onclick="filterTopic('General Academic')">General Academic</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Phrases')">Idioms & Phrases</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fde68a; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 2)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Agriculture & Science ---
        { topic: "Agriculture & Science", word: "Yield", phonetic: "/jiːld/", form: "Noun / Verb", forms: "Adj: High-yielding", def: "An amount produced of an agricultural or industrial product.", translation: "Sản lượng / Mang lại", example: "The new organic fertilizer significantly increased the crop yield." },
        { topic: "Agriculture & Science", word: "Crop rotation", phonetic: "/krɒp rəʊˈteɪʃn/", form: "Noun Phrase", forms: "V: Rotate crops", def: "The practice of growing different crops in succession on the same land to preserve the soil.", translation: "Luân canh cây trồng", example: "Crop rotation helps prevent soil depletion and keeps pests away naturally." },
        { topic: "Agriculture & Science", word: "GM crop", phonetic: "/ˌdʒiː ˈem krɒp/", form: "Noun Phrase", forms: "N/A", def: "Genetically modified crop; a plant with altered DNA to resist disease or grow faster.", translation: "Cây trồng biến đổi gen", example: "GM crops are designed to be highly resistant to local pests and diseases." },
        { topic: "Agriculture & Science", word: "Additive", phonetic: "/ˈædətɪv/", form: "Noun", forms: "V: Add", def: "A substance added to something in small quantities to improve or preserve it.", translation: "Chất phụ gia", example: "This fruit juice is healthy because it contains no artificial colors or additives." },
        { topic: "Agriculture & Science", word: "Contaminate", phonetic: "/kənˈtæmɪneɪt/", form: "Verb", forms: "N: Contamination | Adj: Contaminated", def: "To make something impure by exposure to or addition of a poisonous or polluting substance.", translation: "Làm ô nhiễm", example: "The river was dangerously contaminated by industrial chemical waste." },
        { topic: "Agriculture & Science", word: "Photosynthesis", phonetic: "/ˌfəʊtəʊˈsɪnθəsɪs/", form: "Noun", forms: "V: Photosynthesize", def: "The process by which green plants use sunlight to synthesize nutrients from carbon dioxide and water.", translation: "Quang hợp", example: "Photosynthesis is absolutely essential for plant growth and oxygen production." },
        { topic: "Agriculture & Science", word: "Antibiotic", phonetic: "/ˌæntibaɪˈɒtɪk/", form: "Noun", forms: "N/A", def: "A medicine that inhibits the growth of or destroys microorganisms.", translation: "Thuốc kháng sinh", example: "The doctor prescribed a strong antibiotic to treat the bacterial infection." },
        { topic: "Agriculture & Science", word: "Spoilage", phonetic: "/ˈspɔɪlɪdʒ/", form: "Noun", forms: "V: Spoil", def: "The action or process of spoiling, especially the deterioration of food and perishable goods.", translation: "Sự hư hỏng (thức ăn)", example: "Proper refrigeration helps slow down the rate of food spoilage." },

        // --- Health & Fitness ---
        { topic: "Health & Fitness", word: "Hit the gym", phonetic: "/hɪt ðə dʒɪm/", form: "Phrase", forms: "N/A", def: "To go to a health club or gym to exercise.", translation: "Đi tập gym", example: "After finishing work, I usually hit the gym for about an hour of cardio." },
        { topic: "Health & Fitness", word: "Strenuous", phonetic: "/ˈstrenjuəs/", form: "Adjective", forms: "Adv: Strenuously", def: "Requiring or using great exertion; physically demanding.", translation: "Đòi hỏi sức lực, căng thẳng", example: "It is advised to avoid strenuous exercise immediately after eating a heavy meal." },
        { topic: "Health & Fitness", word: "Well-being", phonetic: "/ˌwel ˈbiːɪŋ/", form: "Noun", forms: "N/A", def: "The state of being comfortable, healthy, or happy.", translation: "Sự khỏe mạnh, hạnh phúc", example: "Practicing daily yoga and meditation can greatly improve your mental well-being." },
        { topic: "Health & Fitness", word: "Get into shape", phonetic: "/ɡet ˈɪntə ʃeɪp/", form: "Phrase", forms: "N/A", def: "To become physically fit by exercising and eating well.", translation: "Trở nên thon thả, cân đối", example: "She started swimming every morning to get into shape for the upcoming summer." },
        { topic: "Health & Fitness", word: "Do wonders for", phonetic: "/du ˈwʌndəz fɔː/", form: "Idiom", forms: "N/A", def: "To have a very beneficial or positive effect on someone or something.", translation: "Có tác dụng tuyệt vời cho", example: "A solid night of sleep will do wonders for your overall concentration tomorrow." },
        { topic: "Health & Fitness", word: "Lethargic", phonetic: "/ləˈθɑːdʒɪk/", form: "Adjective", forms: "N: Lethargy", def: "Affected by lethargy; sluggish and apathetic.", translation: "Uể oải, lờ đờ", example: "Eating too many heavy carbohydrates at lunch makes me feel lethargic all afternoon." },
        { topic: "Health & Fitness", word: "Detoxify", phonetic: "/diːˈtɒksɪfaɪ/", form: "Verb", forms: "N: Detoxification | Slang: Detox", def: "To remove toxic substances or qualities from the body.", translation: "Giải độc", example: "Drinking plenty of green tea and water helps to naturally detoxify your body." },

        // --- Sleep & Routine ---
        { topic: "Sleep & Routine", word: "Night owl", phonetic: "/naɪt aʊl/", form: "Noun", forms: "N/A", def: "A person who is habitually active or wakeful at night.", translation: "Cú đêm (người thức khuya)", example: "My brother is a true night owl and often stays up studying until 3 AM." },
        { topic: "Sleep & Routine", word: "Early bird", phonetic: "/ˈɜːli bɜːd/", form: "Noun", forms: "N/A", def: "A person who rises, arrives, or acts before the usual or expected time.", translation: "Người dậy sớm", example: "I've never been an early bird; getting out of bed before 7 AM is difficult for me." },
        { topic: "Sleep & Routine", word: "Have a tight schedule", phonetic: "/hæv ə taɪt ˈʃedjuːl/", form: "Phrase", forms: "N/A", def: "To have very little free time between appointments or activities.", translation: "Có lịch trình dày đặc", example: "I have a tight schedule today, but I can squeeze in a quick coffee break at noon." },
        { topic: "Sleep & Routine", word: "Take a siesta", phonetic: "/teɪk ə siˈestə/", form: "Phrase", forms: "N/A", def: "To take an afternoon rest or nap, especially during the hottest part of the day.", translation: "Nghỉ trưa, ngủ trưa", example: "In some Mediterranean cultures, it is very common to take a siesta after lunch." },
        { topic: "Sleep & Routine", word: "Toss and turn", phonetic: "/tɒs ænd tɜːn/", form: "Phrase", forms: "N/A", def: "To move around restlessly in bed while trying to sleep without success.", translation: "Trằn trọc", example: "I was so anxious about the job interview that I tossed and turned all night." },
        { topic: "Sleep & Routine", word: "Sleep-deprived", phonetic: "/sliːp dɪˈpraɪvd/", form: "Adjective", forms: "N: Sleep deprivation", def: "Suffering from a severe lack of sleep.", translation: "Thiếu ngủ", example: "Sleep-deprived drivers have slower reaction times and are a major cause of accidents." },
        { topic: "Sleep & Routine", word: "Recharge my batteries", phonetic: "/ˌriːˈtʃɑːdʒ maɪ ˈbætəriz/", form: "Idiom", forms: "N/A", def: "To rest and relax in order to regain energy and strength.", translation: "Nạp lại năng lượng", example: "I took a weekend trip to the peaceful countryside just to recharge my batteries." },

        // --- Food & Diet ---
        { topic: "Food & Diet", word: "Fussy eater", phonetic: "/ˈfʌsi ˈiːtə/", form: "Noun Phrase", forms: "Adj: Fussy", def: "Someone who is very particular about what they eat and dislikes many foods.", translation: "Người kén ăn", example: "As a child, I was a notoriously fussy eater and absolutely refused to eat broccoli." },
        { topic: "Food & Diet", word: "Have a sweet tooth", phonetic: "/hæv ə swiːt tuːθ/", form: "Phrase", forms: "N/A", def: "To have a strong liking or craving for sweet, sugary foods.", translation: "Hảo ngọt", example: "If you have a sweet tooth, you'll absolutely love this rich chocolate fudge cake." },
        { topic: "Food & Diet", word: "Wholesome", phonetic: "/ˈhəʊlsəm/", form: "Adjective", forms: "N/A", def: "Conducive to or suggestive of good health and physical well-being.", translation: "Bổ dưỡng, lành mạnh", example: "My grandmother always prepares wholesome, home-cooked meals using fresh vegetables." },
        { topic: "Food & Diet", word: "Greasy", phonetic: "/ˈɡriːsi/", form: "Adjective", forms: "N: Grease", def: "Covered with, resembling, or producing a lot of fat or oil.", translation: "Nhiều dầu mỡ", example: "I try to avoid fast food burgers because they are usually far too greasy for my stomach." },
        { topic: "Food & Diet", word: "Dehydration", phonetic: "/ˌdiːhaɪˈdreɪʃn/", form: "Noun", forms: "V: Dehydrate | Adj: Dehydrated", def: "The loss or removal of water from something, especially the human body.", translation: "Sự mất nước", example: "You must drink plenty of fluids during a strenuous workout to prevent dehydration." },
        { topic: "Food & Diet", word: "Crave for", phonetic: "/kreɪv fɔː/", form: "Phrasal Verb", forms: "N: Craving", def: "To feel a powerful and uncontrollable desire for something, often food.", translation: "Thèm khát", example: "During the long winter months, I constantly crave for warm, comforting soups." },
        { topic: "Food & Diet", word: "Grab a bite", phonetic: "/ɡræb ə baɪt/", form: "Phrase", forms: "N/A", def: "To get something to eat quickly, usually a small meal or snack.", translation: "Ăn lót dạ, ăn vội", example: "We don't have much time, so let's just grab a bite at the sandwich shop before the movie." },

        // --- General Academic ---
        { topic: "General Academic", word: "Compensate for", phonetic: "/ˈkɒmpenseɪt fɔː/", form: "Phrasal Verb", forms: "N: Compensation", def: "To make up for something unwelcome or unpleasant by exerting an opposite force or effect.", translation: "Bù đắp cho", example: "The airline tried to compensate for the severe delay by offering passengers a free meal." },
        { topic: "General Academic", word: "Artificial", phonetic: "/ˌɑːtɪˈfɪʃl/", form: "Adjective", forms: "Adv: Artificially", def: "Made or produced by human beings rather than occurring naturally.", translation: "Nhân tạo", example: "Many heavily processed snack foods contain artificial flavorings and chemical preservatives." },
        { topic: "General Academic", word: "Conventional", phonetic: "/kənˈvenʃənl/", form: "Adjective", forms: "Adv: Conventionally | N: Convention", def: "Based on or in accordance with what is generally done or believed.", translation: "Thông thường, truyền thống", example: "He chose a conventional approach to medical treatment rather than trying alternative therapies." },
        { topic: "General Academic", word: "Optimum", phonetic: "/ˈɒptɪməm/", form: "Adjective / Noun", forms: "Adj: Optimal", def: "Most conducive to a favorable outcome; the best possible condition.", translation: "Tối ưu", example: "The delicate seeds must be planted in optimum soil conditions for the highest yield." },
        { topic: "General Academic", word: "Precise", phonetic: "/prɪˈsaɪz/", form: "Adjective", forms: "Adv: Precisely | N: Precision", def: "Marked by exactness and accuracy of expression or detail.", translation: "Chính xác", example: "Baking a soufflé requires highly precise temperature measurements to ensure it rises properly." },
        { topic: "General Academic", word: "Contradict", phonetic: "/ˌkɒntrəˈdɪkt/", form: "Verb", forms: "N: Contradiction | Adj: Contradictory", def: "To deny the truth of a statement, especially by asserting the opposite.", translation: "Mâu thuẫn, trái ngược", example: "The new scientific findings directly contradict the previously accepted theories." },
        { topic: "General Academic", word: "Misleading", phonetic: "/mɪsˈliːdɪŋ/", form: "Adjective", forms: "V: Mislead", def: "Giving the wrong idea or impression; deceptive.", translation: "Gây hiểu lầm", example: "The flashy advertisement was highly misleading regarding the nutritional value of the cereal." },

        // --- Idioms & Phrases ---
        { topic: "Idioms & Phrases", word: "A closed book", phonetic: "/ə kləʊzd bʊk/", form: "Idiom", forms: "N/A", def: "A subject or person about which one knows absolutely nothing.", translation: "Một chủ đề hoàn toàn xa lạ", example: "Advanced quantum physics is a complete closed book to me." },
        { topic: "Idioms & Phrases", word: "Come into play", phonetic: "/kʌm ˈɪntə pleɪ/", form: "Idiom", forms: "N/A", def: "To have an effect or become an important factor in a situation.", translation: "Bắt đầu có tác dụng, phát huy", example: "Several financial factors come into play when deciding whether to buy or rent a house." },
        { topic: "Idioms & Phrases", word: "Take into account", phonetic: "/teɪk ˈɪntə əˈkaʊnt/", form: "Phrase", forms: "N/A", def: "To consider or remember something when judging a situation or making a decision.", translation: "Xem xét, tính đến", example: "You must take his young age into account before criticizing his lack of professional experience." },
        { topic: "Idioms & Phrases", word: "Have time on my hands", phonetic: "/hæv taɪm ɒn maɪ hændz/", form: "Idiom", forms: "N/A", def: "To have nothing to do; to have a surplus of free time.", translation: "Rảnh rỗi, dư dả thời gian", example: "Now that I'm fully retired, I have a lot of time on my hands to pursue painting." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #a5b4fc; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            
            let femaleVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Zira') ||
                voice.name.includes('Karen') ||
                voice.name.includes('Tessa') ||
                voice.name.includes('Fiona') ||
                voice.name.includes('Moira') ||
                voice.name.includes('Veena')
            );
            
            if (!femaleVoice) {
                femaleVoice = voices.find(voice => voice.lang.includes('en-GB') && !voice.name.includes('Male'));
            }
            
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                utterance.pitch = 1.3; 
            }

            window.speechSynthesis.speak(utterance);
        } else {
            // Replaced alert with console.log as per strict rules.
            console.log("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            // Map button text to actual topic properties
            if (activeFilter.includes('Agriculture')) topicName = 'Agriculture & Science';
            if (activeFilter.includes('Health')) topicName = 'Health & Fitness';
            if (activeFilter.includes('Sleep')) topicName = 'Sleep & Routine';
            if (activeFilter.includes('Food')) topicName = 'Food & Diet';
            if (activeFilter.includes('Academic')) topicName = 'General Academic';
            if (activeFilter.includes('Idioms')) topicName = 'Idioms & Phrases';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem;">
                    <span style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
</html>
