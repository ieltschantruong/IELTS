<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 8 - Fashion & Design</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Pastel Lilac & Soft Peach/Gold (Fashion, Creativity, Elegance) */
            --primary: #6b46c1; /* Purple 700 - Elegant, creative, luxurious */
            --primary-light: #f3e8ff; /* Purple 100 */
            --primary-hover: #581c87; /* Purple 900 */
            --text-main: #334155; /* Slate 700 */
            --text-muted: #64748b; /* Slate 500 */
            --bg-body: #faf5ff; /* Very light lilac off-white */
            --card-bg: #ffffff;
            --accent: #f59e0b; /* Amber 500 / Gold - Highlighting fashion and spotlight */
            --accent-light: #fef3c7; /* Amber 100 */
            --border: #e2e8f0; /* Slate 200 */
            --badge-bg: #ffedd5; /* Orange 100 */
            --badge-text: #c2410c; /* Orange 700 */
            --success: #0d9488; /* Teal 600 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2.5rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.02em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            letter-spacing: 0.1em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.5rem 1.2rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(107, 70, 193, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 30px -10px rgba(107, 70, 193, 0.15); 
            border-color: var(--primary-light); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.8rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1) rotate(5deg); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(107, 70, 193, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { 
            background-color: var(--bg-body); 
            border: 1px dashed var(--border); 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box::before {
            content: '"';
            position: absolute;
            top: -5px;
            right: 15px;
            font-family: var(--font-headings);
            font-size: 4rem;
            color: var(--accent);
            opacity: 0.2;
            line-height: 1;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #b45309; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(107, 70, 193, 0.12); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 4rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.6rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #fdfefe; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.3rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-hover);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 1rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 550px; } 
            .flashcard-front .word { font-size: 3rem; } 
            .flashcard-back .definition { font-size: 1.2rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 8</h1>
        <p class="subtitle">Fashion & Design</p>
    </header>

    <!-- Topic Filters -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('High Fashion & Artistry')">High Fashion</button>
        <button class="filter-btn" onclick="filterTopic('Clothing & Accessories')">Clothing & Accessories</button>
        <button class="filter-btn" onclick="filterTopic('The Fashion Industry')">The Fashion Industry</button>
        <button class="filter-btn" onclick="filterTopic('Style & Description')">Style & Description</button>
        <button class="filter-btn" onclick="filterTopic('Reactions & Attitudes')">Reactions & Attitudes</button>
        <button class="filter-btn" onclick="filterTopic('General Concepts')">General Concepts</button>
    </div>

    <!-- View Toggles -->
    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fcd34d; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 8)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- High Fashion & Artistry ---
        { topic: "High Fashion & Artistry", word: "Haute couture", phonetic: "/ˌəʊt kuːˈtjʊə(r)/", form: "Noun", forms: "N/A", def: "The business of making expensive, original clothes of high quality.", translation: "Thời trang cao cấp", example: "Paris is widely considered the birthplace of haute couture." },
        { topic: "High Fashion & Artistry", word: "Masterpiece", phonetic: "/ˈmɑːstəpiːs/", form: "Noun", forms: "N/A", def: "A work of art such as a painting, film, or book that is made with great skill.", translation: "Kiệt tác", example: "The designer's final collection was hailed as a true masterpiece." },
        { topic: "High Fashion & Artistry", word: "Intricate", phonetic: "/ˈɪntrɪkət/", form: "Adjective", forms: "Adv: Intricately | N: Intricacy", def: "Having a lot of small parts or details that are arranged in a complicated way.", translation: "Phức tạp, tinh xảo", example: "The wedding dress featured intricate lace patterns stitched by hand." },
        { topic: "High Fashion & Artistry", word: "Workmanship", phonetic: "/ˈwɜːkmənʃɪp/", form: "Noun", forms: "N/A", def: "The skill with which something was made or done.", translation: "Trình độ tay nghề", example: "The quality of the workmanship in these handmade Italian shoes is exceptional." },
        { topic: "High Fashion & Artistry", word: "Craftsmanship", phonetic: "/ˈkrɑːftsmənʃɪp/", form: "Noun", forms: "N/A", def: "Skill at making things; the high quality of something made using such skill.", translation: "Sự khéo léo, tay nghề thợ thủ công", example: "We admire the fine craftsmanship of this antique jewelry." },
        { topic: "High Fashion & Artistry", word: "Grace", phonetic: "/ɡreɪs/", form: "Noun", forms: "Adj: Graceful", def: "A quality of moving in a smooth, relaxed, and attractive way; elegance.", translation: "Sự duyên dáng, vẻ yêu kiều", example: "The model walked down the runway with effortless grace." },
        { topic: "High Fashion & Artistry", word: "Cultivate", phonetic: "/ˈkʌltɪveɪt/", form: "Verb", forms: "N: Cultivation", def: "To try to develop and improve something, like a skill, habit, or image.", translation: "Trau dồi, xây dựng", example: "The brand has carefully cultivated an image of exclusivity and luxury." },
        { topic: "High Fashion & Artistry", word: "Stitch", phonetic: "/stɪtʃ/", form: "Verb/Noun", forms: "N/A", def: "To sew two things together, or to repair a tear with a needle and thread.", translation: "Khâu, may", example: "It took hundreds of hours to stitch the beads onto the bodice." },

        // --- Clothing & Accessories ---
        { topic: "Clothing & Accessories", word: "Garment", phonetic: "/ˈɡɑːmənt/", form: "Noun", forms: "N/A", def: "A piece of clothing (formal word).", translation: "Quần áo, trang phục", example: "Many garments sold today are manufactured in factories overseas." },
        { topic: "Clothing & Accessories", word: "Outfit", phonetic: "/ˈaʊtfɪt/", form: "Noun", forms: "N/A", def: "A set of clothes worn for a particular occasion or activity.", translation: "Bộ trang phục", example: "She bought a stunning new outfit for her sister's wedding." },
        { topic: "Clothing & Accessories", word: "Trench coat", phonetic: "/ˈtrentʃ kəʊt/", form: "Noun", forms: "N/A", def: "A long, loose coat with a belt, usually made from waterproof material.", translation: "Áo măng tô", example: "A classic beige trench coat is a staple in many people's wardrobes." },
        { topic: "Clothing & Accessories", word: "Cardigan", phonetic: "/ˈkɑːdɪɡən/", form: "Noun", forms: "N/A", def: "A piece of clothing, usually made from wool, which covers the upper part of the body and fastens at the front with buttons.", translation: "Áo khoác len", example: "It was a bit chilly, so she threw a cardigan over her dress." },
        { topic: "Clothing & Accessories", word: "Gown", phonetic: "/ɡaʊn/", form: "Noun", forms: "N/A", def: "A long, elegant dress worn on formal occasions.", translation: "Áo dạ hội", example: "The actresses looked glamorous in their designer evening gowns." },
        { topic: "Clothing & Accessories", word: "Footwear", phonetic: "/ˈfʊtweə(r)/", form: "Noun (Uncountable)", forms: "N/A", def: "Things that people wear on their feet (shoes, boots, sandals, etc.).", translation: "Giày dép (nói chung)", example: "The store offers a wide selection of casual and formal footwear." },
        { topic: "Clothing & Accessories", word: "Sneakers", phonetic: "/ˈsniːkəz/", form: "Noun (Plural)", forms: "UK: Trainers", def: "A type of light, comfortable shoe that is suitable for playing sports.", translation: "Giày thể thao", example: "He wore a sharp suit paired surprisingly with bright white sneakers." },
        { topic: "Clothing & Accessories", word: "Slip-ons", phonetic: "/ˈslɪp ɒnz/", form: "Noun (Plural)", forms: "N/A", def: "Shoes that you can easily slide your feet into without tying laces.", translation: "Giày lười", example: "Slip-ons are perfect for quickly running errands." },
        { topic: "Clothing & Accessories", word: "High heels", phonetic: "/ˌhaɪ ˈhiːlz/", form: "Noun (Plural)", forms: "N/A", def: "Women's shoes in which the heels are raised high off the ground.", translation: "Giày cao gót", example: "She rarely wears high heels because they make her feet ache." },
        { topic: "Clothing & Accessories", word: "Dial", phonetic: "/ˈdaɪəl/", form: "Noun", forms: "N/A", def: "The face of a clock or watch, or a control on a machine.", translation: "Mặt đồng hồ", example: "His vintage watch has a beautiful gold dial." },

        // --- The Fashion Industry ---
        { topic: "The Fashion Industry", word: "Launch", phonetic: "/lɔːntʃ/", form: "Verb/Noun", forms: "N/A", def: "To begin something such as a plan or introduce a new product to the market.", translation: "Ra mắt, tung ra", example: "The designer is planning to launch her new spring collection next month." },
        { topic: "The Fashion Industry", word: "Roll out", phonetic: "/rəʊl aʊt/", form: "Phrasal Verb", forms: "N: Rollout", def: "To make a new product, service, or system available for the first time.", translation: "Triển khai, tung ra thị trường", example: "The company will roll out its new line of sustainable activewear globally." },
        { topic: "The Fashion Industry", word: "Exclusive", phonetic: "/ɪkˈskluːsɪv/", form: "Adjective", forms: "N: Exclusivity", def: "Limited to only one person or group of people; expensive and only for people who are rich or of a high social class.", translation: "Độc quyền, dành riêng cho giới thượng lưu", example: "They sell exclusive handbags that you cannot find anywhere else." },
        { topic: "The Fashion Industry", word: "The masses", phonetic: "/ðə ˈmæsɪz/", form: "Noun", forms: "N/A", def: "The ordinary people who form the largest group in a society.", translation: "Quần chúng, đại chúng", example: "While haute couture is for the wealthy, fast fashion appeals to the masses." },

        { topic: "General Concepts", word: "Halve", phonetic: "/hɑːv/", form: "Verb", forms: "N/A", def: "To reduce something by half or divide something into two equal pieces.", translation: "Giảm một nửa", example: "The store decided to halve the price of all winter clothing in the spring sale." },
        { topic: "General Concepts", word: "Fragrance", phonetic: "/ˈfreɪɡrəns/", form: "Noun", forms: "Adj: Fragrant", def: "A sweet or pleasant smell; perfume.", translation: "Hương thơm, nước hoa", example: "Many fashion houses make most of their profit from selling designer fragrances." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fdba74; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">${item.example}</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            
            // Clean text for better pronunciation (remove abbreviations)
            let cleanText = text.replace(/\bsth\b/g, 'something').replace(/\bsb\b/g, 'somebody');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; 
            
            // Prefer a British female voice for fashion context if available
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Google UK English Female')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); 
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('High Fashion')) topicName = 'High Fashion & Artistry';
            else if (activeFilterText.includes('Clothing')) topicName = 'Clothing & Accessories';
            else if (activeFilterText.includes('Industry')) topicName = 'The Fashion Industry';
            else if (activeFilterText.includes('Style')) topicName = 'Style & Description';
            else if (activeFilterText.includes('Reactions')) topicName = 'Reactions & Attitudes';
            else if (activeFilterText.includes('General')) topicName = 'General Concepts';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    window.onload = function() {
        renderGrid();
    };

</script>
</body>
</html>
