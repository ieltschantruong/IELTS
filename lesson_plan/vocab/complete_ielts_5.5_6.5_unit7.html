<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 7 - Relationships</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Muted Teal & Dusty Rose (Relationships & Psychology) */
            --primary: #2c7a7b; /* Teal 600 - Calm, deep, intellectual */
            --primary-light: #e6fffa; /* Teal 50 */
            --primary-hover: #234e52; /* Teal 800 */
            --text-main: #2d3748; /* Gray 800 */
            --text-muted: #718096; /* Gray 500 */
            --bg-body: #fcfaf9; /* Warm off-white */
            --card-bg: #ffffff;
            --accent: #de7b85; /* Dusty Rose / Soft Coral - Warm, human, empathetic */
            --accent-light: #fcedef; /* Very light rose */
            --border: #e2e8f0; /* Gray 200 */
            --badge-bg: #fef3c7; /* Amber 100 */
            --badge-text: #92400e; /* Amber 900 */
            --success: #059669; /* Emerald 600 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2.5rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.02em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            letter-spacing: 0.1em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.5rem 1.2rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(44, 122, 123, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(222, 123, 133, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 30px -10px rgba(44, 122, 123, 0.15); 
            border-color: var(--primary-light); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.8rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1) rotate(5deg); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(44, 122, 123, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { 
            background-color: var(--bg-body); 
            border: 1px dashed var(--border); 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box::before {
            content: '"';
            position: absolute;
            top: -5px;
            right: 15px;
            font-family: var(--font-headings);
            font-size: 4rem;
            color: var(--accent);
            opacity: 0.15;
            line-height: 1;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #a34852; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(44, 122, 123, 0.12); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 4rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.6rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #fdfefe; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.3rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-hover);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 1rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 550px; } 
            .flashcard-front .word { font-size: 3rem; } 
            .flashcard-back .definition { font-size: 1.2rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 7</h1>
        <p class="subtitle">Relationships & Psychology</p>
    </header>

    <!-- Topic Filters -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Deception & Truth')">Deception & Truth</button>
        <button class="filter-btn" onclick="filterTopic('Family & Upbringing')">Family & Upbringing</button>
        <button class="filter-btn" onclick="filterTopic('Personality Traits')">Personality Traits</button>
        <button class="filter-btn" onclick="filterTopic('Social Dynamics')">Social Dynamics</button>
        <button class="filter-btn" onclick="filterTopic('Fame & Success')">Fame & Success</button>
        <button class="filter-btn" onclick="filterTopic('General Concepts')">General Concepts</button>
    </div>

    <!-- View Toggles -->
    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fbd3bc; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 7)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Deception & Truth ---
        { topic: "Deception & Truth", word: "Attempt to do sth", phonetic: "/əˈtempt tu du ˈsʌmθɪŋ/", form: "Phrase", forms: "N: Attempt", def: "To try to do something, especially something difficult.", translation: "Nỗ lực/cố gắng làm gì", example: "He attempted to escape through a window but failed." },
        { topic: "Deception & Truth", word: "Display", phonetic: "/dɪˈspleɪ/", form: "Verb", forms: "N: Display", def: "To show a feeling, quality, or attitude so that people can notice it.", translation: "Thể hiện, trưng bày", example: "The children displayed a lot of courage during the scary incident." },
        { topic: "Deception & Truth", word: "Emerge", phonetic: "/ɪˈmɜːdʒ/", form: "Verb", forms: "N: Emergence", def: "To become known or apparent; to come to the surface.", translation: "Nổi lên, xuất hiện", example: "The truth finally emerged after months of investigation." },
        { topic: "Deception & Truth", word: "Devise", phonetic: "/dɪˈvaɪz/", form: "Verb", forms: "N/A", def: "To invent a plan, system, or object, usually using your intelligence or imagination.", translation: "Nghĩ ra, đặt ra (kế hoạch)", example: "He devised a new way to treat the polluted water." },
        { topic: "Deception & Truth", word: "Detect", phonetic: "/dɪˈtekt/", form: "Verb", forms: "N: Detection | N: Detective", def: "To discover or notice something, especially something that is hidden or hard to see.", translation: "Phát hiện", example: "The alarm will go off if it detects smoke." },
        { topic: "Deception & Truth", word: "Haunt", phonetic: "/hɔːnt/", form: "Verb", forms: "Adj: Haunted", def: "To cause repeated suffering or anxiety; to appear in a place repeatedly (like a ghost).", translation: "Ám ảnh", example: "The memory of that terrible accident still haunts him today." },
        { topic: "Deception & Truth", word: "Confess", phonetic: "/kənˈfes/", form: "Verb", forms: "N: Confession", def: "To admit that you have done something wrong or illegal.", translation: "Thú nhận", example: "She confessed to her husband that she had sold her wedding ring." },
        { topic: "Deception & Truth", word: "Deceive", phonetic: "/dɪˈsiːv/", form: "Verb", forms: "N: Deception", def: "To persuade someone that something false is the truth, or to keep the truth hidden.", translation: "Lừa dối", example: "The company deceived customers by selling old computers as new ones." },
        { topic: "Deception & Truth", word: "Deceit", phonetic: "/dɪˈsiːt/", form: "Noun", forms: "Adj: Deceitful", def: "An act of keeping the truth hidden, especially to get an advantage.", translation: "Sự lừa dối, sự dối trá", example: "Their relationship was built on lies and deceit." },
        { topic: "Deception & Truth", word: "Avert (eyes)", phonetic: "/əˈvɜːt/", form: "Verb", forms: "N: Aversion", def: "To turn away your eyes or thoughts.", translation: "Ngoảnh (mặt), quay (đi)", example: "She averted her eyes while he dressed." },
        { topic: "Deception & Truth", word: "Peek at sth", phonetic: "/piːk ət/", form: "Verb Phrase", forms: "N/A", def: "To look at something for a short time, often secretly.", translation: "Nhìn lén, liếc nhìn", example: "Close your eyes, and don't peek at your presents until I say so!" },
        { topic: "Deception & Truth", word: "Rip", phonetic: "/rɪp/", form: "Verb", forms: "N: Rip", def: "To pull apart; to tear or be torn violently and quickly.", translation: "Xé toạc", example: "He ripped the letter into tiny pieces." },
        { topic: "Deception & Truth", word: "Toss", phonetic: "/tɒs/", form: "Verb", forms: "N/A", def: "To throw something carelessly.", translation: "Quăng, ném", example: "He tossed the coin to the beggar on the street." },

        // --- Family & Upbringing ---
        { topic: "Family & Upbringing", word: "Upbringing", phonetic: "/ˈʌpbrɪŋɪŋ/", form: "Noun", forms: "V: Bring up", def: "The way in which you are treated and educated when young, especially by your parents.", translation: "Sự nuôi dưỡng, sự dạy dỗ", example: "Despite his privileged upbringing, he remained very humble." },
        { topic: "Family & Upbringing", word: "Take after", phonetic: "/teɪk ˈɑːftə(r)/", form: "Phrasal Verb", forms: "N/A", def: "To be similar to an older member of your family in appearance or character.", translation: "Giống (ai đó trong gia đình)", example: "He takes after his mother's side of the family." },
        { topic: "Family & Upbringing", word: "Run in one's family", phonetic: "/rʌn ɪn wʌnz ˈfæməli/", form: "Idiom", forms: "N/A", def: "If a quality, ability, or disease runs in a family, many members of the family have it.", translation: "Di truyền trong gia đình", expanded: true, example: "Musical talent seems to run in their family." },
        { topic: "Family & Upbringing", word: "Inherit", phonetic: "/ɪnˈherɪt/", form: "Verb", forms: "N: Inheritance", def: "To receive money, a house, or a genetic trait from someone after they die or from parents.", translation: "Thừa kế, di truyền", example: "She inherited her father's deep blue eyes." },
        { topic: "Family & Upbringing", word: "Be spoilt", phonetic: "/bi spɔɪlt/", form: "Adjective", forms: "V: Spoil", def: "Allowed to do or have anything you want, usually causing bad behavior (especially of a child).", translation: "Bị chiều hư", example: "He was an only child and heavily spoilt by his grandparents." },
        { topic: "Family & Upbringing", word: "Pamper", phonetic: "/ˈpæmpə(r)/", form: "Verb", forms: "N/A", def: "To give someone special treatment, making them as comfortable as possible and giving them whatever they want.", translation: "Nuông chiều", example: "She pampers her dog with expensive organic treats." },
        { topic: "Family & Upbringing", word: "Nurture", phonetic: "/ˈnɜːtʃə(r)/", form: "Verb", forms: "N: Nurture", def: "To take care of, feed, and protect someone or something, especially young children or plants.", translation: "Nuôi dưỡng, chăm sóc", example: "Teachers should nurture their students' creativity." },
        { topic: "Family & Upbringing", word: "Reunion", phonetic: "/ˌriːˈjuːniən/", form: "Noun", forms: "V: Reunite", def: "A social event for a group of people who have not seen each other for a long time.", translation: "Sự đoàn tụ, buổi họp mặt", example: "We're having a family reunion next summer." },
        { topic: "Family & Upbringing", word: "Gathering", phonetic: "/ˈɡæðərɪŋ/", form: "Noun", forms: "V: Gather", def: "A party or a meeting when many people come together as a group.", translation: "Cuộc tụ họp", example: "It was a small family gathering to celebrate her 80th birthday." },

        // --- Personality Traits ---
        { topic: "Personality Traits", word: "Trait", phonetic: "/treɪt/", form: "Noun", forms: "N/A", def: "A particular characteristic that can produce a particular type of behavior.", translation: "Nét đặc trưng, tính trạng", example: "Patience is a trait that she completely lacks." },

        { topic: "General Concepts", word: "Arouse one's interest", phonetic: "/əˈraʊz wʌnz ˈɪntrəst/", form: "Phrase", forms: "N/A", def: "To cause someone to feel interested in something.", translation: "Khơi dậy sự hứng thú", example: "The documentary really aroused my interest in ancient history." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fde68a; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">${item.example}</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Custom Toast Notification function to replace alerts
    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        // Hide after 3.5 seconds
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop current speech
            // Remove 'sth' or 'sb' from the audio reading for clearer pronunciation
            let cleanText = text.replace(/\bsth\b/g, 'something').replace(/\bsb\b/g, 'somebody');
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; // Slightly slower for language learning
            
            // Try to find a good British or clear female voice
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Google UK English Female') ||
                voice.name.includes('Daniel')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); // Prevent flipping the card
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        // Update active button styling
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Filter Grid View
        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        // Filter Flashcard View Data if active
        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            // Determine active filter to sync flashcards
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Deception')) topicName = 'Deception & Truth';
            else if (activeFilterText.includes('Family')) topicName = 'Family & Upbringing';
            else if (activeFilterText.includes('Traits')) topicName = 'Personality Traits';
            else if (activeFilterText.includes('Social')) topicName = 'Social Dynamics';
            else if (activeFilterText.includes('Fame')) topicName = 'Fame & Success';
            else if (activeFilterText.includes('General')) topicName = 'General Concepts';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        // Remove flip class if present to reset face before injecting data
        flashcardScene.classList.remove('is-flipped');
        
        // Delay content injection slightly so it happens during/after the flip animation back
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    // Initialize application on load
    window.onload = function() {
        renderGrid();
    };

</script>
