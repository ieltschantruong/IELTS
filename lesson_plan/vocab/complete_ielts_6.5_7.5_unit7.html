<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 7 - Nature</title>
    
    <!-- Google Fonts: Playfair Display (Serif), Jost (Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Eucalyptus Green & Blush Terracotta (Nature, Earthy, Organic) */
            --primary: #52796f; /* Eucalyptus Green */
            --primary-light: #e8f0ed; /* Very light green */
            --primary-hover: #354f52; /* Dark Slate Green */
            --text-main: #2f3e46; /* Charcoal */
            --text-muted: #6e8675; /* Muted Sage */
            --bg-body: #f4f7f6; /* Cool off-white with hint of green */
            --card-bg: #ffffff;
            --accent: #e29578; /* Blush Terracotta */
            --accent-light: #fbece8; /* Very light terracotta */
            --border: #cad2c5; /* Soft grey-green border */
            --badge-bg: #f3efe9; /* Warm sand */
            --badge-text: #b36a53; /* Deep terracotta */
            --success: #3c6e71; /* Deep aquatic green for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        
        header { text-align: center; margin-top: 3rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.01em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.15rem; 
            font-weight: 600; 
            letter-spacing: 0.15em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.6rem 1.3rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(82, 121, 111, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid var(--border); 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(226, 149, 120, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 30px -10px rgba(82, 121, 111, 0.2); 
            border-color: var(--primary); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.7rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(82, 121, 111, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.05rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .word-families { 
            background-color: var(--bg-body); 
            border: 1px solid var(--border); 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.6rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #a45a43; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(47, 62, 70, 0.08); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 3.8rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.5rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #fafdfc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.35rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.25rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed; bottom: 30px; right: 30px; background: var(--primary-hover); color: white;
            padding: 1rem 1.5rem; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; display: flex; align-items: center; gap: 10px;
        }
        .toast-notification.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 0.9rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 580px; } 
            .flashcard-front .word { font-size: 2.8rem; } 
            .flashcard-back .definition { font-size: 1.15rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 7</h1>
        <p class="subtitle">Our Relationship With Nature</p>
    </header>

    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Flora & Fauna')">Flora & Fauna</button>
        <button class="filter-btn" onclick="filterTopic('Ecology & Habitat')">Ecology & Habitat</button>
        <button class="filter-btn" onclick="filterTopic('Threats & Conservation')">Threats & Conservation</button>
        <button class="filter-btn" onclick="filterTopic('Action & Impact')">Action & Impact</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Descriptions')">Idioms & Descriptions</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--badge-bg); border: none; color: var(--badge-text);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Cards Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    const vocabBank = [
        // --- Flora & Fauna ---
        { topic: "Flora & Fauna", word: "Gecko", phonetic: "/ˈɡekəʊ/", form: "Noun", forms: "N/A", def: "A small lizard with wide feet, found especially in warm countries.", translation: "Tắc kè", example: "The gecko effortlessly climbed up the smooth glass window." },
        { topic: "Flora & Fauna", word: "Hummingbird", phonetic: "/ˈhʌmɪŋbɜːd/", form: "Noun", forms: "N/A", def: "A very small, brightly colored bird with a long beak that can hover in the air by beating its wings very fast.", translation: "Chim ruồi", example: "A tiny hummingbird hovered near the brightly colored tropical flowers." },
        { topic: "Flora & Fauna", word: "Parasite", phonetic: "/ˈpærəsaɪt/", form: "Noun", forms: "Adj: Parasitic", def: "An animal or plant that lives on or in another animal or plant of a different type and feeds from it.", translation: "Ký sinh trùng", example: "Fleas are a common parasite found on domestic pets like dogs and cats." },
        { topic: "Flora & Fauna", word: "Sea urchin", phonetic: "/ˈsiː ˌɜːtʃɪn/", form: "Noun", forms: "N/A", def: "A small sea creature that lives in water and has a round shell covered with sharp spikes.", translation: "Nhím biển", example: "Be careful not to step on a sea urchin when wading in the shallow reefs." },
        { topic: "Flora & Fauna", word: "Herbivore", phonetic: "/ˈhɜːbɪvɔː(r)/", form: "Noun", forms: "Adj: Herbivorous", def: "An animal that eats only plants.", translation: "Động vật ăn cỏ", example: "Cows and sheep are herbivores, grazing primarily on grass." },
        { topic: "Flora & Fauna", word: "Carnivore", phonetic: "/ˈkɑːnɪvɔː(r)/", form: "Noun", forms: "Adj: Carnivorous", def: "An animal that eats meat.", translation: "Động vật ăn thịt", example: "Lions and tigers are apex carnivores in their respective habitats." },
        { topic: "Flora & Fauna", word: "Flora", phonetic: "/ˈflɔːrə/", form: "Noun", forms: "Opposite: Fauna", def: "All the plants of a particular place or from a particular time in history.", translation: "Hệ thực vật", example: "The island is famous for its unique flora, much of which is found nowhere else." },
        { topic: "Flora & Fauna", word: "Microorganism", phonetic: "/ˌmaɪkrəʊˈɔːɡənɪzəm/", form: "Noun", forms: "N/A", def: "A living thing that on its own is too small to be seen without a microscope.", translation: "Vi sinh vật", example: "Soil is teeming with microorganisms that help break down organic matter." },
        { topic: "Flora & Fauna", word: "Colony", phonetic: "/ˈkɒləni/", form: "Noun", forms: "V: Colonize", def: "A group of animals, insects, or plants of the same type that live together.", translation: "Bầy, đàn, tập đoàn (sinh học)", example: "Ants live in highly organized colonies with a strict social hierarchy." },
        
        // --- STREAMING_CHUNK:Ecology & Habitat Data ---
        // --- Ecology & Habitat ---
        { topic: "Ecology & Habitat", word: "Habitat", phonetic: "/ˈhæbɪtæt/", form: "Noun", forms: "N/A", def: "The natural environment in which an animal or plant usually lives.", translation: "Môi trường sống", example: "The destruction of their natural habitat is threatening the survival of orangutans." },
        { topic: "Ecology & Habitat", word: "Ecosystem", phonetic: "/ˈiːkəʊsɪstəm/", form: "Noun", forms: "N/A", def: "All the living things in an area and the way they affect each other and the environment.", translation: "Hệ sinh thái", example: "Pollution can have disastrous effects on the delicate balance of a marine ecosystem." },
        { topic: "Ecology & Habitat", word: "Biodiversity", phonetic: "/ˌbaɪəʊdaɪˈvɜːsəti/", form: "Noun", forms: "Adj: Biodiverse", def: "The number and types of plants and animals that exist in a particular area or in the world generally.", translation: "Đa dạng sinh học", example: "The Amazon rainforest is renowned for its incredible biodiversity." },
        { topic: "Ecology & Habitat", word: "Monocrop", phonetic: "/ˈmɒnəʊkrɒp/", form: "Noun", forms: "N: Monoculture", def: "A single crop grown over a large area, often year after year.", translation: "Cây trồng độc canh", example: "Relying on monocrops makes agricultural systems highly vulnerable to diseases." },
        { topic: "Ecology & Habitat", word: "Dead zone", phonetic: "/ˈded zəʊn/", form: "Noun Phrase", forms: "N/A", def: "An area of an ocean or lake that has too little oxygen to support marine life.", translation: "Vùng biển chết (thiếu oxy)", example: "Fertilizer runoff creates massive dead zones in the Gulf of Mexico every summer." },
        { topic: "Ecology & Habitat", word: "Food security", phonetic: "/fuːd sɪˈkjʊərəti/", form: "Noun Phrase", forms: "N/A", def: "The fact of a place having enough acceptable food for its population to live.", translation: "An ninh lương thực", example: "Climate change is considered a major threat to global food security." },
        { topic: "Ecology & Habitat", word: "Megacity", phonetic: "/ˈmeɡəsɪti/", form: "Noun", forms: "N/A", def: "A very large city, typically one with a population of over ten million people.", translation: "Siêu đô thị", example: "Tokyo and Jakarta are examples of rapidly expanding megacities." },
        { topic: "Ecology & Habitat", word: "Concrete jungle", phonetic: "/ˌkɒŋkriːt ˈdʒʌŋɡl/", form: "Noun Phrase", forms: "N/A", def: "An ugly network of buildings and roads in a city with very few trees or plants.", translation: "Rừng bê tông (đô thị ngột ngạt)", example: "After moving from the countryside, she felt suffocated in the concrete jungle of New York." },

        // --- STREAMING_CHUNK:Threats & Conservation Data ---
        // --- Threats & Conservation ---
        { topic: "Threats & Conservation", word: "Menace", phonetic: "/ˈmenəs/", form: "Noun/Verb", forms: "Adj: Menacing", def: "Something that is likely to cause harm; a threat.", translation: "Mối đe dọa", example: "Plastic pollution is a growing menace to marine life across the globe." },
        { topic: "Threats & Conservation", word: "Culprit", phonetic: "/ˈkʌlprɪt/", form: "Noun", forms: "N/A", def: "A fact or situation that is the reason for something bad happening.", translation: "Thủ phạm, nguyên nhân chính", example: "Industrial emissions are the main culprit behind the rise in global temperatures." },
        { topic: "Threats & Conservation", word: "Enigma", phonetic: "/ɪˈnɪɡmə/", form: "Noun", forms: "Adj: Enigmatic", def: "Something that is mysterious and seems impossible to understand completely.", translation: "Điều bí ẩn", example: "The sudden disappearance of the bee colonies remains an enigma to scientists." },
        { topic: "Threats & Conservation", word: "Infestation", phonetic: "/ˌɪnfeˈsteɪʃn/", form: "Noun", forms: "V: Infest", def: "A large number of animals and insects that carry disease, that are present where they are not wanted.", translation: "Sự phá hoại (của sâu bọ)", example: "The farmer's crops were ruined by a severe locust infestation." },
        { topic: "Threats & Conservation", word: "Demise", phonetic: "/dɪˈmaɪz/", form: "Noun", forms: "N/A", def: "The end of something that was previously considered to be powerful, such as a business, industry, or system.", translation: "Sự diệt vong, sự kết thúc", example: "Deforestation contributed heavily to the demise of several indigenous bird species." },
        { topic: "Threats & Conservation", word: "Ravaged", phonetic: "/ˈrævɪdʒd/", form: "Adjective", forms: "V: Ravage", def: "Severely damaged or devastated.", translation: "Bị tàn phá nặng nề", example: "The coastal town was completely ravaged by the hurricane." },

        { topic: "Idioms & Descriptions", word: "Majestic", phonetic: "/məˈdʒestɪk/", form: "Adjective", forms: "N: Majesty", def: "Beautiful, powerful, or causing great admiration and respect.", translation: "Hùng vĩ, tráng lệ", example: "The majestic eagle soared high above the mountain peaks." },
        { topic: "Idioms & Descriptions", word: "Astonishing", phonetic: "/əˈstɒnɪʃɪŋ/", form: "Adjective", forms: "V: Astonish | N: Astonishment", def: "Very surprising; difficult to believe.", translation: "Đáng kinh ngạc", example: "The speed at which the glacier is melting is truly astonishing." },

        { topic: "Idioms & Descriptions", word: "Let alone", phonetic: "/let əˈləʊn/", form: "Phrase", forms: "N/A", def: "Used after a statement to emphasize that because the first thing is not true or possible, the next thing cannot be true or possible either.", translation: "Huống hồ, chưa nói đến", example: "Some people don't even recycle paper, let alone pursue a fully green lifestyle." }

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border: none; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related/Notes:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">"${item.example}"</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            
            let cleanText = text.replace(/\bsth\b/g, 'something').replace(/\bsb\b/g, 'somebody');
            cleanText = cleanText.replace(/\(.*?\)/g, ''); 
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; 
            
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Google UK English') || 
                voice.name.includes('Daniel') || 
                voice.name.includes('Samantha')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); 
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Flora')) topicName = 'Flora & Fauna';
            else if (activeFilterText.includes('Ecology')) topicName = 'Ecology & Habitat';
            else if (activeFilterText.includes('Threats')) topicName = 'Threats & Conservation';
            else if (activeFilterText.includes('Action')) topicName = 'Action & Impact';
            else if (activeFilterText.includes('Idioms')) topicName = 'Idioms & Descriptions';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related/Notes:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">"${data.example}"</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    window.onload = function() {
        renderGrid();
    };

</script>
</body>
</html>
