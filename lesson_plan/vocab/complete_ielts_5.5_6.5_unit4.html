<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 5.5-6.5 | Unit 4 - New Media</title>
    
    <!-- Google Fonts: Playfair Display (Elegant Serif), Jost (Modern Sans), Caveat (Cursive) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme: Fresh Pastel Mint & Soft Coral */
            --primary: #0d9488; /* Teal 600 - Main text & accents */
            --primary-light: #ccfbf1; /* Teal 50 - Soft backgrounds */
            --primary-hover: #0f766e; /* Teal 700 - Hover states */
            --text-main: #334155; /* Slate 700 - Standard body text */
            --text-muted: #64748b; /* Slate 500 - Secondary text */
            --bg-body: #f0fdfa; /* Teal 50 (very light) - Page background */
            --card-bg: #ffffff;
            --accent: #fb7185; /* Rose 400 - Coral pop color */
            --accent-light: #ffe4e6; /* Rose 50 - Very light coral */
            --border: #99f6e4; /* Teal 200 - Borders */
            --badge-bg: #fef08a; /* Yellow 200 */
            --badge-text: #b45309; /* Amber 700 */
            --success: #0284c7; /* Sky 600 for translation text */
            
            --font-headings: 'Playfair Display', serif;
            --font-body: 'Jost', sans-serif;
            --font-cursive: 'Caveat', cursive;
            --font-ipa: Arial, Helvetica, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6; 
            padding-bottom: 3rem; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        header { text-align: center; margin-top: 2.5rem; margin-bottom: 2.5rem; }
        h1 { 
            color: var(--primary); 
            font-size: 2.8rem; 
            margin-bottom: 0.5rem; 
            font-weight: 800; 
            font-family: var(--font-headings); 
            letter-spacing: -0.02em;
        }
        .subtitle { 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            letter-spacing: 0.1em; 
            text-transform: uppercase; 
        }

        .filter-controls { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .filter-btn { 
            padding: 0.5rem 1.2rem; 
            font-size: 0.95rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--primary); 
            border: 2px solid var(--primary-light); 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .filter-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25); 
        }
        .filter-btn:hover:not(.active) { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }

        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { 
            padding: 0.75rem 1.5rem; 
            font-size: 1rem; 
            font-weight: 600; 
            background: var(--card-bg); 
            color: var(--text-muted); 
            border: 2px solid #cbd5e1; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
        }
        .view-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
            box-shadow: 0 4px 12px rgba(251, 113, 133, 0.3); 
        }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        .vocab-card { 
            background-color: var(--card-bg); 
            border-radius: 20px; 
            padding: 2rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border); 
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
            display: flex; 
            flex-direction: column; 
        }
        .vocab-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 30px -10px rgba(13, 148, 136, 0.15); 
            border-color: var(--primary); 
        }
        .vocab-card.hidden { display: none; }
        
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 2px dashed var(--border); padding-bottom: 1rem; }
        .word-main { display: flex; align-items: center; gap: 1rem; }
        .word { font-size: 1.8rem; font-weight: 700; color: var(--primary); text-transform: capitalize; font-family: var(--font-headings); }
        
        .audio-btn { 
            background: var(--primary-light); 
            border: none; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            transition: all 0.2s ease; 
            color: var(--primary); 
        }
        .audio-btn:hover { 
            transform: scale(1.1) rotate(5deg); 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.3); 
        }
        
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        .phonetic { font-size: 1.1rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); letter-spacing: 0.02em; }
        
        .word-families { 
            background-color: #f8fafc; 
            border: 1px dashed #cbd5e1; 
            padding: 0.75rem; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            color: #475569; 
            margin-bottom: 1.2rem; 
            line-height: 1.4; 
        }
        .word-families strong { color: var(--primary); font-weight: 600; }

        .topic-tag { 
            font-size: 0.75rem; 
            color: var(--badge-text); 
            background: var(--badge-bg); 
            padding: 0.35rem 0.8rem; 
            border-radius: 20px; 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            display: inline-block; 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
        }
        
        .definition { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-main); font-weight: 500; }
        .translation { font-size: 1.05rem; color: var(--success); margin-bottom: 1.5rem; font-weight: 600; }

        .example-box { 
            background-color: var(--accent-light); 
            padding: 1.5rem; 
            border-left: 5px solid var(--accent); 
            border-radius: 12px; 
            margin-top: auto; 
            position: relative;
        }
        .example-box::before {
            content: '"';
            position: absolute;
            top: 0;
            right: 15px;
            font-family: var(--font-headings);
            font-size: 4rem;
            color: var(--accent);
            opacity: 0.2;
            line-height: 1;
        }
        .example-box span.lbl { display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 0.5rem; font-weight: 700; }
        .example-text { font-family: var(--font-cursive); font-size: 1.4rem; color: #be123c; line-height: 1.4; font-weight: 500;}

        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 750px; height: 500px; perspective: 1200px; cursor: pointer; margin-bottom: 2.5rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        
        .flashcard-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(13, 148, 136, 0.15); 
            border: 3px solid var(--primary-light); 
            background: var(--card-bg); 
            padding: 3rem; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow-y: auto; 
        }
        
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 4rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800; font-family: var(--font-headings); letter-spacing: -0.02em;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
        .flashcard-front .audio-btn { width: 60px; height: 60px; }
        .flashcard-front .audio-btn svg { width: 28px; height: 28px; }
        .flashcard-front .phonetic { font-size: 1.6rem; color: var(--text-muted); font-style: italic; font-family: var(--font-ipa); }
        
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-family: var(--font-headings); }
        .flashcard-back .definition { font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.5;}
        .flashcard-back .translation { font-size: 1.3rem; margin-bottom: 2rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; padding: 1.5rem; border-radius: 16px; background-color: var(--accent-light); border-left: 5px solid var(--accent);}
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; opacity: 0.7;}

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 3rem; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0.8rem 1.8rem; border-radius: 30px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); color: var(--primary-hover); transform: translateY(-2px);}
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none;}
        .fc-counter { font-weight: 800; font-size: 1.3rem; color: var(--accent); min-width: 90px; text-align: center; font-family: var(--font-headings); }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-hover);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) { 
            h1 { font-size: 2.2rem; } 
            .subtitle { font-size: 1rem; }
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 550px; } 
            .flashcard-front .word { font-size: 3rem; } 
            .flashcard-back .definition { font-size: 1.2rem; }
            .flashcard-face { padding: 2rem 1.5rem; }
            .example-text { font-size: 1.2rem; }
            .flashcard-controls { padding: 1rem; width: 100%; justify-content: space-between;}
            .fc-btn { padding: 0.8rem 1rem; }
            .toast-notification { bottom: 20px; right: 20px; left: 20px; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Complete IELTS 5.5-6.5 | Unit 4</h1>
        <p class="subtitle">New Media</p>
    </header>

    <!-- Topic Filters -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Terms</button>
        <button class="filter-btn" onclick="filterTopic('Tech & Digital World')">Tech & Digital World</button>
        <button class="filter-btn" onclick="filterTopic('Communication & Interaction')">Communication</button>
        <button class="filter-btn" onclick="filterTopic('Information & Media')">Information & Media</button>
        <button class="filter-btn" onclick="filterTopic('Business & Development')">Business & Development</button>
        <button class="filter-btn" onclick="filterTopic('Idioms & Phrasal Verbs')">Idioms & Phrases</button>
    </div>

    <!-- View Toggles -->
    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1rem; max-width: 85%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 85%; background-color: var(--accent-light); border-color: #fbcfe8; color: var(--accent);">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Topic</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples injected via JS -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / X</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 30px; background: #cbd5e1; margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀 Shuffle</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<!-- Custom Toast Notification -->
<div id="custom-toast" class="toast-notification">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
    <span id="toast-message">Notification</span>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 5.5-6.5 Unit 4 - New Media)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- Tech & Digital World ---
        { topic: "Tech & Digital World", word: "Tech giant", phonetic: "/tek ˈdʒaɪənt/", form: "Noun phrase", forms: "N/A", def: "A very large and successful multinational technology company.", translation: "Gã khổng lồ công nghệ", example: "Tech giants like Apple and Google have a massive influence on global communication." },
        { topic: "Tech & Digital World", word: "Platform", phonetic: "/ˈplætfɔːm/", form: "Noun", forms: "N/A", def: "A digital system, framework, or app where users can communicate, operate software, or share content.", translation: "Nền tảng", example: "Many independent artists use digital platforms to share their music with the world." },
        { topic: "Tech & Digital World", word: "Virtual world", phonetic: "/ˈvɜːtʃuəl wɜːld/", form: "Noun phrase", forms: "Adj: Virtual", def: "A computer-simulated environment which may be populated by many users who can create a personal avatar.", translation: "Thế giới ảo", example: "Teenagers are spending an increasing amount of time interacting in the virtual world." },
        { topic: "Tech & Digital World", word: "Interface", phonetic: "/ˈɪntəfeɪs/", form: "Noun", forms: "N/A", def: "The way in which a computer program presents information to a user or receives information from them.", translation: "Giao diện", example: "The new application has a highly intuitive and colorful interface." },
        { topic: "Tech & Digital World", word: "User-friendly", phonetic: "/ˌjuːzəˈfrendli/", form: "Adjective", forms: "N/A", def: "Simple for people to use or understand; not complicated.", translation: "Thân thiện với người dùng, dễ sử dụng", example: "We need to ensure that the new software is user-friendly for older generations." },
        { topic: "Tech & Digital World", word: "Computer-literate", phonetic: "/kəmˌpjuːtəˈlɪtərət/", form: "Adjective", forms: "N: Computer literacy", def: "Able to use computers effectively and understand how they work.", translation: "Thành thạo/Biết sử dụng máy tính", example: "In today's job market, it is essential to be computer-literate." },

        // --- Communication & Interaction ---
        { topic: "Communication & Interaction", word: "Collaborate", phonetic: "/kəˈlæbəreɪt/", form: "Verb", forms: "N: Collaboration | Adj: Collaborative", def: "To work together with someone else for a special purpose, often to create something.", translation: "Hợp tác, cộng tác", example: "Students can easily collaborate on projects using cloud-based document sharing." },
        { topic: "Communication & Interaction", word: "Anonymous", phonetic: "/əˈnɒnɪməs/", form: "Adjective", forms: "N: Anonymity | Adv: Anonymously", def: "Made or done by someone whose name is not known or not made public.", translation: "Ẩn danh, giấu tên", example: "The forum allows users to post questions and share experiences completely anonymous." },
        { topic: "Communication & Interaction", word: "Peer", phonetic: "/pɪə(r)/", form: "Noun", forms: "N/A", def: "A person who is the same age or has the same social position or the same abilities as other people in a group.", translation: "Người cùng trang lứa, đồng nghiệp", example: "Social media greatly influences how teenagers interact with their peers." },
        { topic: "Communication & Interaction", word: "Personal touch", phonetic: "/ˈpɜːsənl tʌtʃ/", form: "Noun phrase", forms: "N/A", def: "An original, friendly, or caring addition that someone gives to a task or communication.", translation: "Dấu ấn cá nhân, sự quan tâm mang tính cá nhân", example: "Sending a handwritten letter instead of an email adds a wonderful personal touch." },
        { topic: "Communication & Interaction", word: "Express affection", phonetic: "/ɪkˈspres əˈfekʃn/", form: "Phrase", forms: "Adj: Affectionate", def: "To show feelings of liking or love towards someone.", translation: "Bày tỏ tình cảm", example: "People use emojis in text messages to easily express affection and emotion." },

        // --- Information & Media ---
        { topic: "Information & Media", word: "Superficial", phonetic: "/ˌsuːpəˈfɪʃl/", form: "Adjective", forms: "N: Superficiality | Adv: Superficially", def: "Never thinking about things that are serious or important; only appearing true until examined closely.", translation: "Hời hợt, nông cạn, bề ngoài", example: "Scrolling through headlines only gives a superficial understanding of global news." },
        { topic: "Information & Media", word: "Digest", phonetic: "/daɪˈdʒest/", form: "Verb", forms: "N: Digestion | Adj: Digestible", def: "To read or hear new information and take the necessary time to fully understand it.", translation: "Tiêu hóa (kiến thức), nghiền ngẫm hiểu thấu", example: "There was so much raw data in the report that it took me hours to digest it all." },
        { topic: "Information & Media", word: "Narrative", phonetic: "/ˈnærətɪv/", form: "Noun", forms: "V: Narrate | N: Narrator", def: "A story or a description of a series of events; the way a story is told.", translation: "Câu chuyện, lời kể, tường thuật", example: "The media often shapes the public narrative surrounding political events." },
        { topic: "Information & Media", word: "Browse", phonetic: "/braʊz/", form: "Verb", forms: "N: Browser", def: "To look through a website, book, or magazine without reading everything.", translation: "Lướt (web), xem lướt qua", example: "I was just browsing the internet for some travel inspiration when I found this site." },
        { topic: "Information & Media", word: "Misleading", phonetic: "/mɪsˈliːdɪŋ/", form: "Adjective", forms: "V: Mislead", def: "Causing someone to believe something that is not true.", translation: "Gây hiểu nhầm, sai lệch", example: "The advertisement was heavily criticized for being deceptive and misleading." },
        { topic: "Information & Media", word: "Cursory", phonetic: "/ˈkɜːsəri/", form: "Adjective", forms: "Adv: Cursorily", def: "Quick and probably not detailed or thorough.", translation: "Nhanh, lướt qua, sơ sài", example: "He gave the email a cursory glance before deleting it." },

        // --- Business & Development ---
        { topic: "Business & Development", word: "Launch", phonetic: "/lɔːntʃ/", form: "Verb", forms: "N: Launch", def: "To begin something such as a plan or introduce something new such as a product.", translation: "Khởi chạy, ra mắt", example: "The tech startup is preparing to launch its highly anticipated mobile app next month." },
        { topic: "Business & Development", word: "Recruit", phonetic: "/rɪˈkruːt/", form: "Verb", forms: "N: Recruitment | N: Recruiter", def: "To persuade someone to work for a company or become a new member of an organization.", translation: "Tuyển dụng, chiêu mộ", example: "Companies now actively use social media platforms to recruit young talent." },
        { topic: "Business & Development", word: "Transform", phonetic: "/trænsˈfɔːm/", form: "Verb", forms: "N: Transformation", def: "To change completely the appearance or character of something or someone.", translation: "Biến đổi, thay đổi hoàn toàn", example: "Smartphones have completely transformed the way we consume daily information." },
        { topic: "Business & Development", word: "Proliferate", phonetic: "/prəˈlɪfəreɪt/", form: "Verb", forms: "N: Proliferation", def: "To increase a lot and suddenly in number.", translation: "Tăng sinh, nảy nở nhanh chóng", example: "Online streaming services have proliferated rapidly over the last decade." },
        { topic: "Business & Development", word: "Incentive", phonetic: "/ɪnˈsentɪv/", form: "Noun", forms: "V: Incentivize", def: "Something that encourages a person to do something.", translation: "Động lực, sự khích lệ", example: "Financial bonuses offer a strong incentive for employees to increase productivity." },

        // --- Idioms & Phrasal Verbs ---
        { topic: "Idioms & Phrasal Verbs", word: "Bring about", phonetic: "/brɪŋ əˈbaʊt/", form: "Phrasal Verb", forms: "N/A", def: "To cause something to happen.", translation: "Mang lại, gây ra", example: "The widespread adoption of the internet has brought about massive social changes." },
        { topic: "Idioms & Phrasal Verbs", word: "Pay off", phonetic: "/peɪ ɒf/", form: "Phrasal Verb", forms: "N/A", def: "If something you have done pays off, it is successful and yields good results.", translation: "Mang lại kết quả tốt, được đền đáp", example: "All those late nights learning how to code finally paid off when she got the job." },
        { topic: "Idioms & Phrasal Verbs", word: "Bear in mind", phonetic: "/beər ɪn maɪnd/", form: "Phrase", forms: "N/A", def: "To remember a piece of information when you are making a decision or thinking about a matter.", translation: "Ghi nhớ, lưu trí", example: "When using social media, always bear in mind that not everything you see is true." },
        { topic: "Idioms & Phrasal Verbs", word: "Pop into your head", phonetic: "/pɒp ˈɪntuː jɔː hed/", form: "Idiom", forms: "N/A", def: "To suddenly think of something.", translation: "Nảy ra trong đầu (ý tưởng)", example: "A brilliant idea for the marketing campaign suddenly popped into her head." },
        { topic: "Idioms & Phrasal Verbs", word: "Be fed up with", phonetic: "/biː fed ʌp wɪð/", form: "Idiom", forms: "N/A", def: "Bored, annoyed, or disappointed, especially by something that you have experienced for too long.", translation: "Chán ngấy với", example: "Many users are fed up with being constantly bombarded by spam messages and ads." },
        { topic: "Idioms & Phrasal Verbs", word: "Stay in touch", phonetic: "/steɪ ɪn tʌtʃ/", form: "Phrase", forms: "N/A", def: "To continue to communicate with someone by calling or writing to them.", translation: "Giữ liên lạc", example: "Despite living on different continents, the two friends use video calls to stay in touch." }
    ];

    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Main Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: var(--badge-bg); border-color: #fde047; color: var(--badge-text); margin-top: -0.5rem;"><strong>Related:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span class="lbl">Usage Example</span><span class="example-text">${item.example}</span>
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Custom Toast Notification function to replace alerts
    function showNotification(message) {
        const toast = document.getElementById('custom-toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = message;
        
        toast.classList.add('show');
        
        // Hide after 3.5 seconds
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3500);
    }

    let voices = [];
    if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
            voices = window.speechSynthesis.getVoices();
        };
    }

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9; // Slightly slower for language learning
            
            // Try to find a good British or clear female voice
            let selectedVoice = voices.find(voice => 
                voice.name.includes('Female') || 
                voice.name.includes('Samantha') || 
                voice.name.includes('Victoria') || 
                voice.name.includes('Google UK English Female')
            );
            
            if (!selectedVoice) {
                selectedVoice = voices.find(voice => voice.lang.includes('en-GB') || voice.lang.includes('en-US'));
            }
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        } else {
            showNotification("Text-to-speech is not supported in this browser.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation(); // Prevent flipping the card
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    function filterTopic(topicName) {
        // Update active button styling
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Filter Grid View
        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        // Filter Flashcard View Data if active
        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            // Determine active filter to sync flashcards
            const activeFilterText = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            
            if (activeFilterText.includes('Tech')) topicName = 'Tech & Digital World';
            else if (activeFilterText.includes('Communication')) topicName = 'Communication & Interaction';
            else if (activeFilterText.includes('Information')) topicName = 'Information & Media';
            else if (activeFilterText.includes('Business')) topicName = 'Business & Development';
            else if (activeFilterText.includes('Idioms')) topicName = 'Idioms & Phrasal Verbs';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) {
            document.getElementById('fc-word').textContent = "No Words Found";
            return;
        }
        const data = flashcardData[currentCardIndex];
        
        // Remove flip class if present to reset face before injecting data
        flashcardScene.classList.remove('is-flipped');
        
        // Delay content injection slightly so it happens during/after the flip animation back
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Main Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; border-radius: 10px;">
                    <span class="lbl" style="color: var(--accent);">Usage Example</span>
                    <span class="example-text" style="text-transform: none; letter-spacing: normal;">${data.example}</span>
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    
    function nextCard() { 
        if (currentCardIndex < flashcardData.length - 1) { 
            currentCardIndex++; 
            updateFlashcardUI(); 
        } 
    }
    
    function prevCard() { 
        if (currentCardIndex > 0) { 
            currentCardIndex--; 
            updateFlashcardUI(); 
        } 
    }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
        showNotification("Flashcards Shuffled!");
    }

    // Initialize application
    window.onload = function() {
        renderGrid();
    };

</script>
</body>
</html>
