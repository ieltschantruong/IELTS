<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete IELTS 6.5-7.5 | Unit 1 - Vocabulary</title>
    <style>
        :root {
            /* Theme: Deep Ocean Blue & Sunrise Orange */
            --primary: #1e3a8a; /* Blue 900 */
            --primary-light: #dbeafe; /* Blue 100 */
            --primary-hover: #1e40af; /* Blue 800 */
            --text-main: #1e293b;
            --text-muted: #475569;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --accent: #ea580c; /* Orange 600 */
            --accent-light: #ffedd5; /* Orange 100 */
            --border: #bfdbfe; /* Blue 200 */
            --badge-bg: #e0f2fe; /* Sky 100 */
            --badge-text: #0369a1; /* Sky 700 */
            --success: #059669; /* Emerald 600 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; padding-bottom: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        .copyright-banner { background-color: var(--primary); color: white; text-align: center; padding: 0.6rem 1rem; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.05em; width: 100%; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(30, 58, 138, 0.2); }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 0.5rem; font-weight: 800; }

        /* Topic Filter Controls */
        .filter-controls { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn { padding: 0.5rem 1.2rem; font-size: 0.9rem; font-weight: 600; background: var(--card-bg); color: var(--primary); border: 2px solid var(--primary); border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 6px rgba(30, 58, 138, 0.3); }
        .filter-btn:hover:not(.active) { background: var(--primary-light); }

        /* View Toggles */
        .view-controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; }
        .view-btn { padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; background: var(--card-bg); color: var(--text-muted); border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; }
        .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 6px rgba(234, 88, 12, 0.3); }
        .view-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

        /* Grid View Styles */
        #grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
        .vocab-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); border: 1px solid var(--primary-light); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .vocab-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(30, 58, 138, 0.15); border-color: var(--border); }
        .vocab-card.hidden { display: none; }
        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; border-bottom: 2px dashed var(--border); padding-bottom: 0.75rem; }
        .word-main { display: flex; align-items: center; gap: 0.5rem; }
        .word { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0.4rem; border-radius: 50%; transition: transform 0.2s, background-color 0.2s; color: var(--primary); }
        .audio-btn:hover { transform: scale(1.1); background-color: var(--primary-light); }
        .meta-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.25rem; }
        
        .word-families { background-color: #f1f5f9; border: 1px dashed #cbd5e1; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; color: #475569; margin-bottom: 1rem; }
        .word-families strong { color: var(--primary); }

        .topic-tag { font-size: 0.8rem; color: var(--badge-text); background: var(--badge-bg); padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: bold; margin-bottom: 1rem; display: inline-block;}
        
        .definition { font-size: 1rem; margin-bottom: 0.25rem; color: var(--text-main); }
        .definition strong { color: var(--primary); }
        
        /* Translation and Usage */
        .translation { font-size: 0.95rem; color: var(--success); margin-bottom: 0.5rem; font-weight: 600; }

        .example-box { background-color: var(--primary-light); padding: 1rem; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 0.95rem; color: var(--text-main); margin-top: auto; }
        .example-box span { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary-hover); margin-bottom: 0.35rem; font-weight: 800; }

        /* Flashcard View Styles */
        #flashcard-view { display: none; flex-direction: column; align-items: center; width: 100%; }
        .flashcard-scene { width: 100%; max-width: 650px; height: 500px; perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .flashcard-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .flashcard-scene.is-flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15); border: 2px solid var(--primary-light); background: var(--card-bg); padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .flashcard-front { text-align: center; }
        .flashcard-front .word { font-size: 2.8rem; margin-bottom: 1rem; color: var(--primary); font-weight: 800;}
        .flashcard-front .meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .flashcard-front .audio-btn { font-size: 2rem; background: var(--primary-light); padding: 0.8rem; }
        .flashcard-front .phonetic { font-size: 1.3rem; color: var(--text-muted); font-style: italic; }
        .flashcard-back { transform: rotateY(180deg); background: #f8fafc; align-items: flex-start; text-align: left; }
        .flashcard-back h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; }
        
        .flashcard-back .definition { font-size: 1.15rem; margin-bottom: 0.5rem; color: var(--text-main); }
        .flashcard-back .translation { font-size: 1.1rem; margin-bottom: 1rem; color: var(--success); font-weight: 600;}
        .flashcard-back .example-box { width: 100%; font-size: 1rem; padding: 1rem; border-radius: 12px; }
        
        .flashcard-hint { position: absolute; bottom: 1.5rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; }

        .flashcard-controls { display: flex; align-items: center; gap: 1.5rem; background: var(--card-bg); padding: 1rem 2rem; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .fc-btn { background: none; border: none; color: var(--primary); font-size: 1rem; font-weight: 700; cursor: pointer; padding: 0.5rem 1.2rem; border-radius: 20px; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
        .fc-btn:hover:not(:disabled) { background: var(--primary-light); }
        .fc-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .fc-counter { font-weight: 800; font-size: 1.1rem; color: var(--accent); min-width: 70px; text-align: center; }

        @media (max-width: 768px) { 
            h1 { font-size: 1.8rem; } 
            #grid-view { grid-template-columns: 1fr; } 
            .flashcard-scene { height: 600px; } 
            .flashcard-front .word { font-size: 2.2rem; } 
            .flashcard-back .definition { font-size: 1rem; }
            .flashcard-face { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="copyright-banner">&copy; IELTS Chan Truong</div>

<div class="container">
    <header>
        <h1>Complete IELTS 6.5-7.5 | Unit 1</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; font-weight: 500;">Reading & Speaking Vocabulary (108 Essential Terms)</p>
    </header>

    <!-- Topic Filter -->
    <div class="filter-controls" id="topic-filters">
        <button class="filter-btn active" onclick="filterTopic('all')">All Vocabulary</button>
        <button class="filter-btn" onclick="filterTopic('Reading')">Reading Focus</button>
        <button class="filter-btn" onclick="filterTopic('Speaking')">Speaking Focus</button>
    </div>

    <div class="view-controls">
        <button class="view-btn active" id="btn-grid" onclick="switchView('grid')">📄 List View</button>
        <button class="view-btn" id="btn-flashcards" onclick="switchView('flashcards')">🗂️ Flashcards</button>
    </div>

    <!-- FLASHCARD VIEW -->
    <div id="flashcard-view">
        <div class="flashcard-scene" id="flashcard-scene" onclick="flipCard()">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <h2 class="word" id="fc-word">Word</h2>
                    <div class="meta-row">
                        <span class="phonetic" id="fc-phonetic">/wɜːd/</span>
                        <button class="audio-btn" id="fc-audio" onclick="playAudioFromCard(event)" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="word-families" id="fc-forms" style="margin-top: 1.5rem; max-width: 80%;">Form</div>
                    <div class="word-families" id="fc-related" style="margin-top: 0.5rem; max-width: 80%; background-color: #fef08a; border-color: #fde047; color: #854d0e;">Related Forms</div>
                    <span class="topic-tag" id="fc-topic" style="margin-top: 1rem;">Skill</span>
                    <span class="flashcard-hint">Click card to flip</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <h3>Meaning</h3>
                    <p class="definition" id="fc-definition">Definition goes here.</p>
                    <p class="translation" id="fc-translation">Vietnamese goes here.</p>
                    <div id="fc-example-container" style="width: 100%; margin-top: 1.5rem;">
                        <!-- Examples will be injected here -->
                    </div>
                    <span class="flashcard-hint" style="left: 50%; transform: translateX(-50%);">Click card to flip back</span>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button class="fc-btn" id="fc-prev" onclick="prevCard()">◀ Prev</button>
            <span class="fc-counter" id="fc-counter">1 / 108</span>
            <button class="fc-btn" id="fc-next" onclick="nextCard()">Next ▶</button>
            <div style="width: 2px; height: 24px; background: var(--border); margin: 0 0.5rem;"></div>
            <button class="fc-btn" onclick="shuffleCards()" title="Shuffle Order">🔀</button>
        </div>
    </div>

    <!-- GRID VIEW -->
    <main id="grid-view">
        <!-- Injected via JavaScript -->
    </main>
</div>

<script>
    // ---------------------------------------------------------
    // Vocabulary Bank (Complete IELTS 6.5-7.5 Unit 1)
    // ---------------------------------------------------------
    const vocabBank = [
        // --- READING ---
        { topic: "Reading", word: "Hub", phonetic: "/hʌb/", form: "Noun", forms: "N/A", def: "The central or main part of something where there is most activity.", translation: "Trung tâm", example: "The airport has become a major hub for international flights." },
        { topic: "Reading", word: "Sensor", phonetic: "/ˈsensə(r)/", form: "Noun", forms: "V: Sense | Adj: Sensory, Sensitive", def: "A device that detects or measures a physical property.", translation: "Cảm biến", example: "The security system uses a motion sensor to detect intruders." },
        { topic: "Reading", word: "Virtuoso", phonetic: "/ˌvɜːtʃuˈəʊzəʊ/", form: "Noun", forms: "Adj: Virtuosic", def: "A person highly skilled in music or another artistic pursuit.", translation: "Bậc thầy (nghệ thuật/âm nhạc)", example: "He was a piano virtuoso, capable of playing complex pieces from memory." },
        { topic: "Reading", word: "Corridor", phonetic: "/ˈkɒrɪdɔː(r)/", form: "Noun", forms: "N/A", def: "A long passage in a building from which doors lead into rooms.", translation: "Hành lang", example: "She walked quickly down the hospital corridor." },
        { topic: "Reading", word: "Hammer", phonetic: "/ˈhæmə(r)/", form: "Noun", forms: "V: Hammer", def: "A tool with a heavy head and a handle, used for pounding.", translation: "Cái búa (nghĩa đen/bóng)", example: "He used a hammer to nail the picture to the wall." },
        { topic: "Reading", word: "Anvil", phonetic: "/ˈænvɪl/", form: "Noun", forms: "N/A", def: "A heavy iron block on which heated metal is beaten into shape; also a small bone in the ear.", translation: "Cái đe (nghề rèn / trong tai)", example: "The blacksmith struck the glowing iron on the anvil." },
        { topic: "Reading", word: "Cello", phonetic: "/ˈtʃeləʊ/", form: "Noun", forms: "N: Cellist", def: "A large stringed instrument played with a bow, resting on the floor.", translation: "Đàn cello", example: "She plays the cello in the national symphony orchestra." },
        { topic: "Reading", word: "Contact lens", phonetic: "/ˈkɒntækt lenz/", form: "Noun Phrase", forms: "N/A", def: "A thin plastic lens placed directly on the surface of the eye to correct visual defects.", translation: "Kính áp tròng", example: "He wears contact lenses instead of glasses when playing sports." },
        { topic: "Reading", word: "Alternative energies", phonetic: "/ɔːlˈtɜːnətɪv ˈenədʒiz/", form: "Noun Phrase", forms: "N/A", def: "Usable power that comes from a renewable or green source.", translation: "Năng lượng thay thế", example: "Governments are investing heavily in alternative energies like solar and wind power." },
        { topic: "Reading", word: "Down-to-earth", phonetic: "/ˌdaʊn tu ˈɜːθ/", form: "Adjective", forms: "N/A", def: "With no illusions or pretensions; practical and realistic.", translation: "Thực tế, gần gũi, thân thiện", example: "Despite her fame, the actress remains remarkably down-to-earth." },
        { topic: "Reading", word: "Highly-motivated", phonetic: "/ˈhaɪli ˈməʊtɪveɪtɪd/", form: "Adjective", forms: "V: Motivate | N: Motivation", def: "Very enthusiastic and determined to achieve success.", translation: "Đầy động lực, rất quyết tâm", example: "We are looking to hire a highly-motivated graduate for this role." },
        { topic: "Reading", word: "Hands-on", phonetic: "/ˌhændz ˈɒn/", form: "Adjective", forms: "N/A", def: "Involving or offering active participation rather than theory.", translation: "Thực hành, thực tế", example: "The vocational course offers hands-on experience in carpentry." },
        { topic: "Reading", word: "Vast", phonetic: "/vɑːst/", form: "Adjective", forms: "N: Vastness | Adv: Vastly", def: "Of very great extent or quantity; immense (a lot of).", translation: "Rộng lớn, bao la", example: "The Sahara is a vast desert stretching across northern Africa." },
        { topic: "Reading", word: "Iterative", phonetic: "/ˈɪtərətɪv/", form: "Adjective", forms: "V: Iterate | N: Iteration", def: "Doing something again and again, usually to improve it.", translation: "Lặp đi lặp lại", example: "Software development is an iterative process of testing and fixing bugs." },
        { topic: "Reading", word: "Take something for granted", phonetic: "/teɪk fɔː ˈɡrɑːntɪd/", form: "Phrase", forms: "N/A", def: "To fail to properly appreciate someone or something, often as a result of overfamiliarity.", translation: "Coi điều gì là hiển nhiên", example: "We often take clean drinking water for granted until we travel." },
        { topic: "Reading", word: "At a premium", phonetic: "/ət ə ˈpriːmiəm/", form: "Phrase", forms: "N: Premium", def: "Scarce and therefore in high demand.", translation: "Rất khan hiếm, đắt giá", example: "Space is at a premium in this tiny apartment." },
        { topic: "Reading", word: "Bump into", phonetic: "/bʌmp ˈɪntuː/", form: "Phrasal Verb", forms: "N/A", def: "To meet someone by chance.", translation: "Tình cờ gặp", example: "I bumped into an old school friend at the supermarket." },
        { topic: "Reading", word: "Forge ahead", phonetic: "/fɔːdʒ əˈhed/", form: "Phrasal Verb", forms: "V: Forge", def: "To proceed or move forward with strength and determination.", translation: "Tiến lên mạnh mẽ", example: "Despite the criticism, the team decided to forge ahead with the project." },
        { topic: "Reading", word: "Suffuse", phonetic: "/səˈfjuːz/", form: "Verb", forms: "N: Suffusion", def: "Gradually spread through or over.", translation: "Tràn ngập, lan tỏa", example: "A warm glow suffused the sky as the sun began to set." },
        { topic: "Reading", word: "Conquer", phonetic: "/ˈkɒŋkə(r)/", form: "Verb", forms: "N: Conqueror, Conquest", def: "Successfully overcome a problem, weakness, or fear.", translation: "Chinh phục", example: "She managed to conquer her fear of public speaking." },
        { topic: "Reading", word: "Leap", phonetic: "/liːp/", form: "Noun / Verb", forms: "N/A", def: "A forceful jump or quick movement; a significant advance.", translation: "Bước nhảy vọt", example: "The new technology represents a massive leap forward for medical science." },
        { topic: "Reading", word: "Augment", phonetic: "/ɔːɡˈment/", form: "Verb", forms: "N: Augmentation", def: "Make something greater by adding to it; increase.", translation: "Gia tăng, tăng cường", example: "He took on a second job to augment his income." },
        { topic: "Reading", word: "Found", phonetic: "/faʊnd/", form: "Verb", forms: "N: Foundation, Founder", def: "Establish or originate an institution or organization.", translation: "Thành lập", example: "The charity was founded to help children in poverty." },
        { topic: "Reading", word: "Unleash", phonetic: "/ʌnˈliːʃ/", form: "Verb", forms: "N/A", def: "Release from a leash or restraint.", translation: "Giải phóng, tung ra", example: "The new software update will unleash the full potential of the device." },
        { topic: "Reading", word: "Enshrine", phonetic: "/ɪnˈʃraɪn/", form: "Verb", forms: "N: Shrine", def: "Preserve (a right, tradition, or idea) in a form that ensures it will be protected and respected.", translation: "Trân trọng lưu giữ, ghi nhận (như thiêng liêng)", example: "The right to free speech is enshrined in the constitution." },
        { topic: "Reading", word: "Channel", phonetic: "/ˈtʃænl/", form: "Verb", forms: "N: Channel", def: "Direct toward a particular end or object.", translation: "Hướng vào, rót vào (direct)", example: "She decided to channel her energy into learning a new language." },
        { topic: "Reading", word: "Intellect", phonetic: "/ˈɪntəlekt/", form: "Noun", forms: "Adj: Intellectual | Adv: Intellectually", def: "The faculty of reasoning and understanding objectively.", translation: "Trí tuệ", example: "He is a man of great intellect and widely respected in academia." },
        { topic: "Reading", word: "Craftsmanship", phonetic: "/ˈkrɑːftsmənʃɪp/", form: "Noun", forms: "N: Craftsman, Craft", def: "Skill in a particular craft.", translation: "Sự khéo léo, tay nghề", example: "The exquisite detail of the furniture shows incredible craftsmanship." },
        { topic: "Reading", word: "Symbiosis", phonetic: "/ˌsɪmbiˈəʊsɪs/", form: "Noun", forms: "Adj: Symbiotic", def: "A mutually beneficial relationship between different people or groups.", translation: "Sự cộng sinh", example: "There is a perfect symbiosis between the bees and the flowers in the garden." },
        { topic: "Reading", word: "Alumni", phonetic: "/əˈlʌmnaɪ/", form: "Noun", forms: "N (Singular): Alumnus", def: "Graduates or former students of a particular school, college, or university.", translation: "Cựu sinh viên", example: "Many wealthy alumni donate money to their former university." },
        { topic: "Reading", word: "Discipline", phonetic: "/ˈdɪsəplɪn/", form: "Noun", forms: "Adj: Disciplinary | V: Discipline", def: "A branch of knowledge, typically one studied in higher education.", translation: "Ngành học, kỷ luật", example: "Sociology is a broad academic discipline." },
        { topic: "Reading", word: "Irresistible", phonetic: "/ˌɪrɪˈzɪstəbl/", form: "Adjective", forms: "V: Resist | N: Resistance", def: "Too attractive and tempting to be resisted.", translation: "Không thể cưỡng lại", example: "The smell of fresh baking was simply irresistible." },
        { topic: "Reading", word: "Lapsed", phonetic: "/læpst/", form: "Adjective", forms: "V/N: Lapse", def: "No longer valid; having ceased to be active in practice, membership, or belief.", translation: "Hết hạn, không còn giữ thói quen", example: "I am a lapsed gym member; I haven't been in months." },
        { topic: "Reading", word: "Reinvigorate", phonetic: "/ˌriːɪnˈvɪɡəreɪt/", form: "Verb", forms: "N: Reinvigoration", def: "Give new energy or strength to.", translation: "Hồi sinh, truyền sức sống mới", example: "A brisk walk in the cold air really reinvigorated me." },
        { topic: "Reading", word: "Streamline", phonetic: "/ˈstriːmlaɪn/", form: "Verb", forms: "Adj: Streamlined", def: "Make an organization or system more efficient and effective.", translation: "Tinh giản, hợp lý hóa", example: "We need to streamline our production process to reduce costs." },
        { topic: "Reading", word: "Flag", phonetic: "/flæɡ/", form: "Verb", forms: "N: Flag", def: "Become tired, weaker, or less enthusiastic.", translation: "Yếu đi, giảm sút", example: "My energy began to flag after four hours of studying." },
        { topic: "Reading", word: "Supplement", phonetic: "/ˈsʌplɪmənt/", form: "Verb / Noun", forms: "Adj: Supplementary", def: "Add an extra element or amount to.", translation: "Bổ sung", example: "He takes vitamins to supplement his daily diet." },
        { topic: "Reading", word: "Take something on", phonetic: "/teɪk ɒn/", form: "Phrasal Verb", forms: "N/A", def: "To agree to be responsible for something or to hire someone.", translation: "Đảm nhận, tuyển dụng", example: "She is reluctant to take on any more responsibilities at work." },
        { topic: "Reading", word: "Head back", phonetic: "/hed bæk/", form: "Phrasal Verb", forms: "N/A", def: "To return to a place.", translation: "Quay trở lại", example: "It's getting late; we should probably head back to the hotel." },
        { topic: "Reading", word: "Drop out", phonetic: "/drɒp aʊt/", form: "Phrasal Verb", forms: "N: Dropout", def: "Leave an educational institution or course without completing it.", translation: "Bỏ học giữa chừng", example: "He decided to drop out of university to start his own business." },

    // --- DOM Injection ---
    function renderGrid() {
        const grid = document.getElementById('grid-view');
        grid.innerHTML = '';
        vocabBank.forEach(item => {
            const article = document.createElement('article');
            article.className = 'vocab-card';
            article.setAttribute('data-topic', item.topic);
            
            article.innerHTML = `
                <div class="word-header">
                    <div class="word-main">
                        <span class="word">${item.word}</span>
                        <button class="audio-btn" onclick="playAudio('${item.word.replace(/'/g, "\\'")}')" title="Listen to pronunciation">🔊</button>
                    </div>
                    <div class="meta-info">
                        <span class="phonetic">${item.phonetic}</span>
                    </div>
                </div>
                <div class="word-families"><strong>Form:</strong> ${item.form}</div>
                <div class="word-families" style="background-color: #fef08a; border-color: #fde047; color: #854d0e;"><strong>Related Forms:</strong> ${item.forms}</div>
                <span class="topic-tag">${item.topic}</span>
                <p class="definition"><strong>Meaning:</strong> ${item.def}</p>
                <p class="translation"><strong>Vietnamese:</strong> ${item.translation}</p>
                
                <div class="example-box">
                    <span>Usage Example</span>"${item.example}"
                </div>
            `;
            grid.appendChild(article);
        });
    }

    // Initialize Grid
    renderGrid();

    // --- Audio Synthesis ---
    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Sorry, your browser doesn't support text-to-speech pronunciation.");
        }
    }

    function playAudioFromCard(event) {
        event.stopPropagation();
        const word = document.getElementById('fc-word').textContent;
        playAudio(word);
    }

    // --- Topic Filtering ---
    function filterTopic(topicName) {
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const allCards = document.querySelectorAll('.vocab-card');
        allCards.forEach(card => {
            if (topicName === 'all' || card.getAttribute('data-topic') === topicName) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        if(document.getElementById('flashcard-view').style.display === 'flex') {
             extractDataFromGrid(topicName);
             currentCardIndex = 0;
             updateFlashcardUI();
        }
    }

    // --- View Toggling ---
    function switchView(viewName) {
        const gridView = document.getElementById('grid-view');
        const flashcardView = document.getElementById('flashcard-view');
        const btnGrid = document.getElementById('btn-grid');
        const btnFlashcards = document.getElementById('btn-flashcards');

        if (viewName === 'grid') {
            gridView.style.display = 'grid';
            flashcardView.style.display = 'none';
            btnGrid.classList.add('active');
            btnFlashcards.classList.remove('active');
        } else {
            gridView.style.display = 'none';
            flashcardView.style.display = 'flex';
            btnFlashcards.classList.add('active');
            btnGrid.classList.remove('active');
            
            const activeFilter = document.querySelector('.filter-btn.active').textContent;
            let topicName = 'all';
            if (activeFilter.includes('Reading')) topicName = 'Reading';
            if (activeFilter.includes('Speaking')) topicName = 'Speaking';
            
            extractDataFromGrid(topicName);
            currentCardIndex = 0;
            updateFlashcardUI();
        }
    }

    // --- Flashcard Logic ---
    let flashcardData = [];
    let currentCardIndex = 0;
    const flashcardScene = document.getElementById('flashcard-scene');

    function extractDataFromGrid(topicName = 'all') {
        flashcardData = [];
        vocabBank.forEach(item => {
            if (topicName === 'all' || item.topic === topicName) {
                flashcardData.push(item);
            }
        });
    }

    function updateFlashcardUI() {
        if (flashcardData.length === 0) return;
        const data = flashcardData[currentCardIndex];
        
        flashcardScene.classList.remove('is-flipped');
        
        setTimeout(() => {
            document.getElementById('fc-word').textContent = data.word;
            document.getElementById('fc-phonetic').textContent = data.phonetic;
            document.getElementById('fc-topic').textContent = data.topic;
            document.getElementById('fc-forms').innerHTML = `<strong>Form:</strong> ${data.form}`;
            document.getElementById('fc-related').innerHTML = `<strong>Related Forms:</strong> ${data.forms}`;
            
            document.getElementById('fc-definition').textContent = data.def;
            document.getElementById('fc-translation').textContent = data.translation;
            
            const examplesHTML = `
                <div class="example-box" style="margin-bottom: 0.5rem; background-color: #ffedd5; padding: 1rem; border-left: 4px solid #ea580c; border-radius: 8px; font-size: 0.95rem; color: #1e293b;">
                    <span style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #ea580c; margin-bottom: 0.25rem; font-weight: bold;">Usage Example</span>"${data.example}"
                </div>
            `;
            document.getElementById('fc-example-container').innerHTML = examplesHTML;
            
            document.getElementById('fc-counter').textContent = `${currentCardIndex + 1} / ${flashcardData.length}`;
            
            document.getElementById('fc-prev').disabled = currentCardIndex === 0;
            document.getElementById('fc-next').disabled = currentCardIndex === flashcardData.length - 1;
        }, 150);
    }

    function flipCard() { flashcardScene.classList.toggle('is-flipped'); }
    function nextCard() { if (currentCardIndex < flashcardData.length - 1) { currentCardIndex++; updateFlashcardUI(); } }
    function prevCard() { if (currentCardIndex > 0) { currentCardIndex--; updateFlashcardUI(); } }
    
    function shuffleCards() {
        for (let i = flashcardData.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcardData[i], flashcardData[j]] = [flashcardData[j], flashcardData[i]];
        }
        currentCardIndex = 0;
        updateFlashcardUI();
    }
</script>
</body>
